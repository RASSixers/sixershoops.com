<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile — Sixers Hoops</title>
    <link rel="stylesheet" href="/navbar-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d1117;
            color: #e8eaf0;
            padding-top: 60px;
            min-height: 100vh;
        }

        /* ── Profile Banner ── */
        .profile-banner {
            background: linear-gradient(135deg, #0a1628 0%, #0d1f3c 40%, #0a1628 100%);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 2rem 0 0;
        }
        .profile-banner-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .profile-identity {
            display: flex;
            align-items: flex-end;
            gap: 1.25rem;
            padding-bottom: 1.25rem;
        }
        .profile-avatar-wrap { position: relative; flex-shrink: 0; }
        .profile-avatar-large {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(0,107,182,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: white;
            overflow: hidden;
            background: #001a57;
        }
        .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }

        .profile-identity-info { flex: 1; min-width: 0; }
        .profile-displayname {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: 0.03em;
            color: #ffffff;
            line-height: 1.1;
        }
        .profile-handle { font-size: 0.8rem; color: rgba(255,255,255,0.45); margin-top: 3px; }
        .profile-stats-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.55rem;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.55);
        }
        .profile-stats-row strong {
            color: #ffffff;
            font-weight: 700;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.95rem;
        }
        .profile-stats-dot { opacity: 0.3; }

        .profile-actions {
            display: flex;
            align-items: flex-end;
            gap: 0.6rem;
            padding-bottom: 1.25rem;
            flex-shrink: 0;
        }
        .btn-follow {
            padding: 0.45rem 1.2rem;
            background: #006BB6;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, transform 0.12s;
        }
        .btn-follow:hover { background: #0080d4; transform: translateY(-1px); }
        .btn-follow.following {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-icon {
            width: 36px; height: 36px;
            border-radius: 8px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.6);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.12); color: white; }
        .btn-icon svg { width: 15px; height: 15px; }

        .profile-tabs {
            display: flex;
            gap: 0;
            border-top: 1px solid rgba(255,255,255,0.07);
        }
        .profile-tab {
            padding: 0.75rem 1.25rem;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            border: none;
            border-bottom: 2px solid transparent;
            background: transparent;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .profile-tab:hover { color: rgba(255,255,255,0.75); }
        .profile-tab.active { color: #ffffff; border-bottom-color: #006BB6; }

        /* ── Layout ── */
        .profile-content {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 1.5rem 4rem;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 1.5rem;
            align-items: start;
        }

        /* ── Sort bar ── */
        .sort-bar {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            background: #161b27;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 0.4rem;
            margin-bottom: 1rem;
        }
        .sort-btn {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.85rem;
            border-radius: 7px;
            border: none;
            background: transparent;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.73rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .sort-btn svg { width: 13px; height: 13px; }
        .sort-btn.active { background: rgba(255,255,255,0.09); color: #ffffff; }
        .sort-btn:hover { color: rgba(255,255,255,0.8); }

        /* ── Feed cards ── */
        .feed-list { display: flex; flex-direction: column; gap: 0.6rem; }

        .feed-card {
            background: #161b27;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 1rem 1.15rem;
            transition: border-color 0.15s, background 0.15s;
        }
        .feed-card:hover { border-color: rgba(0,107,182,0.35); background: #1a2035; }

        .feed-card-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
        }
        .feed-card-avatar {
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: 0.75rem;
            color: white;
            overflow: hidden;
            flex-shrink: 0;
        }
        .feed-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .feed-card-username { font-size: 0.82rem; font-weight: 600; color: #c8cfe0; }
        .feed-card-time { font-size: 0.72rem; color: rgba(255,255,255,0.3); margin-left: auto; }

        .feed-card-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.01em;
            margin-bottom: 0.35rem;
            line-height: 1.3;
        }
        .feed-card-body {
            font-size: 0.83rem;
            color: rgba(255,255,255,0.55);
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }
        .feed-card-footer { display: flex; align-items: center; gap: 0.5rem; }
        .feed-card-action {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
            background: transparent;
            font-size: 0.73rem;
            font-weight: 600;
            color: rgba(255,255,255,0.45);
            cursor: pointer;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
            text-decoration: none;
        }
        .feed-card-action:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.15); }
        .feed-card-action svg { width: 12px; height: 12px; }
        .feed-card-action.view-post { margin-left: auto; }
        .feed-card-action.view-post:hover { background: rgba(0,107,182,0.15); border-color: rgba(0,107,182,0.4); color: #4da8ff; }

        .feed-card.is-comment { border-left: 3px solid rgba(0,107,182,0.4); }
        .post-context { font-size: 0.72rem; color: rgba(255,255,255,0.3); margin-bottom: 0.4rem; }
        .post-context a { color: rgba(77,168,255,0.85); text-decoration: none; }
        .post-context a:hover { text-decoration: underline; }
        .feed-card-snippet { font-size: 0.83rem; color: rgba(255,255,255,0.65); line-height: 1.5; }

        /* ── Sidebar ── */
        .profile-sidebar { display: flex; flex-direction: column; gap: 1rem; }
        .sidebar-card {
            background: #161b27;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 1rem 1.1rem;
        }
        .sidebar-card-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 0.75rem;
        }
        .sidebar-about-bio { font-size: 0.82rem; color: rgba(255,255,255,0.6); line-height: 1.55; margin-bottom: 0.75rem; }
        .sidebar-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 0.45rem;
        }
        .sidebar-meta-item svg { width: 13px; height: 13px; opacity: 0.5; flex-shrink: 0; }
        .sidebar-stat-row {
            display: flex;
            gap: 1.25rem;
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .sidebar-stat { text-align: center; }
        .sidebar-stat-num {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
        }
        .sidebar-stat-label {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-top: 2px;
        }
        .btn-create-post {
            display: block;
            width: 100%;
            padding: 0.7rem;
            background: #006BB6;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.15s, transform 0.12s;
            margin-top: 0.75rem;
        }
        .btn-create-post:hover { background: #0080d4; transform: translateY(-1px); }

        /* ── States ── */
        .empty-state {
            padding: 3.5rem 1rem;
            text-align: center;
            color: rgba(255,255,255,0.25);
        }
        .empty-state p {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }
        .skeleton {
            background: linear-gradient(90deg, #1a2035 25%, #21284a 50%, #1a2035 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        .not-found-wrap {
            text-align: center;
            padding: 6rem 1.5rem;
            grid-column: 1 / -1;
        }
        .not-found-wrap h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }
        .not-found-wrap p { color: rgba(255,255,255,0.4); font-size: 0.9rem; }
        .not-found-wrap a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.6rem 1.4rem;
            background: #006BB6;
            color: white;
            border-radius: 9px;
            text-decoration: none;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .profile-content { grid-template-columns: 1fr; }
            .profile-sidebar { order: -1; }
            .profile-actions { display: none; }
            .profile-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .profile-tabs::-webkit-scrollbar { display: none; }
        }
    </style>
</head>
<body>
    <script src="/nav.js"></script>

    <!-- Banner placeholder -->
    <div id="pageBanner">
        <div class="profile-banner">
            <div class="profile-banner-inner">
                <div class="profile-identity">
                    <div class="skeleton" style="width:80px;height:80px;border-radius:50%;flex-shrink:0;"></div>
                    <div style="flex:1;">
                        <div class="skeleton" style="height:22px;width:50%;margin-bottom:10px;"></div>
                        <div class="skeleton" style="height:13px;width:30%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main content placeholder -->
    <div class="profile-content" id="pageContent">
        <div>
            <div class="skeleton" style="height:46px;border-radius:10px;margin-bottom:1rem;"></div>
            <div class="skeleton" style="height:110px;border-radius:10px;margin-bottom:0.6rem;"></div>
            <div class="skeleton" style="height:110px;border-radius:10px;margin-bottom:0.6rem;"></div>
            <div class="skeleton" style="height:110px;border-radius:10px;"></div>
        </div>
        <div>
            <div class="skeleton" style="height:200px;border-radius:10px;"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
    (function() {
        const FB_CONFIG = {
            apiKey: "AIzaSyBzMlBV5gbZZlg_eTwNWrRDrhx-_ATIPS0",
            authDomain: "pickem-1e12b.firebaseapp.com",
            projectId: "pickem-1e12b",
            storageBucket: "pickem-1e12b.appspot.com",
            messagingSenderId: "715626120695",
            appId: "1:715626120695:web:4942646cf3d6ca7e181af2"
        };

        let currentTab = 'posts';
        let currentSort = 'new';
        let gUserData = null;
        let gPosts = [];
        let gComments = [];

        // ── Utils ─────────────────────────────────────────────────
        function esc(s) {
            if (!s) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }
        function timeAgo(ts) {
            try {
                const date = ts && ts.toDate ? ts.toDate() : new Date(ts);
                const s = Math.floor((Date.now() - date) / 1000);
                if (s < 60) return 'just now';
                for (const [sec, l] of [[31536000,'y'],[2592000,'mo'],[86400,'d'],[3600,'h'],[60,'m']]) {
                    const n = Math.floor(s / sec);
                    if (n >= 1) return n + l;
                }
            } catch(_) {}
            return '';
        }
        function fmtDate(iso) {
            try { return new Date(iso).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); }
            catch(_) { return ''; }
        }
        function colorFor(s) {
            const c = ['#001a57','#006BB6','#c0392b','#475569','#1e293b','#0057a0'];
            if (!s) return c[0];
            let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffffffff;
            return c[Math.abs(h) % c.length];
        }
        function mkAvatar(photoURL, name, color, size) {
            const bg = photoURL ? '#0b0f1a' : (color || colorFor(name));
            const inner = photoURL
                ? `<img src="${esc(photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover;">`
                : (name || 'U').charAt(0).toUpperCase();
            return `<div class="feed-card-avatar" style="width:${size}px;height:${size}px;background:${bg};">${inner}</div>`;
        }

        // ── Banner ────────────────────────────────────────────────
        function renderBanner(ud, postCount, myUid) {
            const isOwn = myUid && myUid === ud._uid;
            const avatarBg = ud.photoURL ? '#0b0f1a' : (ud.avatarColor || '#001a57');
            const avatarInner = ud.photoURL
                ? `<img src="${esc(ud.photoURL)}" alt="">`
                : (ud.username || 'U').charAt(0).toUpperCase();

            document.getElementById('pageBanner').innerHTML = `
            <div class="profile-banner">
                <div class="profile-banner-inner">
                    <div class="profile-identity">
                        <div class="profile-avatar-wrap">
                            <div class="profile-avatar-large" style="background:${avatarBg}">${avatarInner}</div>
                        </div>
                        <div class="profile-identity-info">
                            <div class="profile-displayname">${esc(ud.username || 'Unknown')}</div>
                            <div class="profile-handle">u/${esc(ud.usernameLower || ud.username || '')}</div>
                            <div class="profile-stats-row">
                                <strong>${ud.followerCount || 0}</strong> Followers
                                <span class="profile-stats-dot">·</span>
                                <strong>${ud.followingCount || 0}</strong> Following
                            </div>
                        </div>
                        <div class="profile-actions">
                            ${isOwn
                                ? `<button class="btn-follow" id="bannerEditBtn">Edit Profile</button>`
                                : `<button class="btn-follow" id="bannerFollowBtn">Follow</button>`}
                            <button class="btn-icon" id="bannerShareBtn" title="Share profile">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="profile-tabs" id="profileTabs">
                        <button class="profile-tab active" data-tab="posts">Posts</button>
                        <button class="profile-tab" data-tab="comments">Comments</button>
                        <button class="profile-tab" data-tab="likes">Likes</button>
                    </div>
                </div>
            </div>`;

            // Tab events
            document.querySelectorAll('.profile-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    renderFeed();
                });
            });

            // Follow
            const followBtn = document.getElementById('bannerFollowBtn');
            if (followBtn) {
                let f = false;
                followBtn.addEventListener('click', () => {
                    f = !f;
                    followBtn.textContent = f ? 'Following' : 'Follow';
                    followBtn.classList.toggle('following', f);
                });
            }

            // Edit profile
            const editBtn = document.getElementById('bannerEditBtn');
            if (editBtn) {
                editBtn.addEventListener('click', () => {
                    if (window.openProfileModal) window.openProfileModal();
                    else document.getElementById('userProfileBtn')?.click();
                });
            }

            // Share
            document.getElementById('bannerShareBtn')?.addEventListener('click', () => {
                if (navigator.share) navigator.share({ title: ud.username, url: location.href });
                else navigator.clipboard?.writeText(location.href);
            });
        }

        // ── Sidebar ───────────────────────────────────────────────
        function renderSidebar(ud, postCount, myUid) {
            const isOwn = myUid && myUid === ud._uid;
            const joinDate = fmtDate(ud.createdAt);
            document.getElementById('sidebarContent').innerHTML = `
            <div class="sidebar-card">
                <div class="sidebar-card-title">About u/${esc(ud.usernameLower || ud.username || '')}</div>
                <div class="sidebar-about-bio">${ud.bio ? esc(ud.bio) : '<span style="opacity:.4">Sixers fan</span>'}</div>
                ${joinDate ? `<div class="sidebar-meta-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Joined ${joinDate}
                </div>` : ''}
                <div class="sidebar-stat-row">
                    <div class="sidebar-stat">
                        <div class="sidebar-stat-num">${ud.followerCount || 0}</div>
                        <div class="sidebar-stat-label">Followers</div>
                    </div>
                    <div class="sidebar-stat">
                        <div class="sidebar-stat-num">${postCount}</div>
                        <div class="sidebar-stat-label">Posts</div>
                    </div>
                </div>
                ${isOwn ? `<a href="/" class="btn-create-post">+ Create Post</a>` : ''}
            </div>`;
        }

        // ── Feed ──────────────────────────────────────────────────
        function renderFeed() {
            const container = document.getElementById('feedContent');

            const sortBar = `
            <div class="sort-bar">
                <button class="sort-btn ${currentSort==='new'?'active':''}" data-sort="new">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>New
                </button>
                <button class="sort-btn ${currentSort==='top'?'active':''}" data-sort="top">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>Top
                </button>
            </div>`;

            let items = [];
            if (currentTab === 'posts') {
                items = [...gPosts];
                if (currentSort === 'top') items.sort((a,b)=>(b.upvotes||b.voteCount||0)-(a.upvotes||a.voteCount||0));
            } else if (currentTab === 'comments') {
                items = [...gComments];
            } else {
                container.innerHTML = sortBar + `<div class="empty-state"><p>Liked posts will appear here</p></div>`;
                attachSort();
                return;
            }

            if (!items.length) {
                container.innerHTML = sortBar + `<div class="empty-state"><p>No ${currentTab} yet</p></div>`;
                attachSort();
                return;
            }

            const ud = gUserData;
            const name = ud.username || 'User';
            const photo = ud.photoURL || '';
            const color = ud.avatarColor || '#001a57';

            const cardsHTML = items.map(item => {
                if (currentTab === 'comments') {
                    const postUrl = item.postUrl || (item.postId ? `/post/${item.postId}` : '#');
                    return `
                    <div class="feed-card is-comment">
                        <div class="post-context">Commented on ${item.postTitle ? `<a href="${esc(postUrl)}">${esc(item.postTitle)}</a>` : 'a post'}</div>
                        <div class="feed-card-header">
                            ${mkAvatar(photo, name, color, 30)}
                            <span class="feed-card-username">${esc(name)}</span>
                            <span class="feed-card-time">${timeAgo(item.createdAt)}</span>
                        </div>
                        <div class="feed-card-snippet">${esc(item.body || item.text || item.content || '')}</div>
                        <div class="feed-card-footer" style="margin-top:.65rem;">
                            <button class="feed-card-action">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                ${item.likes || item.upvotes || 0}
                            </button>
                            ${postUrl !== '#' ? `<a class="feed-card-action view-post" href="${esc(postUrl)}">View Post</a>` : ''}
                        </div>
                    </div>`;
                }
                const postUrl = item.url || item.link || (item.postId ? `/post/${item.postId}` : '#');
                return `
                <div class="feed-card">
                    <div class="feed-card-header">
                        ${mkAvatar(photo, name, color, 30)}
                        <span class="feed-card-username">${esc(name)}</span>
                        <span class="feed-card-time">${timeAgo(item.createdAt)}</span>
                    </div>
                    ${item.title || item.headline ? `<div class="feed-card-title">${esc(item.title || item.headline)}</div>` : ''}
                    ${item.body || item.content ? `<div class="feed-card-body">${esc(item.body || item.content)}</div>` : ''}
                    <div class="feed-card-footer">
                        <button class="feed-card-action">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            ${item.upvotes || item.voteCount || 0}
                        </button>
                        <button class="feed-card-action">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            ${item.commentCount || 0}
                        </button>
                        ${postUrl !== '#' ? `<a class="feed-card-action view-post" href="${esc(postUrl)}">View Post</a>` : ''}
                    </div>
                </div>`;
            }).join('');

            container.innerHTML = sortBar + `<div class="feed-list">${cardsHTML}</div>`;
            attachSort();
        }

        function attachSort() {
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', () => { currentSort = btn.dataset.sort; renderFeed(); });
            });
        }

        function renderPage(ud, posts, comments, myUid) {
            gUserData = ud; gPosts = posts; gComments = comments;
            document.title = `${ud.username || 'User'} — Sixers Hoops`;

            renderBanner(ud, posts.length, myUid);

            document.getElementById('pageContent').innerHTML = `
                <div id="feedContent"></div>
                <div class="profile-sidebar"><div id="sidebarContent"></div></div>`;

            renderSidebar(ud, posts.length, myUid);
            renderFeed();
        }

        function showNotFound(msg) {
            document.getElementById('pageBanner').innerHTML = '';
            document.getElementById('pageContent').innerHTML = `
                <div class="not-found-wrap">
                    <h1>User Not Found</h1>
                    <p>${esc(msg || "We couldn't find a Sixers Hoops member with that username.")}</p>
                    <a href="/">Back to Home</a>
                </div>`;
        }

        // ── Firebase ──────────────────────────────────────────────
        function getDB() {
            if (window.db) return window.db;
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
                return firebase.firestore();
            }
            return null;
        }
        function waitForDB(cb, n = 0) {
            const d = getDB();
            if (d) { cb(d); return; }
            if (n > 25) { showNotFound('Could not connect.'); return; }
            setTimeout(() => waitForDB(cb, n + 1), 300);
        }

        const slug = location.pathname.split('/').filter(Boolean)[1] || '';
        if (!slug) { showNotFound('No username in URL.'); return; }

        waitForDB(async (db) => {
            let myUid = null;
            try { myUid = window.auth?.currentUser?.uid || firebase.auth().currentUser?.uid || null; } catch(_) {}

            try {
                const userSnap = await db.collection('users').where('usernameLower', '==', slug).limit(1).get();
                if (userSnap.empty) { showNotFound(); return; }
                const ud = { _uid: userSnap.docs[0].id, ...userSnap.docs[0].data() };

                let posts = [], comments = [];
                try {
                    const ps = await db.collection('posts').where('authorId','==',ud._uid).orderBy('createdAt','desc').limit(50).get();
                    posts = ps.docs.map(d => ({ postId: d.id, ...d.data() }));
                } catch(_) {
                    try { const ps = await db.collection('posts').where('authorId','==',ud._uid).limit(50).get();
                        posts = ps.docs.map(d => ({ postId: d.id, ...d.data() })); } catch(__) {}
                }
                try {
                    const cs = await db.collection('comments').where('authorId','==',ud._uid).orderBy('createdAt','desc').limit(50).get();
                    comments = cs.docs.map(d => ({ commentId: d.id, ...d.data() }));
                } catch(_) {
                    try { const cs = await db.collection('comments').where('authorId','==',ud._uid).limit(50).get();
                        comments = cs.docs.map(d => ({ commentId: d.id, ...d.data() })); } catch(__) {}
                }

                renderPage(ud, posts, comments, myUid);
            } catch(err) {
                console.error(err);
                showNotFound('Something went wrong loading this profile.');
            }
        });
    })();
    </script>
</body>
</html>
