<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sixers Hoops</title>
<script>
  // GitHub Pages SPA redirect trick
  // Converts /article/some-slug → article.html, storing the path so it can be restored
  (function() {
    var path = window.location.pathname;
    // Only intercept /article/* paths
    if (path.indexOf('/article/') === 0) {
      var slug = path.replace('/article/', '').replace(/\/$/, '');
      if (slug) {
        window.location.replace('/article.html?slug=' + encodeURIComponent(slug));
        return;
      }
    }
    // All other 404s — redirect home
    window.location.replace('/');
  })();
</script>
</head>
<body></body>
</html>
