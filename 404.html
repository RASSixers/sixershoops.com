<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sixers Hoops</title>
  <script>
(function () {
  var path = location.pathname.replace(/\/+$/, '') || '/';
  var search = location.search || '';
  var hash = location.hash || '';

  // Pretty profile URLs:
  // /user/{name} and /user/{name}/inbox|notifications|settings
  if (/^\/user\/[^/]+/i.test(path)) {
    try { sessionStorage.setItem('spa_user_path', path + search + hash); } catch (e) {}
    location.replace('/user.html');
    return;
  }

  // Community feed
  if (/^\/community$/i.test(path)) {
    location.replace('/community.html' + search + hash);
    return;
  }

  // Community post: /community/p/{id} or /community/p/{id}/{slug}
  var cPost = path.match(/^\/community\/p\/([^/]+)(?:\/[^/]*)?$/i);
  if (cPost) {
    location.replace('/trade.html?id=' + encodeURIComponent(decodeURIComponent(cPost[1])) + hash);
    return;
  }

  // Legacy: /trade/{id}/optional-slug
  var trade = path.match(/^\/trade\/([^/]+)/i);
  if (trade) {
    location.replace('/trade.html?id=' + encodeURIComponent(decodeURIComponent(trade[1])) + hash);
    return;
  }

  // Legacy feed
  if (/^\/trades$/i.test(path)) {
    location.replace('/community.html' + search + hash);
    return;
  }

  // /article/{slug}
  var article = path.match(/^\/article\/(.+)$/i);
  if (article) {
    location.replace('/article.html?slug=' + encodeURIComponent(decodeURIComponent(article[1])) + hash);
    return;
  }

  location.replace('/' + (search || '') + (hash || ''));
})();
  </script>
</head>
<body>
  <p style="font-family:Lexend,system-ui,sans-serif;text-align:center;padding:3rem;color:#64748b">Loading…</p>
</body>
</html>
