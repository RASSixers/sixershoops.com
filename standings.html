<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>NBA Standings | SixersHoops</title>
  <link rel="icon" href="/favicon.ico"/>
  <link rel="apple-touch-icon" href="/favicon.ico"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="navbar-styles.css"/>

  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T1V9Q0MNEM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T1V9Q0MNEM');
  </script>

  <style>
    /* ── Design tokens — exact match to trade machine ── */
    :root {
      --navy: #001a57;
      --navy-deep: #0b0f1a;
      --sixers-blue: #006BB6;
      --sixers-red: #ED174C;
      --cream: #f7f8fc;
      --ink: #0d0f1a;
      --mid: #64748b;
      --border-light: #e4e8f0;
      --card-bg: #ffffff;
      --green: #16a34a;
      --red: #dc2626;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.6;
      padding-top: 64px;
      overflow-x: hidden;
    }

    /* ── PAGE HERO — matches trade machine exactly ── */
    .page-header {
      background: var(--cream);
      position: relative;
      overflow: hidden;
    }
    .page-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(0,107,182,0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }
    .hero-glow-blue {
      position: absolute;
      right: -120px; top: -80px;
      width: 600px; height: 500px;
      background: radial-gradient(ellipse at center, rgba(0,107,182,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .hero-glow-red {
      position: absolute;
      left: -60px; bottom: -40px;
      width: 400px; height: 300px;
      background: radial-gradient(ellipse at center, rgba(237,23,76,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 4.5rem 2rem 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(3.2rem, 8vw, 6rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--ink);
      margin: 0;
    }
    .page-title .highlight {
      display: block;
      color: var(--sixers-blue);
    }
    .hero-divider {
      width: 32px; height: 3px;
      background: var(--sixers-red);
      border-radius: 2px;
      margin: 1.4rem auto 1.2rem;
    }
    .page-subtitle {
      font-family: 'Barlow', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--mid);
      max-width: 420px;
      line-height: 1.65;
      margin: 0 auto;
    }

    /* ── CONTENT WRAPPER ── */
    .content-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── BOARD CARD — matches trade machine tm-board ── */
    .standings-container {
      position: relative;
      background: #ffffff;
      border: 1px solid #e6eaf2;
      border-radius: 14px;
      padding: 1.5rem 1.5rem 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 28px -18px rgba(15,23,42,.18);
      overflow: hidden;
    }
    .standings-container::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--sixers-blue), #1e90d8 60%, var(--sixers-blue));
    }

    /* ── CONFERENCE SECTIONS ── */
    .conference-section { margin-bottom: 3rem; }
    .conference-section:last-child { margin-bottom: 0; }

    .conference-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .65rem; font-weight: 800;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--mid);
      display: flex; align-items: center; gap: .6rem;
      margin-bottom: 1rem;
    }
    .conference-title::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

    /* ── TABLE ── */
    .table-responsive { overflow-x: auto; border-radius: 10px; border: 1px solid #e6eaf2; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-family: 'Barlow', sans-serif; }

    th {
      background: #f8f9fc;
      color: #8693a8;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      padding: 0.8rem 1rem;
      text-align: left;
      border-bottom: 1px solid #e6eaf2;
    }
    th:not(:first-child) { text-align: center; }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #eef1f6;
      color: var(--ink);
      font-weight: 500;
    }
    td:not(:first-child) { text-align: center; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(0,107,182,.03); }

    .team-info {
      display: flex; align-items: center; gap: 0.65rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.03em; font-size: 0.9rem;
    }
    .sixers-highlight { background: rgba(0,107,182,0.05) !important; border-left: 3px solid var(--sixers-blue); }
    .rank {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 900;
      color: #0d1530; width: 28px; display: inline-block;
    }
    .pct, .gb {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900; font-size: 0.95rem; color: #0d1530;
    }
    .gb { color: var(--mid); font-weight: 700; }

    .status-badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0; width: 40px; height: 20px;
      border-radius: 4px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.68rem; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .streak-w { background: rgba(22,163,74,0.1); color: #15803d; border: 1px solid rgba(22,163,74,0.25); }
    .streak-l { background: rgba(220,38,38,0.08); color: #b91c1c; border: 1px solid rgba(220,38,38,0.2); }

    /* ── LOADER ── */
    .loader { text-align: center; padding: 4rem; }
    .loader-spinner {
      border: 3px solid #e6eaf2;
      border-top: 3px solid var(--sixers-blue);
      border-radius: 50%; width: 36px; height: 36px;
      animation: spin 1s linear infinite; margin: 0 auto 1rem;
    }
    .loader p { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mid); }
    @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

    /* ── EXPORT CONTAINER — matches trade machine btn styling ── */
    .export-container {
      margin-bottom: 1.5rem;
      background: #ffffff;
      border: 1px solid #e6eaf2;
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      box-shadow: 0 1px 2px rgba(15,23,42,.04);
    }
    .export-btns-group { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }

    /* Ghost button */
    .export-btn {
      display: inline-flex; align-items: center; gap: 0.45rem;
      background: white; color: var(--mid);
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
      font-size: .82rem; letter-spacing: .1em; text-transform: uppercase;
      padding: .6rem 1.3rem; border-radius: 8px;
      border: 1px solid var(--border-light); cursor: pointer; transition: all .2s;
    }
    .export-btn:hover { border-color: var(--sixers-blue); color: var(--sixers-blue); }

    /* Primary blue button */
    .export-btn.primary {
      background: var(--sixers-blue); color: white;
      border-color: var(--sixers-blue);
      box-shadow: 0 2px 12px rgba(0,107,182,0.25);
    }
    .export-btn.primary:hover { background: #0080d4; border-color: #0080d4; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,107,182,.35); }

    /* ── EXPORT MODAL — dark overlay matches trade machine ── */
    .export-modal {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5,8,20,.88);
      z-index: 2000;
      justify-content: center; align-items: center;
    }
    .export-modal.open { display: flex; }
    .export-modal-content {
      background: #0d1530;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 1.75rem;
      max-width: 95vw; width: auto;
      max-height: 95vh; overflow-y: auto;
      text-align: center;
      display: flex; flex-direction: column; align-items: center;
      gap: 1.25rem;
      box-shadow: 0 32px 80px rgba(0,0,0,.6);
    }
    .export-modal-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .65rem; font-weight: 800;
      letter-spacing: .18em; text-transform: uppercase;
      color: rgba(255,255,255,.35);
      align-self: flex-start;
    }
    .export-preview {
      max-width: 100%; max-height: calc(95vh - 220px);
      border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.5);
      object-fit: contain;
    }
    .export-actions {
      display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; width: 100%;
    }
    .modal-btn {
      display: inline-flex; align-items: center; gap: .45rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; font-size: .78rem;
      letter-spacing: .12em; text-transform: uppercase;
      padding: .6rem 1.3rem; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.85);
      cursor: pointer; transition: all .2s;
    }
    .modal-btn:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.25); }
    .modal-btn.btn-download { background: var(--sixers-blue); border-color: var(--sixers-blue); color: white; box-shadow: 0 2px 12px rgba(0,107,182,.3); text-decoration: none; }
    .modal-btn.btn-download:hover { background: #0080d4; transform: translateY(-1px); }
    .modal-btn.btn-close { color: rgba(255,255,255,.45); }

    /* ── Social export (hidden off-screen) ── */
    #social-export-container {
      position: fixed; left: -9999px; top: -9999px;
      width: 1200px;
      background: var(--cream);
      padding: 60px;
      font-family: 'Barlow', sans-serif;
      color: var(--ink);
    }
    #social-export-container * { box-sizing: border-box; }
    .social-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 40px;
      border-bottom: 3px solid var(--sixers-blue);
      padding-bottom: 24px; width: 100%;
    }
    .social-title-box h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px; font-weight: 900; color: var(--ink);
      letter-spacing: -1px; line-height: 1; margin: 0 0 8px;
    }
    .social-title-box p { font-size: 16px; color: var(--mid); margin: 0; font-weight: 600; }
    .social-branding .domain {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 40px; font-weight: 900; color: var(--sixers-red);
      line-height: 1;
    }
    .social-sixers-row td { background: rgba(0,107,182,0.06) !important; border-left: 3px solid var(--sixers-blue); }
    .social-content { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .social-conference {
      background: white; border-radius: 12px; padding: 28px;
      border: 1px solid #e6eaf2;
      box-shadow: 0 4px 20px rgba(15,23,42,0.06);
    }
    .social-conf-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.62rem; font-weight: 800; letter-spacing: .18em;
      text-transform: uppercase; color: var(--mid);
      margin-bottom: 20px; padding-bottom: 10px;
      border-bottom: 1px solid #e6eaf2;
    }
    .social-content.mode-east, .social-content.mode-west {
      grid-template-columns: 1fr; max-width: 920px; margin: 0 auto;
    }
    .social-header.single-conf-mode { flex-direction: column; align-items: center; text-align: center; }
    .social-header.single-conf-mode .social-title-box { width: 100%; margin-bottom: 16px; }
    .social-header.single-conf-mode .social-branding { position: static; text-align: center; }
    .social-table { width: 100%; border-collapse: collapse; }
    .social-table th {
      background: #f8f9fc; padding: 12px 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; text-transform: uppercase;
      color: #8693a8; font-weight: 800; letter-spacing: 0.14em;
      border-bottom: 1px solid #e6eaf2; text-align: center;
    }
    .social-table th:first-child { text-align: left; }
    .social-table td {
      padding: 0; font-size: 14px; font-weight: 600;
      border-bottom: 1px solid #eef1f6; background: white; height: 46px;
    }
    .social-table td .cell-content {
      display: flex; align-items: center; justify-content: center; height: 46px;
    }
    .social-streak-w { color: #15803d; }
    .social-streak-l { color: #b91c1c; }
    .social-footer {
      margin-top: 40px; text-align: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px; color: var(--mid); font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
    }

    @media(max-width:768px){
      .hero-inner { padding: 3rem 1rem 2rem; }
      .standings-container { padding: 1rem; }
      th, td { padding: 0.6rem 0.5rem; font-size: 0.78rem; }
      .export-container { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <script src="nav.js"></script>

  <section class="page-header">
    <div class="hero-glow-blue"></div>
    <div class="hero-glow-red"></div>
    <div class="hero-inner">
      <p class="page-title">NBA</p>
      <p class="page-title"><span class="highlight">Standings</span></p>
      <div class="hero-divider"></div>
      <p class="page-subtitle">Real-time Eastern & Western Conference Rankings</p>
    </div>
  </section>

  <div class="content-wrapper">
    <div class="export-container">
      <span class="export-label">Export Graphic</span>
      <div class="export-btns-group">
        <button class="export-btn primary" data-export-mode="both">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          Full League
        </button>
        <button class="export-btn" data-export-mode="east">Eastern Conf</button>
        <button class="export-btn" data-export-mode="west">Western Conf</button>
      </div>
    </div>

    <main class="standings-container" id="standings">
      <div class="loader">
        <div class="loader-spinner"></div>
        <p>Fetching latest standings...</p>
      </div>
    </main>
  </div>

  <!-- Social Media Export Hidden Container -->
  <div id="social-export-container">
    <div class="social-header">
      <div class="social-title-box">
        <h1>NBA Standings</h1>
        <p id="export-date">2025-26 Season</p>
      </div>
      <div class="social-branding">
        <div class="domain">SixersHoops.com</div>
      </div>
    </div>
    <div class="social-content" id="social-export-content">
      <!-- Populated by JS -->
    </div>
    <div class="social-footer">
      Real-time updates & analysis at SixersHoops.com
    </div>
  </div>

  <!-- Export Modal -->
  <div id="exportModal" class="export-modal">
    <div class="export-modal-content">
      <span class="export-modal-title">Standings Export — SixersHoops</span>
      <img id="exportPreview" class="export-preview" alt="Standings export">
      <div class="export-actions">
        <a class="modal-btn btn-download" id="downloadBtn" download="standings.png">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download PNG
        </a>
        <button class="modal-btn" id="copyBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy Image
        </button>
        <button class="modal-btn btn-close" id="closeModal">✕ Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="standings.js"></script>
  <script>
    // Bridge: patch modal open/close to use .open class (new dark modal style)
    (function() {
      const modal = document.getElementById('exportModal');
      if (!modal) return;

      // Observe style.display changes made by standings.js and sync to .open class
      const observer = new MutationObserver(() => {
        if (modal.style.display === 'flex') {
          modal.classList.add('open');
          modal.style.display = '';
        } else if (modal.style.display === 'none') {
          modal.classList.remove('open');
          modal.style.display = '';
        }
      });
      observer.observe(modal, { attributes: true, attributeFilter: ['style'] });

      // Close button
      const closeBtn = document.getElementById('closeModal');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => modal.classList.remove('open'));
      }
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

      // Patch downloadBtn: standings.js sets href on an <a> or triggers click; we keep it working
      const dlBtn = document.getElementById('downloadBtn');
      if (dlBtn) {
        // standings.js may call dlBtn.href = dataUrl and dlBtn.click()
        // Since it's already an <a>, that works natively. Just ensure it gets the src from the preview.
        const preview = document.getElementById('exportPreview');
        if (preview) {
          const imgObserver = new MutationObserver(() => {
            if (preview.src && preview.src !== window.location.href) {
              dlBtn.href = preview.src;
            }
          });
          imgObserver.observe(preview, { attributes: true, attributeFilter: ['src'] });
        }
      }

      // Copy button
      const copyBtn = document.getElementById('copyBtn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          const preview = document.getElementById('exportPreview');
          if (!preview || !preview.src) return;
          try {
            const res = await fetch(preview.src);
            const blob = await res.blob();
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy Image'; }, 2000);
          } catch(e) { copyBtn.textContent = 'Copy failed'; }
        });
      }
    })();
  </script>
</body>
</html>
