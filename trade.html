<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade - Sixers Hoops</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/navbar-styles.css" />
  <style>
    :root{--navy:#001a57;--sixers-blue:#006BB6;--sixers-red:#ED174C;--cream:#fff;--ink:#0d0f1a;--mid:#64748b;--border:#e4e8f0;--bg2:#f8fafc;--vote-up:#ea580c;--vote-down:#2563eb}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:Lexend,system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-top:64px;min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:860px;margin:0 auto;padding:1.5rem 1.15rem 4.5rem}
    .back{display:inline-flex;font-size:.82rem;font-weight:600;color:var(--sixers-blue);margin-bottom:1.35rem}
    .back:hover{text-decoration:underline}

    /* Fanspo-inspired post header */
    .post-header{
      margin:0 0 1rem;position:relative;
      padding:0 0 .85rem;
      border-bottom:1px solid var(--border);
    }
    .post-head-row{
      display:flex;align-items:center;gap:.55rem;
    }
    .post-avatar{
      width:28px;height:28px;border-radius:50%;flex-shrink:0;
      background:#001a57;color:#fff;font-weight:700;font-size:.72rem;
      display:flex;align-items:center;justify-content:center;overflow:hidden;
      border:1.5px solid #e8eef5;margin-top:1px;
    }
    .post-avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .post-head-main{flex:1;min-width:0}
    .post-head-meta{
      display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;
      font-size:.8rem;line-height:1.2;color:#64748b;margin:0;
    }
    .post-head-meta .community{
      font-weight:700;color:#006BB6;
    }
    .post-head-meta .sep{color:#0f172a !important;font-weight:800;font-size:1em}
    .post-head-meta .posted-by{font-weight:500;color:#64748b}
    .post-head-meta .post-author-name{
      font-weight:700;color:#0f172a;text-decoration:none;
    }
    .post-head-meta .post-author-name:hover{text-decoration:underline;color:#006BB6}
    .post-head-meta .post-time{font-weight:600;color:#0f172a !important}
    .title{
      font-size:clamp(1.25rem,3vw,1.65rem);font-weight:800;letter-spacing:-.025em;
      line-height:1.25;margin:.55rem 0 0;color:#0f172a;text-align:center;
    }
    .post-title-wrap{width:100%;text-align:center;margin-top:.55rem}
    .post-title-wrap .title{margin:0}
    .menu-right{
      flex-shrink:0;display:flex;align-items:center;gap:.25rem;
      margin-left:auto;
    }
    .dots-btn{
      width:28px;height:28px;border:none;background:transparent;border-radius:6px;
      color:#0f172a !important;cursor:pointer;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
    }
    .dots-btn svg{fill:#0f172a !important;color:#0f172a !important}
    .dots-btn:hover{background:rgba(15,23,42,.06)}
    .tw-repost-label{margin:0 0 .45rem;font-size:.78rem}
    .post-header-top,.post-title-row,.title-center,.meta-left,.meta-line{display:contents}
    .edited{color:#0f172a !important;font-weight:600;font-size:.78rem;font-style:normal}
    .excerpt{font-size:.95rem;line-height:1.65;color:#334155;margin:0 0 1.1rem;white-space:pre-wrap}
    .tb-wrap{margin:1.25rem 0 1.5rem}
    .tb-label{
      font-size:.65rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
      color:#94a3b8;margin:0 0 .75rem;
    }
    .tb-grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;
    }
    .tb-card{
      background:#f8fafc;border:1px solid #e8eef5;border-radius:16px;padding:1.1rem 1.15rem;
    }
    .tb-card-head{
      display:flex;align-items:center;gap:.55rem;margin:0 0 .85rem;
      font-weight:800;font-size:1rem;color:#0f172a;
    }
    .tb-logo{width:28px;height:28px;object-fit:contain;flex-shrink:0;border-radius:6px;background:#fff}
    .tb-logo-fallback{
      width:28px;height:28px;border-radius:6px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:.6rem;font-weight:800;color:#fff;
    }
    .tb-row{
      display:flex;justify-content:space-between;align-items:center;gap:.75rem;
      padding:.32rem 0;font-size:.88rem;
    }
    .tb-row-label{color:#64748b;font-weight:500}
    .tb-row-val{color:#0f172a;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
    .tb-row-val.pos{color:#059669}
    .tb-row-val.neg{color:#dc2626}
    .tb-divider{height:1px;background:#e2e8f0;margin:.55rem 0}
    .tb-sub{
      font-size:.65rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
      color:#94a3b8;margin:.15rem 0 .4rem;
    }

    .sh-logo{width:44px;height:44px;object-fit:contain;flex-shrink:0;display:block;border-radius:6px;background:transparent}

    .menu-wrap{position:relative;flex-shrink:0}
    .dots-btn{width:32px;height:32px;border:none;background:transparent;border-radius:8px;color:#0f172a !important;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .dots-btn:hover{background:rgba(15,23,42,.06)}
    .dots-btn svg{fill:#0f172a !important}
    .dots-menu{display:none;position:absolute;right:0;top:100%;z-index:50;min-width:170px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 28px rgba(15,23,42,.12);padding:.35rem}
    .dots-menu.open{display:block}
    .dots-menu button{display:block;width:100%;text-align:left;border:none;background:transparent;font-family:Lexend,sans-serif;font-size:.84rem;font-weight:600;padding:.6rem .8rem;border-radius:8px;cursor:pointer;color:var(--ink)}
    .dots-menu button:hover{background:var(--bg2)}
    .dots-menu button.danger{color:var(--sixers-red)}

    /* Share-card style trade graphic (matches machine share card, no footer link) */
    .sh-hero{
      background:#f8fafc;border:1px solid #e8eef5;border-radius:20px;
      padding:1.6rem 1.35rem 1.5rem;margin:0 0 1.25rem;text-align:center;
      box-shadow:0 10px 32px rgba(15,23,42,.07);
    }
    .sh-brand{font-family:Lexend,sans-serif;font-weight:900;font-size:1.55rem;letter-spacing:-.03em;color:#0b1220;margin:0}
    .sh-sub{
      font-family:Lexend,sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.08em;
      color:#0066cc;margin-top:.35rem;display:inline-block;border-bottom:2px solid #0066cc;padding-bottom:2px;
    }
    .sh-status-wrap{display:flex;flex-direction:column;align-items:center;gap:.45rem;margin:.85rem 0 1.1rem}
    .sh-status-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .sh-status-icon.ok{color:#059669;background:rgba(5,150,105,.1);box-shadow:0 0 0 3px rgba(5,150,105,.15)}
    .sh-status-icon.bad{color:#dc2626;background:rgba(220,38,38,.1);box-shadow:0 0 0 3px rgba(220,38,38,.15)}
    .sh-status-icon svg{width:36px;height:36px;display:block}
    .sh-status{font-family:Lexend,sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.12em}
    .sh-status.ok{color:#059669}
    .sh-status.bad{color:#dc2626}
    .sh-grid{display:flex;align-items:center;justify-content:center;gap:0;text-align:left;flex-wrap:wrap}
    .sh-col{
      flex:0 1 300px;width:300px;max-width:340px;min-width:240px;background:#ffffff;
      border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #eef1f6;align-self:center;
    }
    .sh-col-bar{height:4px;width:100%;flex-shrink:0}
    .sh-col-head{padding:.75rem .85rem .55rem;display:flex;align-items:center;gap:.65rem;flex-shrink:0}
    .sh-logo-fallback{
      width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-weight:900;font-size:.72rem;color:#fff;flex-shrink:0;
    }
    .sh-col-head-text{min-width:0;flex:1}
    .sh-team-name{font-weight:800;font-size:1rem;color:#0f172a;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sh-team-abbr{font-size:.68rem;font-weight:700;color:#94a3b8;margin-top:1px}
    .sh-col-body{padding:.15rem .85rem .55rem;flex:1}
    .sh-player{display:flex;justify-content:space-between;gap:.5rem;padding:.48rem 0;border-bottom:1px solid #eef1f6;font-size:.92rem}
    .sh-player:last-child{border-bottom:none}
    .sh-pname{font-weight:600;color:#0f172a;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sh-psal{font-weight:700;color:#0066cc;flex-shrink:0}
    .sh-col-foot{
      margin-top:auto;padding:.55rem .85rem;background:#eef2f7;border-top:1px solid #e4e8f0;
      display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;letter-spacing:.04em;color:#64748b;
    }
    .sh-col-foot span:last-child{color:#0f172a}
    .sh-arrow{
      width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #e4e8f0;
      display:flex;align-items:center;justify-content:center;margin:0 .45rem;flex-shrink:0;color:#64748b;font-weight:800;font-size:1rem;
    }
    .sh-empty{color:#94a3b8;font-size:.88rem;padding:1rem}
    @media(max-width:600px){
      .sh-grid{flex-direction:column;gap:.65rem}
      .sh-arrow{transform:rotate(90deg)}
      .sh-col{width:100%;max-width:100%;flex:1 1 auto}
    }

    .engage{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;padding:.25rem 0 .35rem;margin:0 0 1.35rem}
    .e-pill{display:inline-flex;align-items:center;gap:.35rem;height:36px;padding:0 .85rem;border-radius:999px;border:1px solid #e5e7eb;background:#f8fafc;color:#475569;font-family:Lexend,sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;text-decoration:none}
    .e-pill:hover{background:#f1f5f9;border-color:#d1d5db}
    .e-pill.booked{color:#ca8a04;border-color:rgba(202,138,4,.35);background:rgba(202,138,4,.08)}
    .e-split{display:inline-flex;align-items:center;border:1px solid #e5e7eb;background:#f8fafc;border-radius:999px;height:36px;overflow:hidden}
    .e-split button{border:none;background:transparent;height:100%;padding:0 .7rem;cursor:pointer;color:#475569;display:inline-flex;align-items:center;gap:.3rem;font-family:Lexend,sans-serif;font-size:.82rem;font-weight:700}
    .e-split button:hover{background:#f1f5f9}
    .e-split button.active-up{color:var(--vote-up);background:transparent}
    .e-split button.active-up svg{stroke:var(--vote-up);color:var(--vote-up)}
    .e-split button.active-down{color:var(--vote-down);background:transparent}
    .e-split button.active-down svg{stroke:var(--vote-down);color:var(--vote-down)}
    .e-split button{background:transparent !important}
    .e-split button:hover{background:transparent}
    .e-split button.active-up:hover,.e-split button.active-down:hover{background:transparent}
    .e-split .e-count{padding:0 .55rem 0 0;font-weight:800;font-size:.82rem;color:#334155;min-width:1.1rem}

    .section-label{font-size:.65rem;font-weight:800;letter-spacing:.16em;color:var(--mid);text-transform:uppercase;margin:0 0 .85rem;display:flex;align-items:center;gap:.6rem}
    .section-label::after{content:'';flex:1;height:1px;background:var(--border)}
    .poll-box{border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:1.5rem;background:#fff}
    .poll-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--border);border-radius:10px;padding:.75rem 1rem;margin-bottom:.5rem;background:#fff;cursor:pointer;font-family:Lexend,sans-serif;position:relative;overflow:hidden}
    .poll-opt.picked{border-color:var(--sixers-blue);background:rgba(0,107,182,.05)}
    .poll-opt.disabled{cursor:default}
    .poll-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(0,107,182,.12);z-index:0}
    .poll-opt-inner{position:relative;z-index:1;display:flex;justify-content:space-between;gap:.5rem;font-weight:600;font-size:.9rem}
    .poll-meta{font-size:.78rem;color:var(--mid);margin-top:.5rem}

    .comments-section{margin-top:.25rem}
    .comment-form{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1.25rem}
    .comment-form textarea{width:100%;box-sizing:border-box;font-family:Lexend,sans-serif;font-size:.9rem;line-height:1.55;padding:.75rem .9rem;border:1.5px solid var(--border);border-radius:10px;resize:vertical;min-height:80px;outline:none}
    .comment-form textarea:focus{border-color:var(--sixers-blue);box-shadow:0 0 0 4px rgba(0,102,204,.1)}
    .comment-form-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.65rem}
    .btn{display:inline-flex;align-items:center;gap:.4rem;font-family:Lexend,sans-serif;font-weight:700;font-size:.82rem;padding:.55rem 1.15rem;border-radius:999px;border:none;cursor:pointer}
    .btn-primary{background:var(--sixers-blue);color:#fff}
    .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}

    .comment-card{display:flex;gap:.55rem;border:1px solid var(--border);border-radius:12px;padding:.85rem .9rem;margin-bottom:.55rem;background:#fff}
    .comment-card.reply{margin-left:1.75rem;background:#fbfcfe}
    .comment-thread{margin-bottom:.35rem}
    .view-replies-btn{
      background:none;border:none;font-family:Lexend,sans-serif;font-size:.75rem;font-weight:700;
      color:var(--sixers-blue);cursor:pointer;padding:.35rem 0 .15rem .15rem;margin-left:2.2rem;
    }
    .view-replies-btn:hover{text-decoration:underline}
    .replies-wrap{display:none;margin-top:.25rem}
    .replies-wrap.open{display:block}
    .author-link{color:inherit;font-weight:700;text-decoration:none}
    .author-link:hover{color:var(--sixers-blue);text-decoration:underline}
    .follow-btn{
      font-family:Lexend,sans-serif;font-size:.72rem;font-weight:700;padding:.35rem .75rem;
      border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;margin-left:.5rem;
    }
    .follow-btn.following{background:var(--navy);color:#fff;border-color:var(--navy)}

    .c-vote{display:flex;flex-direction:column;align-items:center;gap:2px;width:28px;flex-shrink:0}
    .c-vote-btn{width:26px;height:26px;border:none;background:transparent;border-radius:6px;color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .c-vote-btn.active-up{color:var(--vote-up);background:transparent}
    .c-vote-btn.active-up svg{stroke:var(--vote-up)}
    .c-vote-btn.active-down{color:var(--vote-down);background:transparent}
    .c-vote-btn.active-down svg{stroke:var(--vote-down)}
    .c-vote-btn:hover{background:transparent}
    .c-vote-count{font-size:.68rem;font-weight:800;color:var(--mid)}
    .c-body{flex:1;min-width:0}
    .c-meta{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.75rem;color:var(--mid);margin-bottom:.35rem}
    .c-author{font-weight:700;color:#334155}
    .c-text{font-size:.92rem;line-height:1.55;margin:0;white-space:pre-wrap}
    .reply-to-label{font-size:.72rem;font-weight:600;color:var(--sixers-blue);margin:0 0 .3rem}
    .c-actions{display:flex;gap:.65rem;margin-top:.4rem}
    .c-action{background:none;border:none;font-family:Lexend,sans-serif;font-size:.72rem;font-weight:700;color:#94a3b8;cursor:pointer;padding:0}
    .c-action:hover{color:var(--sixers-blue)}
    .c-menu-wrap{position:relative;flex-shrink:0}
    .c-menu{display:none;position:absolute;right:0;top:100%;z-index:40;min-width:150px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 28px rgba(15,23,42,.12);padding:.3rem}
    .c-menu.open{display:block}
    .c-menu button{display:block;width:100%;text-align:left;border:none;background:transparent;font-family:Lexend,sans-serif;font-size:.82rem;font-weight:600;padding:.55rem .75rem;border-radius:7px;cursor:pointer}
    .c-menu button:hover{background:var(--bg2)}
    .c-menu button.danger{color:var(--sixers-red)}
    .reply-form{margin-top:.55rem;padding:.65rem;background:var(--bg2);border-radius:10px;border:1px solid var(--border)}
    .reply-form textarea{width:100%;box-sizing:border-box;font-family:Lexend,sans-serif;font-size:.85rem;padding:.55rem .7rem;border:1.5px solid var(--border);border-radius:8px;min-height:64px;resize:vertical;outline:none}
    .reply-form textarea:focus{border-color:var(--sixers-blue)}
    .reply-form-actions{display:flex;justify-content:flex-end;gap:.4rem;margin-top:.45rem}
    .comments-empty{text-align:center;padding:1.25rem;color:var(--mid);font-size:.9rem}
    .signin-hint{font-size:.85rem;color:var(--mid);text-align:center;padding:.75rem}
    .signin-hint button{background:none;border:none;color:var(--sixers-blue);font-family:Lexend,sans-serif;font-weight:700;cursor:pointer;text-decoration:underline}

    .overlay{display:none;position:fixed;inset:0;z-index:10000;background:rgba(13,15,26,.55);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem}
    .overlay.open{display:flex}
    .mbox{background:#fff;border-radius:16px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
    .mhead{padding:1.1rem 1.35rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#f6f8fc}
    .mhead h3{margin:0;font-size:1rem;font-weight:800;letter-spacing:.04em}
    .mbody{padding:1.25rem 1.35rem}
    .mfoot{padding:.9rem 1.35rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.55rem;background:#f8fafc}
    label.fl{display:block;font-size:.62rem;font-weight:800;letter-spacing:.14em;color:var(--mid);margin:0 0 .4rem}
    .inp,.ta{width:100%;box-sizing:border-box;font-family:Lexend,sans-serif;font-size:.9rem;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:10px;outline:none;margin-bottom:1rem}
    .ta{min-height:90px;resize:vertical}
    .inp:focus,.ta:focus{border-color:var(--sixers-blue);box-shadow:0 0 0 4px rgba(0,102,204,.1)}
    .reason-list{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
    .reason-opt{display:flex;align-items:center;gap:.6rem;padding:.7rem .85rem;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:600}
    .reason-opt.active,.reason-opt:hover{border-color:var(--sixers-blue);background:rgba(0,107,182,.05)}
    .hint{font-size:.75rem;color:#94a3b8;margin:-.4rem 0 1rem}
    .state{text-align:center;padding:4rem 1rem;color:var(--mid)}
    .state h2{font-size:1.25rem;color:var(--ink);margin:0 0 .5rem}
  
    .delete-modal-overlay,.quote-modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10000;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px);}
    .delete-modal-overlay.open,.quote-modal-overlay.open{display:flex;}
    .delete-modal,.quote-modal{background:#fff;border-radius:16px;width:min(420px,100%);box-shadow:0 25px 50px rgba(0,0,0,.25);overflow:hidden;font-family:Lexend,system-ui,sans-serif;}
    .delete-modal-body{padding:1.5rem 1.35rem 1rem;}
    .delete-modal-body h3{margin:0 0 .5rem;font-size:1.15rem;font-weight:800;color:#0f172a;}
    .delete-modal-body p{margin:0;font-size:.9rem;color:#64748b;line-height:1.5;}
    .delete-modal-actions{display:flex;gap:.6rem;padding:0 1.35rem 1.35rem;justify-content:flex-end;}
    .btn-cancel-mod{border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:.55rem 1rem;font-weight:600;font-size:.88rem;cursor:pointer;color:#334155;}
    .btn-danger-mod{border:none;background:#dc2626;color:#fff;border-radius:8px;padding:.55rem 1rem;font-weight:700;font-size:.88rem;cursor:pointer;}
    .btn-danger-mod:hover{background:#b91c1c;}
    .quote-modal-body{padding:1.25rem 1.25rem 0.75rem;}
    .quote-modal-body h3{margin:0 0 0.85rem;font-size:1.1rem;font-weight:800;}
    .quote-modal textarea{width:100%;min-height:100px;border:1px solid #e2e8f0;border-radius:10px;padding:.75rem;font:inherit;font-size:.92rem;resize:vertical;box-sizing:border-box;}
    .quote-preview{margin-top:.75rem;border:1px solid #e2e8f0;border-radius:12px;padding:.75rem;background:#f8fafc;}
    .quote-preview .qp-author{font-size:.78rem;font-weight:700;color:#64748b;margin-bottom:.25rem;}
    .quote-preview .qp-title{font-weight:700;font-size:.92rem;color:#0f172a;}
    .quote-modal-actions{display:flex;gap:.6rem;padding:0.85rem 1.25rem 1.25rem;justify-content:flex-end;}

  <script>
(function(){
  const COLLECTION='community_trades', REPORTS='community_reports', MOD_EMAIL='rhatus13@gmail.com';
  const BOOK_KEY='sixershoops_bookmarked_trades';
  let trade=null, unsub=null, reportCtx=null, replyToId=null;

  
  async function isFollowing(uid){
    const me=window.auth&&window.auth.currentUser;
    if(!me||!window.db||!uid)return false;
    try{
      const doc=await window.db.collection('follows').doc(me.uid+'_'+uid).get();
      return doc.exists;
    }catch(e){return false;}
  }
  async function refreshFollowBtn(btn, uid){
    if(!btn||!uid)return;
    const on=await isFollowing(uid);
    btn.textContent=on?'Following':'Follow';
    btn.classList.toggle('following',on);
  }
  async function toggleFollow(uid, btn){
    const me=window.auth&&window.auth.currentUser;
    if(!me){triggerLogin();return;}
    if(!window.db||!uid||me.uid===uid)return;
    const id=me.uid+'_'+uid;
    const ref=window.db.collection('follows').doc(id);
    try{
      const snap=await ref.get();
      if(snap.exists){
        await ref.delete();
        if(btn){btn.textContent='Follow';btn.classList.remove('following');}
      } else {
        var followPayload = {
          followerId: String(me.uid),
          followingId: String(uid),
          followerName: String(me.displayName||(me.email?me.email.split('@')[0]:'fan')),
          followingName: (trade&&trade.author)?String(trade.author).replace(/^u\//,''):'',
          createdAt: String(new Date().toISOString())
        };
        await ref.set(JSON.parse(JSON.stringify(followPayload)));
        if(btn){btn.textContent='Following';btn.classList.add('following');}
      }
    }catch(e){
      console.error(e);
      var msg=(e&&e.message)?e.message:String(e);
      if(/permission|insufficient/i.test(msg)) alert('Follow blocked by Firestore rules on the follows collection. Allow signed-in users to create/delete follows.');
      else alert('Could not update follow: '+msg);
    }
  }


  function openDeleteModal(opts){
    var ov=document.getElementById('deleteModalOverlay');
    if(!ov){
      ov=document.createElement('div');
      ov.id='deleteModalOverlay';
      ov.className='delete-modal-overlay';
      ov.innerHTML='<div class="delete-modal" onclick="event.stopPropagation()"><div class="delete-modal-body"><h3 id="deleteModalTitle">Delete?</h3><p id="deleteModalMsg">This cannot be undone.</p></div><div class="delete-modal-actions"><button type="button" class="btn-cancel-mod" id="deleteModalCancel">Cancel</button><button type="button" class="btn-danger-mod" id="deleteModalConfirm">Delete</button></div></div>';
      document.body.appendChild(ov);
      ov.onclick=function(){ov.classList.remove('open');};
      document.getElementById('deleteModalCancel').onclick=function(){ov.classList.remove('open');};
    }
    document.getElementById('deleteModalTitle').textContent=opts.title||'Delete?';
    document.getElementById('deleteModalMsg').textContent=opts.message||'This cannot be undone.';
    var conf=document.getElementById('deleteModalConfirm');
    conf.onclick=async function(){
      conf.disabled=true;conf.textContent='Deleting…';
      try{ if(opts.onConfirm) await opts.onConfirm(); ov.classList.remove('open'); }
      catch(e){ alert(e.message||'Delete failed'); }
      finally{ conf.disabled=false;conf.textContent='Delete'; }
    };
    ov.classList.add('open');
  }

  window.openQuoteModal = function openQuoteModal(tradeObj){
    var ov=document.getElementById('quoteModalOverlay');
    if(!ov){
      ov=document.createElement('div');
      ov.id='quoteModalOverlay';
      ov.className='quote-modal-overlay';
      ov.innerHTML='<div class="quote-modal" onclick="event.stopPropagation()"><div class="quote-modal-body"><h3>Quote repost</h3><textarea id="quoteModalText" placeholder="Add your thoughts…" maxlength="500"></textarea><div class="quote-preview"><div class="qp-author" id="quoteModalAuthor"></div><div class="qp-title" id="quoteModalTitle"></div></div></div><div class="quote-modal-actions"><button type="button" class="btn-cancel-mod" id="quoteModalCancel">Cancel</button><button type="button" class="btn-primary-mod" id="quoteModalPost">Post</button></div></div>';
      document.body.appendChild(ov);
      ov.onclick=function(){ov.classList.remove('open');};
      document.getElementById('quoteModalCancel').onclick=function(){ov.classList.remove('open');};
    }
    document.getElementById('quoteModalAuthor').textContent=tradeObj.author||'Original';
    document.getElementById('quoteModalTitle').textContent=tradeObj.title||'Trade';
    document.getElementById('quoteModalText').value='';
    document.getElementById('quoteModalPost').onclick=function(){
      var text=document.getElementById('quoteModalText').value.trim();
      ov.classList.remove('open');
      window.createRepost(true, text);
    };
    ov.classList.add('open');
    setTimeout(function(){document.getElementById('quoteModalText').focus();},50);
  }

  function compressImageFile(file, maxSide, quality){
    return new Promise(function(resolve,reject){
      var reader=new FileReader();
      reader.onerror=reject;
      reader.onload=function(){
        var img=new Image();
        img.onerror=reject;
        img.onload=function(){
          var w=img.width,h=img.height;
          var scale=Math.min(1, maxSide/Math.max(w,h));
          w=Math.round(w*scale);h=Math.round(h*scale);
          var canvas=document.createElement('canvas');
          canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function waitForDb(cb,n){n=n||0;if(window.db){cb();return;}if(n>80){renderError('Could not connect.');return;}setTimeout(function(){waitForDb(cb,n+1);},250);}
  function showToast(msg){
    var el=document.getElementById('shToast');
    if(!el){
      el=document.createElement('div');
      el.id='shToast';
      el.className='sh-toast';
      el.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg><span></span>';
      document.body.appendChild(el);
    }
    el.querySelector('span').textContent=msg||'Done';
    el.classList.add('show');
    clearTimeout(el._t);
    el._t=setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmtM(v){if(v==null||v==='')return'';const n=Number(v);if(!isFinite(n))return'';if(Math.abs(n)>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(Math.abs(n)>=1e3)return'$'+Math.round(n/1e3)+'K';return'$'+n;}
  function parseDate(ts){
    if (ts === null || ts === undefined || ts === '') return null;
    try {
      if (ts instanceof Date) return isNaN(ts.getTime()) ? null : ts;
      if (typeof ts.toDate === 'function') {
        var td = ts.toDate();
        return td && !isNaN(td.getTime()) ? td : null;
      }
      if (typeof ts === 'object') {
        var sec = ts.seconds != null ? ts.seconds : (ts._seconds != null ? ts._seconds : null);
        var nano = ts.nanoseconds != null ? ts.nanoseconds : (ts._nanoseconds || 0);
        if (sec != null && sec !== '') {
          var ms = Number(sec) * 1000 + Math.floor(Number(nano) / 1e6);
          var od = new Date(ms);
          if (!isNaN(od.getTime())) return od;
        }
        if (ts.$date) return parseDate(ts.$date);
        if (ts.value) return parseDate(ts.value);
      }
      if (typeof ts === 'number' && isFinite(ts)) {
        return new Date(ts < 1e12 ? ts * 1000 : ts);
      }
      if (typeof ts === 'string') {
        var s = ts.trim();
        if (!s) return null;
        // numeric string
        if (/^\d+(\.\d+)?$/.test(s)) {
          var num = Number(s);
          return new Date(num < 1e12 ? num * 1000 : num);
        }
        // "August 9, 2026 at 2:00:00 PM UTC+0" style or ISO
        var d1 = new Date(s);
        if (!isNaN(d1.getTime())) return d1;
        // Firestore string sometimes has " at "
        var d2 = new Date(s.replace(' at ', ' '));
        if (!isNaN(d2.getTime())) return d2;
      }
    } catch (_) {}
    return null;
  }
  function timeAgo(ts){
    var d = parseDate(ts);
    // Firestore Timestamp sometimes only exposes toMillis
    if ((!d || isNaN(d.getTime())) && ts && typeof ts.toMillis === 'function') {
      try { d = new Date(ts.toMillis()); } catch(_) {}
    }
    if ((!d || isNaN(d.getTime())) && ts != null) {
      try {
        // last resort: Object that stringifies with seconds
        var j = (typeof ts === 'object') ? JSON.parse(JSON.stringify(ts)) : null;
        if (j && (j.seconds != null || j._seconds != null)) {
          d = new Date(Number(j.seconds != null ? j.seconds : j._seconds) * 1000);
        }
      } catch(_) {}
    }
    if(!d || isNaN(d.getTime())) return '';
    var s = Math.floor((Date.now() - d.getTime()) / 1000);
    if (s < 0) s = 0;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    if (s < 604800) return Math.floor(s/86400) + 'd ago';
    if (s < 2592000) return Math.floor(s/604800) + 'w ago';
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }
  function getId(){
    const q=new URLSearchParams(location.search).get('id');
    if(q)return q;
    // /trade/{id}/{optional-slug}
    const m=location.pathname.match(/^\/trade\/([^\/]+)(?:\/[^\/]*)?\/?$/);
    if(m)return decodeURIComponent(m[1]);
    return null;
  }
  function slugifyTitle(s){
    return String(s||'trade').toLowerCase()
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'trade';
  }
  function setPrettyUrl(id, title){
    // Stay on trade.html so static hosts never 404. Optional pretty path only if already on /trade/...
    try{
      if(/^\/trade\//.test(location.pathname)){
        const path='/trade/'+encodeURIComponent(id)+'/'+encodeURIComponent(slugifyTitle(title));
        if(location.pathname !== path) history.replaceState(null,'',path);
      } else {
        const q='/trade.html?id='+encodeURIComponent(id);
        if(location.pathname+location.search !== q) history.replaceState(null,'',q);
      }
    }catch(e){}
  }
  function profileUrlForAuthor(author, authorId){
    const handle=String(author||'').replace(/^u\//,'');
    const slug=handle.toLowerCase().replace(/[^a-z0-9_-]+/g,'-') || 'user';
    // Live site format: /user/(name) — uid helps resolve exact account
    return '/user/'+encodeURIComponent(slug)+(authorId?('?uid='+encodeURIComponent(authorId)):'');
  }
  function triggerLogin(){const b=document.getElementById('navSignInBtn');if(b)b.click();else alert('Please sign in.');}
  function isMod(){const u=window.auth&&window.auth.currentUser;return u&&u.email&&u.email.toLowerCase()===MOD_EMAIL.toLowerCase();}
  function postType(t){return t.postType||t.type||(t.sides?'trade':'discussion');}
  function machineUrl(t){return t.machineHash?'/nba-trade-machine.html#trade='+encodeURIComponent(t.machineHash):'/nba-trade-machine.html';}
  function renderError(msg){document.getElementById('root').innerHTML='<div class="state"><h2>'+esc(msg)+'</h2></div>';}
  function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

  function getBookmarks(){try{return JSON.parse(localStorage.getItem(BOOK_KEY)||'[]');}catch(e){return[];}}
  function isBookmarked(id){return getBookmarks().indexOf(id)>=0;}
  function toggleBookmark(id){let list=getBookmarks();const i=list.indexOf(id);if(i>=0)list.splice(i,1);else list.push(id);try{localStorage.setItem(BOOK_KEY,JSON.stringify(list));}catch(e){}return list.indexOf(id)>=0;}

  function normalizeComments(list){
    const arr=(list||[]).map(function(c,i){
      const x=Object.assign({},c);
      if(!x.id)x.id=x.cid||('legacy_'+i);
      if(x.parentId==null)x.parentId=null;
      if(!x.voters)x.voters={};
      if(x.votes==null)x.votes=0;
      return x;
    });
    const byId={};
    arr.forEach(function(c){byId[c.id]=c;});
    arr.forEach(function(c){
      if(c.parentId&&byId[c.parentId]){
        c.replyToAuthor=byId[c.parentId].author||'u/fan';
      }
    });
    return arr;
  }

  function buildCommentTree(list){
    const byParent={};
    list.forEach(function(c){
      const p=c.parentId||'root';
      if(!byParent[p])byParent[p]=[];
      byParent[p].push(c);
    });
    return byParent;
  }

  const ESPN_TEAM_CODE = {
    ATL:'atl', BOS:'bos', BKN:'bkn', CHA:'cha', CHI:'chi', CLE:'cle',
    DAL:'dal', DEN:'den', DET:'det', GSW:'gs',  HOU:'hou', IND:'ind',
    LAC:'lac', LAL:'lal', MEM:'mem', MIA:'mia', MIL:'mil', MIN:'min',
    NOP:'no',  NYK:'ny',  OKC:'okc', ORL:'orl', PHI:'phi', PHX:'phx',
    POR:'por', SAC:'sac', SAS:'sa',  TOR:'tor', UTA:'utah', WAS:'wsh'
  };
  function teamLogoUrl(abbr) {
    const code = ESPN_TEAM_CODE[abbr] || String(abbr || '').toLowerCase();
    return 'https://a.espncdn.com/i/teamlogos/nba/500/' + code + '.png';
  }

  function renderTeamBreakdown(t){
    var rows = t.teamBreakdown;
    if(!rows || !rows.length){
      // Derive from sides if possible
      var sides = t.sides || t.teams || [];
      if(!sides.length) return '';
      rows = sides.map(function(s){
        var send = Number(s.sendingSalary);
        var recv = Number(s.receivingSalary);
        if(!isFinite(send)){
          send = 0;
          (s.sending||[]).forEach(function(p){ var n=Number(p.salary); if(isFinite(n)) send+=n; });
        }
        if(!isFinite(recv)){
          recv = 0;
          (s.receiving||s.receives||[]).forEach(function(p){ var n=Number(p.salary); if(isFinite(n)) recv+=n; });
        }
        var cur = Number(s.currentSalary) || 0;
        return {
          abbr: s.abbr || '',
          name: s.name || s.abbr || 'Team',
          color: s.color || '#64748b',
          sendingSalary: send,
          receivingSalary: recv,
          currentSalary: cur,
          postSalary: s.postSalary != null ? Number(s.postSalary) : (cur - send + recv)
        };
      });
    }
    // Need at least one team with salary data
    var hasData = rows.some(function(r){ return (r.sendingSalary||0) > 0 || (r.receivingSalary||0) > 0 || (r.currentSalary||0) > 0; });
    if(!hasData) return '';

    var cba = t.cba || {};
    var salaryCap = Number(cba.salaryCap) || 165000000;
    var luxuryTax = Number(cba.luxuryTax) || 200428000;
    var firstApron = Number(cba.firstApron) || 209015000;
    var secondApron = Number(cba.secondApron) || 221686000;

    function distLabel(threshold, salary){
      var dist = threshold - salary;
      var over = dist < 0;
      var cls = over ? 'neg' : 'pos';
      var text = (over ? 'OVER by ' : 'Under by ') + (fmtM(Math.abs(dist)) || '$0');
      return { cls: cls, text: text };
    }
    function money(n){
      if(n==null || !isFinite(Number(n))) return '—';
      return fmtM(Number(n)) || '$0';
    }

    var cards = rows.map(function(r){
      var pre = Number(r.currentSalary) || 0;
      var send = Number(r.sendingSalary) || 0;
      var recv = Number(r.receivingSalary) || 0;
      var post = r.postSalary != null ? Number(r.postSalary) : (pre - send + recv);
      var hasPayroll = pre > 0;
      var net = recv - send;
      var netCls = net > 0 ? 'neg' : (net < 0 ? 'pos' : '');
      var netStr = (net >= 0 ? '+' : '') + (fmtM(net) || '$0');
      var cap = hasPayroll ? distLabel(salaryCap, post) : { cls: '', text: '—' };
      var tax = hasPayroll ? distLabel(luxuryTax, post) : { cls: '', text: '—' };
      var a1 = hasPayroll ? distLabel(firstApron, post) : { cls: '', text: '—' };
      var a2 = hasPayroll ? distLabel(secondApron, post) : { cls: '', text: '—' };
      var logoHtml = r.abbr
        ? '<img class="tb-logo" src="'+esc(teamLogoUrl(r.abbr))+'" alt="'+esc(r.abbr)+'" onerror="this.style.display=\'none\';this.nextElementSibling&&(this.nextElementSibling.style.display=\'flex\')"><span class="tb-logo-fallback" style="background:'+esc(r.color||'#64748b')+';display:none">'+esc((r.abbr||'').slice(0,3))+'</span>'
        : '<span class="tb-logo-fallback" style="background:'+esc(r.color||'#64748b')+'">'+esc((r.name||'T').slice(0,3))+'</span>';
      return '<div class="tb-card">'+
        '<div class="tb-card-head">'+logoHtml+esc(r.name||r.abbr||'Team')+'</div>'+
        '<div class="tb-row"><span class="tb-row-label">Sending out</span><span class="tb-row-val">'+esc(money(send))+'</span></div>'+
        '<div class="tb-row"><span class="tb-row-label">Taking in</span><span class="tb-row-val">'+esc(money(recv))+'</span></div>'+
        '<div class="tb-row"><span class="tb-row-label">Net change</span><span class="tb-row-val '+netCls+'">'+esc(netStr)+'</span></div>'+
        '<div class="tb-divider"></div>'+
        '<div class="tb-row"><span class="tb-row-label">Pre-trade payroll</span><span class="tb-row-val">'+esc(hasPayroll ? money(pre) : '—')+'</span></div>'+
        '<div class="tb-row"><span class="tb-row-label">Post-trade payroll</span><span class="tb-row-val">'+esc(hasPayroll ? money(post) : '—')+'</span></div>'+
        '<div class="tb-divider"></div>'+
        '<div class="tb-sub">Distance from Thresholds</div>'+
        '<div class="tb-row"><span class="tb-row-label">Salary Cap ('+esc(money(salaryCap))+')</span><span class="tb-row-val '+cap.cls+'">'+esc(cap.text)+'</span></div>'+
        '<div class="tb-row"><span class="tb-row-label">Luxury Tax ('+esc(money(luxuryTax))+')</span><span class="tb-row-val '+tax.cls+'">'+esc(tax.text)+'</span></div>'+
        '<div class="tb-row"><span class="tb-row-label">1st Apron ('+esc(money(firstApron))+')</span><span class="tb-row-val '+a1.cls+'">'+esc(a1.text)+'</span></div>'+
        '<div class="tb-row"><span class="tb-row-label">2nd Apron ('+esc(money(secondApron))+')</span><span class="tb-row-val '+a2.cls+'">'+esc(a2.text)+'</span></div>'+
      '</div>';
    }).join('');

    return '<div class="tb-wrap"><div class="tb-label">Team Breakdown</div><div class="tb-grid">'+cards+'</div></div>';
  }

  function countDescendants(byParent, id){
    const kids=byParent[id]||[];
    let n=kids.length;
    kids.forEach(function(c){n+=countDescendants(byParent,c.id);});
    return n;
  }
  function renderCommentBranch(byParent, parentId, depth){
    const kids=byParent[parentId||'root']||[];
    if(!kids.length)return'';
    let html='';
    kids.forEach(function(c){
      html+='<div class="comment-thread">';
      html+=renderOneComment(c, depth);
      const childHtml = depth<5 ? renderCommentBranch(byParent, c.id, depth+1) : '';
      const n = countDescendants(byParent, c.id);
      if(childHtml && n>0){
        html+='<button type="button" class="view-replies-btn" data-target="replies-'+esc(c.id)+'">View replies ('+n+')</button>';
        html+='<div class="replies-wrap" id="replies-'+esc(c.id)+'">'+childHtml+'</div>';
      }
      html+='</div>';
    });
    return html;
  }

  async function handleVote(dir){
    const user=window.auth&&window.auth.currentUser;if(!user){triggerLogin();return;}
    if(!trade)return;
    const voters=Object.assign({},trade.voters||{});let votes=trade.votes||0;const cur=voters[user.uid];
    const wasUp = cur === 'up';
    if(cur===dir){votes+=dir==='up'?-1:1;delete voters[user.uid];}
    else{if(cur==='up')votes-=1;if(cur==='down')votes+=1;votes+=dir==='up'?1:-1;voters[user.uid]=dir;}
    try{
      await window.db.collection(COLLECTION).doc(trade.id).update({votes:votes,voters:voters});
      // Notify post author on a new upvote (not when removing or downvoting)
      if (dir === 'up' && !wasUp && trade.authorId && trade.authorId !== user.uid) {
        try {
          await window.db.collection('notifications').add({
            type: 'like',
            recipientId: trade.authorId,
            fromUserId: user.uid,
            fromName: user.displayName || (user.email ? user.email.split('@')[0] : 'fan'),
            tradeId: trade.id,
            tradeTitle: trade.title || '',
            text: 'liked your trade',
            message: 'liked your trade',
            link: '/trade.html?id=' + encodeURIComponent(trade.id),
            read: false,
            createdAt: new Date().toISOString()
          });
        } catch (ne) { console.warn('like notif', ne); }
      }
    }catch(e){alert('Could not save vote.');}
  }

  async function submitComment(parentId){
    const user=window.auth&&window.auth.currentUser;if(!user||!trade){triggerLogin();return;}
    let text='';
    if(parentId){
      const input=document.getElementById('reply-input-'+parentId);
      text=input?input.value.trim():'';
    } else {
      const input=document.getElementById('commentInput');
      text=input?input.value.trim():'';
    }
    if(!text)return;
    const comments=normalizeComments(trade.comments);
    const parent = parentId ? comments.find(function(x){return x.id===parentId;}) : null;
    const replyToAuthor = parent ? (parent.author || 'u/fan') : null;
    const newComment = {
      id:uid(),
      parentId:parentId||null,
      replyToAuthor:replyToAuthor,
      author:'u/'+(user.displayName||(user.email?user.email.split('@')[0]:'fan')),
      authorId:user.uid,
      authorPhoto: (localStorage.getItem('photoURL')||user.photoURL||'') || '',
      text:text.slice(0,2000),
      image: (window._pendingCommentImage||'') || '',
      createdAt:new Date().toISOString(),
      votes:0,
      voters:{}
    };
    window._pendingCommentImage = '';
    comments.push(newComment);
    try{
      await window.db.collection(COLLECTION).doc(trade.id).update({comments:comments});
      // Notifications: post owner gets notified for any comment/reply under their post
      // Parent comment author gets notified for a direct reply
      try {
        const fromName = newComment.author;
        const batch = [];
        if (trade.authorId && trade.authorId !== user.uid) {
          batch.push(window.db.collection('notifications').add({
            type: parentId ? 'post_reply_thread' : 'post_comment',
            recipientId: trade.authorId,
            toUserId: trade.authorId,
            fromUserId: user.uid,
            fromName: fromName,
            tradeId: trade.id,
            tradeTitle: trade.title || '',
            commentId: newComment.id,
            text: parentId ? 'replied to a comment' : 'commented on post',
            message: parentId ? 'replied to a comment' : 'commented on post',
            commentText: String(text).slice(0, 300),
            read: false,
            createdAt: new Date().toISOString(),
            link: '/trade.html?id=' + encodeURIComponent(trade.id) + '#comment-' + encodeURIComponent(newComment.id)
          }));
        }
        if (parent && parent.authorId && parent.authorId !== user.uid && parent.authorId !== trade.authorId) {
          batch.push(window.db.collection('notifications').add({
            type: 'comment_reply',
            recipientId: parent.authorId,
            toUserId: parent.authorId,
            fromUserId: user.uid,
            fromName: fromName,
            tradeId: trade.id,
            tradeTitle: trade.title || '',
            commentId: newComment.id,
            parentCommentId: parentId,
            text: 'replied to your comment',
            message: 'replied to your comment',
            commentText: String(text).slice(0, 300),
            read: false,
            createdAt: new Date().toISOString(),
            link: '/trade.html?id=' + encodeURIComponent(trade.id) + '#comment-' + encodeURIComponent(newComment.id)
          }));
        }
        await Promise.all(batch);
      } catch (ne) { console.warn('notif write', ne); }
      replyToId=null;
      if(!parentId){const input=document.getElementById('commentInput');if(input)input.value='';}
    }catch(e){alert('Could not post comment.');}

      try{
        const ref=await window.db.collection(COLLECTION).add(JSON.parse(JSON.stringify(payload)));
        // Notify original author
        if(t.authorId && t.authorId !== user.uid){
          try{
            await window.db.collection('notifications').add(JSON.parse(JSON.stringify({
              type: isQuote ? 'quote_repost' : 'repost',
              recipientId: String(t.authorId),
              fromUserId: String(user.uid),
              fromName: authorName,
              tradeId: String(ref.id),
              tradeTitle: t.title || '',
              text: isQuote ? 'quote reposted' : 'reposted',
              message: isQuote ? 'quote reposted' : 'reposted',
              link: '/trade.html?id='+encodeURIComponent(ref.id),
              read: false,
              createdAt: String(new Date().toISOString())
            })));
          }catch(_){}
        }
        location.href='/trade.html?id='+encodeURIComponent(ref.id);
      }catch(err){
        alert((err&&err.message)||'Could not repost.');
      }
    }
    
    window._pendingCommentImage = '';
    var cImg = document.getElementById('commentImageInput');
    if(cImg){
      cImg.onchange = async function(ev){
        var file = ev.target.files && ev.target.files[0];
        if(!file) return;
        try{
          var url = await compressImageFile(file, 900, 0.72);
          if(url.length > 900000) url = await compressImageFile(file, 640, 0.55);
          window._pendingCommentImage = url;
          var prev = document.getElementById('commentImagePreview');
          if(prev) prev.innerHTML = '<img src="'+url+'" alt="">';
        }catch(e){ alert('Could not process image'); }
      };
    }
setTimeout(function(){try{hydrateCommentPhotos(); if(trade&&trade.authorId) hydratePostAuthorPhoto(trade.authorId);}catch(e){} if(location.hash&&location.hash.indexOf('comment-')===1){var el=document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView({behavior:'smooth',block:'center'});} }, 50);
    // Detect if current user already reposted this post (for unrepost)
    async function findMyRepostOf(originalId){
      const user=window.auth&&window.auth.currentUser;
      if(!user||!window.db||!originalId) return null;
      try{
        const snap=await window.db.collection(COLLECTION)
          .where('authorId','==',user.uid)
          .where('quotedPostId','==',originalId)
          .where('postType','==','repost')
          .limit(1).get();
        if(!snap.empty) return snap.docs[0];
      }catch(e){
        try{
          const snap=await window.db.collection(COLLECTION).where('authorId','==',user.uid).limit(40).get();
          const hit=snap.docs.find(function(d){ var x=d.data()||{}; return x.quotedPostId===originalId && (x.postType==='repost'||x.type==='repost'); });
          return hit||null;
        }catch(_){ return null; }
      }
      return null;
    }

    var myRepostDoc = null;
    findMyRepostOf(t.id).then(function(doc){
      myRepostDoc = doc;
      var label=document.getElementById('repostBtnLabel');
      var menuTxt=document.getElementById('menuRepostText');
      if(doc){
        if(label) label.textContent='Unrepost';
        if(menuTxt) menuTxt.textContent='Unrepost';
      }
    });

    const repost=document.getElementById('btnRepost');
    const repostMenu=document.getElementById('repostMenu');
    if(repost){
      repost.onclick=function(e){
        e.stopPropagation();
        if(repostMenu) repostMenu.classList.toggle('open');
      };
    }
    document.addEventListener('click', function(ev){ if(repostMenu && !ev.target.closest('.repost-menu-wrap')) repostMenu.classList.remove('open'); });
    var menuRepost=document.getElementById('menuRepostOnly');
    if(menuRepost) menuRepost.onclick=async function(e){
      e.stopPropagation();
      if(repostMenu) repostMenu.classList.remove('open');
      if(myRepostDoc){
        // Unrepost
        openDeleteModal({
          title:'Remove repost?',
          message:'This will remove your repost. The original post stays up.',
          onConfirm: async function(){
            await window.db.collection(COLLECTION).doc(myRepostDoc.id).delete();
            myRepostDoc=null;
            var label=document.getElementById('repostBtnLabel');
            var menuTxt=document.getElementById('menuRepostText');
            if(label) label.textContent='Repost';
            if(menuTxt) menuTxt.textContent='Repost';
          }
        });
        // retitle confirm button
        setTimeout(function(){ var b=document.getElementById('deleteModalConfirm'); if(b) b.textContent='Remove'; }, 0);
      } else {
        createRepost(false);
      }
    };
    var menuQuote=document.getElementById('menuQuoteRepost');
    if(menuQuote) menuQuote.onclick=function(e){
      e.stopPropagation();
      if(repostMenu) repostMenu.classList.remove('open');
      openQuoteModal(t);
    };

    function openShareModal(url, title){
      var ov=document.getElementById('shareModalOverlay');
      if(!ov){
        ov=document.createElement('div');
        ov.id='shareModalOverlay';
        ov.className='share-modal-overlay';
        ov.innerHTML='<div class="share-modal" onclick="event.stopPropagation()"><div class="share-modal-body"><h3>Share post</h3><p>Copy the link to share this post.</p><div class="share-link-row"><input type="text" id="shareModalUrl" readonly><button type="button" class="share-copy-btn" id="shareModalCopy">Copy</button></div></div></div>';
        document.body.appendChild(ov);
        ov.onclick=function(){ ov.classList.remove('open'); };
      }
      document.getElementById('shareModalUrl').value=url;
      var copyBtn=document.getElementById('shareModalCopy');
      copyBtn.textContent='Copy';
      copyBtn.onclick=function(){
        var input=document.getElementById('shareModalUrl');
        input.select();
        if(navigator.clipboard){
          navigator.clipboard.writeText(url).then(function(){
            copyBtn.textContent='Copied!';
            setTimeout(function(){ copyBtn.textContent='Copy'; }, 1500);
          });
        } else {
          try{ document.execCommand('copy'); copyBtn.textContent='Copied!'; }catch(_){}
        }
      };
      ov.classList.add('open');
    }
    const shareBtn=document.getElementById('btnShare');
    if(shareBtn)shareBtn.onclick=function(){
      const url=location.origin+'/trade.html?id='+encodeURIComponent(t.id);
      openShareModal(url, t.title||'Trade');
    };

    // Image preview remove button support
    var cImg = document.getElementById('commentImageInput');
    if(cImg && !cImg._wired){
      cImg._wired=true;
      cImg.onchange = async function(ev){
        var file = ev.target.files && ev.target.files[0];
        if(!file) return;
        try{
          var url = await compressImageFile(file, 900, 0.72);
          if(url.length > 900000) url = await compressImageFile(file, 640, 0.55);
          window._pendingCommentImage = url;
          var prev = document.getElementById('commentImagePreview');
          if(prev) prev.innerHTML = '<div class="img-prev-item"><img src="'+url+'" alt=""><button type="button" class="img-prev-remove" id="removeCommentImg" aria-label="Remove">&times;</button></div>';
          var rm=document.getElementById('removeCommentImg');
          if(rm) rm.onclick=function(){ window._pendingCommentImage=''; prev.innerHTML=''; cImg.value=''; };
        }catch(e){ alert('Could not process image'); }
      };
    }
    document.getElementById('postMenuBtn').onclick=function(e){e.stopPropagation();const m=document.getElementById('postMenu');const open=m.classList.contains('open');closeMenus();if(!open)m.classList.add('open');};
    const rp=document.getElementById('reportPostBtn');if(rp)rp.onclick=function(){openReport({kind:'post'});closeMenus();};
    const ed=document.getElementById('editPostBtn');if(ed)ed.onclick=function(){openEdit();closeMenus();};
    const del=document.getElementById('deleteTradeBtn');if(del)del.onclick=function(){deleteTrade();closeMenus();};
    bind();
  }

  function load(){
    const id=getId();if(!id){renderError('Not found');return;}
    waitForDb(function(){
      if(unsub)unsub();
      unsub=window.db.collection(COLLECTION).doc(id).onSnapshot(function(doc){
        if(!doc.exists){renderError('Not found');return;}
        const data=doc.data();data.id=doc.id;render(data);
      },function(err){console.error(err);renderError('Could not load: '+(err&&err.message?err.message:'unknown error'));});
    });
  }
  load();
})();
  </script>
</body>
</html>
