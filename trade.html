<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade — Sixers Hoops</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/navbar-styles.css" />
  <style>
    :root{--navy:#001a57;--sixers-blue:#006BB6;--sixers-red:#ED174C;--cream:#fff;--ink:#0d0f1a;--mid:#64748b;--border:#e4e8f0;--bg2:#f8fafc;--vote-up:#ea580c;--vote-down:#2563eb}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:Lexend,system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-top:64px;min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:680px;margin:0 auto;padding:1.75rem 1.15rem 4.5rem}
    .back{display:inline-flex;font-size:.82rem;font-weight:600;color:var(--sixers-blue);margin-bottom:1.25rem}
    .back:hover{text-decoration:underline}
    .post-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;margin-bottom:.85rem}
    .author-row{display:flex;align-items:center;gap:.55rem;min-width:0}
    .avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex-shrink:0}
    .author-name{font-weight:800;font-size:.95rem}
    .meta-line{font-size:.78rem;color:var(--mid)}
    .edited{font-style:italic;color:#94a3b8}
    .menu-wrap{position:relative}
    .dots-btn{width:36px;height:36px;border:none;background:transparent;border-radius:999px;color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .dots-btn:hover{background:var(--bg2);color:var(--ink)}
    .dots-menu{display:none;position:absolute;right:0;top:100%;z-index:50;min-width:170px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 28px rgba(15,23,42,.12);padding:.35rem}
    .dots-menu.open{display:block}
    .dots-menu button{display:block;width:100%;text-align:left;border:none;background:transparent;font-family:Lexend,sans-serif;font-size:.84rem;font-weight:600;padding:.6rem .8rem;border-radius:8px;cursor:pointer;color:var(--ink)}
    .dots-menu button:hover{background:var(--bg2)}
    .dots-menu button.danger{color:var(--sixers-red)}
    .title{font-size:clamp(1.35rem,3.8vw,1.85rem);font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0 0 .85rem}
    .tag{display:inline-flex;font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:.65rem;color:var(--sixers-blue);border:1px solid rgba(0,107,182,.2);background:rgba(0,107,182,.08)}
    .tag.poll{color:#7c3aed;border-color:rgba(124,58,237,.25);background:rgba(124,58,237,.08)}
    .tag.discussion{color:#0f766e;border-color:rgba(15,118,110,.25);background:rgba(15,118,110,.08)}
    .status-pill{display:inline-flex;font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .7rem;border-radius:6px;margin-left:.4rem}
    .status-pill.ok{background:rgba(22,163,74,.12);color:#15803d}
    .status-pill.bad{background:rgba(220,38,38,.1);color:#b91c1c}
    .excerpt{font-size:.98rem;line-height:1.6;color:#334155;margin:0 0 1rem;white-space:pre-wrap}

    /* Trade graphic card */
    .trade-graphic{
      border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:0 0 1.1rem;
      background:linear-gradient(180deg,#0b1220 0%,#111827 100%);color:#fff;
      box-shadow:0 10px 30px rgba(15,23,42,.12);
    }
    .tg-head{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid rgba(255,255,255,.08)}
    .tg-brand{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8}
    .tg-status{font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .55rem;border-radius:6px}
    .tg-status.ok{background:rgba(34,197,94,.15);color:#4ade80}
    .tg-status.bad{background:rgba(239,68,68,.15);color:#f87171}
    .tg-body{display:grid;grid-template-columns:1fr auto 1fr;gap:.35rem;padding:1rem .85rem 1.1rem}
    @media(max-width:560px){.tg-body{grid-template-columns:1fr;}}
    .tg-side{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.75rem}
    .tg-team{display:flex;align-items:center;gap:.45rem;font-weight:800;font-size:.88rem;margin-bottom:.55rem}
    .tg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
    .tg-label{font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8;margin:.45rem 0 .25rem}
    .tg-asset{font-size:.8rem;font-weight:600;padding:.22rem 0;border-bottom:1px dashed rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:.4rem}
    .tg-asset:last-child{border-bottom:none}
    .tg-sal{color:#93c5fd;font-weight:700;flex-shrink:0}
    .tg-arrow{display:flex;align-items:center;justify-content:center;color:#64748b;font-size:1.25rem;font-weight:800;padding:.25rem}
    .tg-empty{font-size:.75rem;color:#64748b}

    /* Engagement bar — image style */
    .engage{
      display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;
      padding:.35rem 0 .25rem;margin:0 0 1.5rem;
    }
    .e-pill{
      display:inline-flex;align-items:center;gap:.35rem;
      height:36px;padding:0 .85rem;border-radius:999px;
      border:1px solid #e5e7eb;background:#f8fafc;color:#475569;
      font-family:Lexend,sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;
      transition:background .15s,border-color .15s,color .15s;
    }
    .e-pill:hover{background:#f1f5f9;border-color:#d1d5db}
    .e-pill.active-up{color:var(--vote-up);border-color:rgba(234,88,12,.35);background:rgba(234,88,12,.08)}
    .e-pill.active-down{color:var(--vote-down);border-color:rgba(37,99,235,.35);background:rgba(37,99,235,.08)}
    .e-pill.booked{color:#ca8a04;border-color:rgba(202,138,4,.35);background:rgba(202,138,4,.08)}
    .e-pill svg{flex-shrink:0}
    .e-split{display:inline-flex;align-items:center;border:1px solid #e5e7eb;background:#f8fafc;border-radius:999px;height:36px;overflow:hidden}
    .e-split button{border:none;background:transparent;height:100%;padding:0 .7rem;cursor:pointer;color:#475569;display:inline-flex;align-items:center;gap:.3rem;font-family:Lexend,sans-serif;font-size:.82rem;font-weight:700}
    .e-split button:hover{background:#f1f5f9}
    .e-split button.active-up{color:var(--vote-up);background:rgba(234,88,12,.08)}
    .e-split button.active-down{color:var(--vote-down);background:rgba(37,99,235,.08)}
    .e-split .e-count{padding:0 .55rem 0 0;font-weight:800;font-size:.82rem;color:#334155;min-width:1.1rem}

    .section-label{font-size:.65rem;font-weight:800;letter-spacing:.16em;color:var(--mid);text-transform:uppercase;margin:0 0 .85rem;display:flex;align-items:center;gap:.6rem}
    .section-label::after{content:'';flex:1;height:1px;background:var(--border)}
    .poll-box{border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:1.5rem;background:#fff}
    .poll-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--border);border-radius:10px;padding:.75rem 1rem;margin-bottom:.5rem;background:#fff;cursor:pointer;font-family:Lexend,sans-serif;position:relative;overflow:hidden}
    .poll-opt.picked{border-color:var(--sixers-blue);background:rgba(0,107,182,.05)}
    .poll-opt.disabled{cursor:default}
    .poll-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(0,107,182,.12);z-index:0}
    .poll-opt-inner{position:relative;z-index:1;display:flex;justify-content:space-between;gap:.5rem;font-weight:600;font-size:.9rem}
    .poll-meta{font-size:.78rem;color:var(--mid);margin-top:.5rem}

    .comments-section{margin-top:.5rem}
    .comment-form{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1.25rem}
    .comment-form textarea{width:100%;box-sizing:border-box;font-family:Lexend,sans-serif;font-size:.9rem;line-height:1.55;padding:.75rem .9rem;border:1.5px solid var(--border);border-radius:10px;resize:vertical;min-height:80px;outline:none}
    .comment-form textarea:focus{border-color:var(--sixers-blue);box-shadow:0 0 0 4px rgba(0,102,204,.1)}
    .comment-form-actions{display:flex;justify-content:flex-end;margin-top:.65rem}
    .btn{display:inline-flex;align-items:center;gap:.4rem;font-family:Lexend,sans-serif;font-weight:700;font-size:.82rem;padding:.55rem 1.15rem;border-radius:999px;border:none;cursor:pointer}
    .btn-primary{background:var(--sixers-blue);color:#fff}
    .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
    .comment-card{display:flex;gap:.55rem;border:1px solid var(--border);border-radius:12px;padding:.85rem .9rem;margin-bottom:.65rem;background:#fff}
    .c-vote{display:flex;flex-direction:column;align-items:center;gap:2px;width:28px;flex-shrink:0}
    .c-vote-btn{width:26px;height:26px;border:none;background:transparent;border-radius:6px;color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .c-vote-btn.active-up{color:var(--vote-up);background:rgba(234,88,12,.1)}
    .c-vote-btn.active-down{color:var(--vote-down);background:rgba(37,99,235,.1)}
    .c-vote-count{font-size:.68rem;font-weight:800;color:var(--mid)}
    .c-body{flex:1;min-width:0}
    .c-meta{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.75rem;color:var(--mid);margin-bottom:.35rem}
    .c-author{font-weight:700;color:#334155}
    .c-text{font-size:.92rem;line-height:1.55;margin:0;white-space:pre-wrap}
    .c-menu-wrap{position:relative;flex-shrink:0}
    .c-menu{display:none;position:absolute;right:0;top:100%;z-index:40;min-width:150px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 28px rgba(15,23,42,.12);padding:.3rem}
    .c-menu.open{display:block}
    .c-menu button{display:block;width:100%;text-align:left;border:none;background:transparent;font-family:Lexend,sans-serif;font-size:.82rem;font-weight:600;padding:.55rem .75rem;border-radius:7px;cursor:pointer}
    .c-menu button:hover{background:var(--bg2)}
    .c-menu button.danger{color:var(--sixers-red)}
    .comments-empty{text-align:center;padding:1.25rem;color:var(--mid);font-size:.9rem}
    .signin-hint{font-size:.85rem;color:var(--mid);text-align:center;padding:.75rem}
    .signin-hint button{background:none;border:none;color:var(--sixers-blue);font-family:Lexend,sans-serif;font-weight:700;cursor:pointer;text-decoration:underline}

    .overlay{display:none;position:fixed;inset:0;z-index:10000;background:rgba(13,15,26,.55);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem}
    .overlay.open{display:flex}
    .mbox{background:#fff;border-radius:16px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
    .mhead{padding:1.1rem 1.35rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#f6f8fc}
    .mhead h3{margin:0;font-size:1rem;font-weight:800;letter-spacing:.04em}
    .mbody{padding:1.25rem 1.35rem}
    .mfoot{padding:.9rem 1.35rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.55rem;background:#f8fafc}
    label.fl{display:block;font-size:.62rem;font-weight:800;letter-spacing:.14em;color:var(--mid);margin:0 0 .4rem}
    .inp,.ta{width:100%;box-sizing:border-box;font-family:Lexend,sans-serif;font-size:.9rem;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:10px;outline:none;margin-bottom:1rem}
    .ta{min-height:90px;resize:vertical}
    .inp:focus,.ta:focus{border-color:var(--sixers-blue);box-shadow:0 0 0 4px rgba(0,102,204,.1)}
    .reason-list{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
    .reason-opt{display:flex;align-items:center;gap:.6rem;padding:.7rem .85rem;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:600}
    .reason-opt.active,.reason-opt:hover{border-color:var(--sixers-blue);background:rgba(0,107,182,.05)}
    .hint{font-size:.75rem;color:#94a3b8;margin:-.4rem 0 1rem}
    .state{text-align:center;padding:4rem 1rem;color:var(--mid)}
    .state h2{font-size:1.25rem;color:var(--ink);margin:0 0 .5rem}
  </style>
</head>
<body>
  <main><div class="wrap" id="root"><a href="/trades.html" class="back">← BACK TO COMMUNITY TRADES</a><p class="state">Loading…</p></div></main>

  <div class="overlay" id="editModal"><div class="mbox" onclick="event.stopPropagation()">
    <div class="mhead"><h3>EDIT POST</h3><button type="button" class="dots-btn" id="closeEditX">&times;</button></div>
    <div class="mbody">
      <p class="hint">Title and description only. The trade package cannot be changed after posting.</p>
      <label class="fl">TITLE</label><input class="inp" id="editTitle" maxlength="120" />
      <label class="fl">DESCRIPTION</label><textarea class="ta" id="editDesc" maxlength="2000"></textarea>
      <div id="editError" style="display:none;color:#dc2626;font-size:.8rem;font-weight:600"></div>
    </div>
    <div class="mfoot"><button type="button" class="btn btn-ghost" id="cancelEdit">Cancel</button><button type="button" class="btn btn-primary" id="saveEditBtn">Save Changes</button></div>
  </div></div>

  <div class="overlay" id="reportModal"><div class="mbox" onclick="event.stopPropagation()">
    <div class="mhead"><h3>REPORT</h3><button type="button" class="dots-btn" id="closeReportX">&times;</button></div>
    <div class="mbody">
      <p class="hint" id="reportHint">Help moderators review this content.</p>
      <label class="fl">REASON</label>
      <div class="reason-list" id="reasonList">
        <label class="reason-opt"><input type="radio" name="repReason" value="Spam or advertising" /> Spam or advertising</label>
        <label class="reason-opt"><input type="radio" name="repReason" value="Harassment or hate" /> Harassment or hate</label>
        <label class="reason-opt"><input type="radio" name="repReason" value="Misinformation" /> Misinformation</label>
        <label class="reason-opt"><input type="radio" name="repReason" value="Inappropriate content" /> Inappropriate content</label>
        <label class="reason-opt"><input type="radio" name="repReason" value="Off-topic" /> Off-topic</label>
        <label class="reason-opt"><input type="radio" name="repReason" value="Other" /> Other</label>
      </div>
      <div id="otherWrap" style="display:none"><label class="fl">DESCRIBE</label><textarea class="ta" id="reportOther" maxlength="500" placeholder="Tell staff what is wrong…"></textarea></div>
      <div id="reportErr" style="display:none;color:#dc2626;font-size:.8rem;font-weight:600;margin-bottom:.5rem"></div>
    </div>
    <div class="mfoot"><button type="button" class="btn btn-ghost" id="cancelReport">Cancel</button><button type="button" class="btn btn-primary" id="submitReport">Submit Report</button></div>
  </div></div>

  <script src="/nav.js"></script>
  <script>
(function(){
  const COLLECTION='community_trades', REPORTS='community_reports', MOD_EMAIL='rhatus13@gmail.com';
  const BOOK_KEY='sixershoops_bookmarked_trades';
  let trade=null, unsub=null, reportCtx=null;

  function waitForDb(cb,n){n=n||0;if(window.db){cb();return;}if(n>80){renderError('Could not connect.');return;}setTimeout(function(){waitForDb(cb,n+1);},250);}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmtM(v){if(v==null||v==='')return'';const n=Number(v);if(!isFinite(n))return'';if(Math.abs(n)>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(Math.abs(n)>=1e3)return'$'+Math.round(n/1e3)+'K';return'$'+n;}
  function timeAgo(ts){if(!ts)return'';const d=ts.toDate?ts.toDate():new Date(ts);if(isNaN(d.getTime()))return'';const s=Math.floor((Date.now()-d.getTime())/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
  function getId(){const q=new URLSearchParams(location.search).get('id');if(q)return q;const m=location.pathname.match(/^\/trade\/([^\/]+)\/?$/);return m?decodeURIComponent(m[1]):null;}
  function triggerLogin(){const b=document.getElementById('navSignInBtn');if(b)b.click();else alert('Please sign in.');}
  function isMod(){const u=window.auth&&window.auth.currentUser;return u&&u.email&&u.email.toLowerCase()===MOD_EMAIL.toLowerCase();}
  function postType(t){return t.postType||t.type||(t.sides?'trade':'discussion');}
  function machineUrl(t){return t.machineHash?'/nba-trade-machine.html#trade='+encodeURIComponent(t.machineHash):'/nba-trade-machine.html';}
  function renderError(msg){document.getElementById('root').innerHTML='<a href="/trades.html" class="back">← BACK TO COMMUNITY TRADES</a><div class="state"><h2>'+esc(msg)+'</h2></div>';}

  function getBookmarks(){try{return JSON.parse(localStorage.getItem(BOOK_KEY)||'[]');}catch(e){return[];}}
  function isBookmarked(id){return getBookmarks().indexOf(id)>=0;}
  function toggleBookmark(id){
    let list=getBookmarks();
    const i=list.indexOf(id);
    if(i>=0)list.splice(i,1);else list.push(id);
    try{localStorage.setItem(BOOK_KEY,JSON.stringify(list));}catch(e){}
    return list.indexOf(id)>=0;
  }

  function renderTradeGraphic(t){
    const sides=t.sides||t.teams;
    if(!sides||!sides.length)return'';
    const status=t.isValid===true?'<span class="tg-status ok">Legal</span>':(t.isValid===false?'<span class="tg-status bad">Invalid</span>':'');
    function sideHtml(side){
      const color=side.color||'#64748b';
      function assets(list,label){
        if(!list||!list.length)return'';
        return '<div class="tg-label">'+esc(label)+'</div>'+list.map(function(a){
          return '<div class="tg-asset"><span>'+esc(a.name||a)+'</span><span class="tg-sal">'+esc(a.salary!=null?fmtM(a.salary):(a.sal||''))+'</span></div>';
        }).join('');
      }
      const body=assets(side.receiving||side.receives,'Receives')+assets(side.sending||side.sends,'Sends')+assets(side.picks,'Picks');
      return '<div class="tg-side"><div class="tg-team"><span class="tg-dot" style="background:'+esc(color)+'"></span>'+esc(side.name||side.abbr||'Team')+'</div>'+(body||'<div class="tg-empty">No assets listed</div>')+'</div>';
    }
    // two-team layout with arrow; multi-team stacks
    let body='';
    if(sides.length===2){
      body=sideHtml(sides[0])+'<div class="tg-arrow">⇄</div>'+sideHtml(sides[1]);
    } else {
      body=sides.map(sideHtml).join('<div class="tg-arrow">+</div>');
    }
    return '<div class="trade-graphic"><div class="tg-head"><span class="tg-brand">SixersHoops Trade</span>'+status+'</div><div class="tg-body">'+body+'</div></div>';
  }

  function renderPoll(t){
    const poll=t.poll;if(!poll||!poll.options)return'';
    const user=window.auth&&window.auth.currentUser;
    const ends=poll.endsAt?new Date(poll.endsAt):null;
    const closed=!!poll.closed||(ends&&ends.getTime()<=Date.now());
    const total=poll.options.reduce(function(s,o){return s+(o.votes||0);},0)||0;
    let my=null;if(user){poll.options.forEach(function(o,i){if(o.voters&&o.voters[user.uid])my=i;});}
    let html='<div class="section-label">POLL</div><div class="poll-box">';
    poll.options.forEach(function(o,i){
      const pct=total?Math.round((o.votes||0)*100/total):0;
      const showBar=closed||my!=null;
      html+='<button type="button" class="poll-opt'+(my===i?' picked':'')+(closed?' disabled':'')+'" data-pi="'+i+'">';
      if(showBar)html+='<span class="poll-bar" style="width:'+pct+'%"></span>';
      html+='<span class="poll-opt-inner"><span>'+esc(o.text)+'</span>'+(showBar?'<span>'+pct+'% · '+(o.votes||0)+'</span>':'')+'</span></button>';
    });
    html+='<div class="poll-meta">'+(closed?'Poll closed':'Ends '+esc(timeAgo(ends)))+' · '+total+' vote'+(total===1?'':'s')+'</div></div>';
    return html;
  }

  function renderComments(comments){
    const user=window.auth&&window.auth.currentUser;
    let html='<div class="comments-section" id="comments"><div class="section-label">COMMENTS</div>';
    if(user)html+='<div class="comment-form"><textarea id="commentInput" placeholder="What do you think?" rows="3"></textarea><div class="comment-form-actions"><button type="button" class="btn btn-primary" id="submitCommentBtn">Post Comment</button></div></div>';
    else html+='<p class="signin-hint"><button type="button" id="commentSignIn">Sign in</button> to leave a comment.</p>';
    if(!comments||!comments.length)html+='<div class="comments-empty">No comments yet.</div>';
    else comments.forEach(function(c,idx){
      const uv=user&&c.voters?c.voters[user.uid]:null;
      const isAuthor=user&&c.authorId===user.uid;
      html+='<div class="comment-card"><div class="c-vote">'+
        '<button type="button" class="c-vote-btn vote-c-up'+(uv==='up'?' active-up':'')+'" data-idx="'+idx+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>'+
        '<span class="c-vote-count">'+(c.votes||0)+'</span>'+
        '<button type="button" class="c-vote-btn vote-c-down'+(uv==='down'?' active-down':'')+'" data-idx="'+idx+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button></div>'+
        '<div class="c-body"><div class="c-meta"><span class="c-author">'+esc(c.author||'u/fan')+'</span><span>·</span><span>'+esc(timeAgo(c.createdAt))+'</span></div><p class="c-text">'+esc(c.text||'')+'</p></div>'+
        '<div class="c-menu-wrap"><button type="button" class="dots-btn menu-toggle" data-idx="'+idx+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>'+
        '<div class="c-menu" id="cmenu-'+idx+'">'+(isAuthor||isMod()?'<button type="button" class="danger c-del" data-idx="'+idx+'">Delete</button>':'')+'<button type="button" class="c-report" data-idx="'+idx+'">Report</button></div></div></div>';
    });
    return html+'</div>';
  }

  function closeMenus(){
    document.querySelectorAll('.dots-menu.open,.c-menu.open').forEach(function(el){el.classList.remove('open');});
  }
  document.addEventListener('click',closeMenus);

  function openReport(ctx){
    const user=window.auth&&window.auth.currentUser;if(!user){triggerLogin();return;}
    reportCtx=ctx;
    document.getElementById('reportHint').textContent=ctx.kind==='post'?'Report this post to moderators.':'Report this comment to moderators.';
    document.querySelectorAll('input[name="repReason"]').forEach(function(r){r.checked=false;});
    document.querySelectorAll('.reason-opt').forEach(function(l){l.classList.remove('active');});
    document.getElementById('otherWrap').style.display='none';
    document.getElementById('reportOther').value='';
    document.getElementById('reportErr').style.display='none';
    document.getElementById('reportModal').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeReport(){document.getElementById('reportModal').classList.remove('open');document.body.style.overflow='';reportCtx=null;}
  document.getElementById('reasonList').addEventListener('change',function(e){
    if(e.target.name==='repReason'){
      document.querySelectorAll('.reason-opt').forEach(function(l){l.classList.toggle('active',l.contains(e.target));});
      document.getElementById('otherWrap').style.display=e.target.value==='Other'?'block':'none';
    }
  });
  document.getElementById('closeReportX').onclick=closeReport;
  document.getElementById('cancelReport').onclick=closeReport;
  document.getElementById('reportModal').onclick=function(e){if(e.target.id==='reportModal')closeReport();};
  document.getElementById('submitReport').onclick=async function(){
    const user=window.auth&&window.auth.currentUser;if(!user||!reportCtx||!trade)return;
    const reasonEl=document.querySelector('input[name="repReason"]:checked');
    const err=document.getElementById('reportErr');
    if(!reasonEl){err.style.display='block';err.textContent='Select a reason.';return;}
    let reason=reasonEl.value;const other=document.getElementById('reportOther').value.trim();
    if(reason==='Other'){if(!other){err.style.display='block';err.textContent='Please describe the issue.';return;}reason='Other: '+other;}
    const btn=document.getElementById('submitReport');btn.disabled=true;btn.textContent='Sending…';
    try{
      const payload={type:reportCtx.kind,tradeId:trade.id,tradeTitle:trade.title||'',reason:reason.slice(0,500),reporterId:user.uid,reporterName:user.displayName||(user.email?user.email.split('@')[0]:'user'),status:'open',createdAt:window.firebase.firestore.FieldValue.serverTimestamp()};
      if(reportCtx.kind==='comment'){const c=(trade.comments||[])[reportCtx.idx];payload.commentIndex=reportCtx.idx;payload.commentText=c?String(c.text||'').slice(0,500):'';payload.commentAuthorId=c?c.authorId:null;payload.commentAuthor=c?c.author:null;}
      await window.db.collection(REPORTS).add(payload);closeReport();alert('Report submitted to staff.');
    }catch(e){err.style.display='block';err.textContent=e.message||'Could not submit.';}
    btn.disabled=false;btn.textContent='Submit Report';
  };

  async function handleVote(dir){
    const user=window.auth&&window.auth.currentUser;if(!user){triggerLogin();return;}
    if(!trade)return;
    const voters=Object.assign({},trade.voters||{});let votes=trade.votes||0;const cur=voters[user.uid];
    if(cur===dir){votes+=dir==='up'?-1:1;delete voters[user.uid];}
    else{if(cur==='up')votes-=1;if(cur==='down')votes+=1;votes+=dir==='up'?1:-1;voters[user.uid]=dir;}
    try{await window.db.collection(COLLECTION).doc(trade.id).update({votes:votes,voters:voters});}catch(e){alert('Could not save vote.');}
  }
  async function voteComment(idx,dir){
    const user=window.auth&&window.auth.currentUser;if(!user){triggerLogin();return;}
    const comments=(trade.comments||[]).slice();const c=comments[idx];if(!c)return;
    if(!c.voters)c.voters={};if(c.votes==null)c.votes=0;const cur=c.voters[user.uid];
    if(cur===dir){c.votes+=dir==='up'?-1:1;delete c.voters[user.uid];}
    else{if(cur==='up')c.votes-=1;if(cur==='down')c.votes+=1;c.votes+=dir==='up'?1:-1;c.voters[user.uid]=dir;}
    comments[idx]=c;
    try{await window.db.collection(COLLECTION).doc(trade.id).update({comments:comments});}catch(e){alert('Could not save vote.');}
  }
  async function deleteComment(idx){
    const user=window.auth&&window.auth.currentUser;if(!user||!trade)return;
    const comments=(trade.comments||[]).slice();const c=comments[idx];if(!c)return;
    if(c.authorId!==user.uid&&!isMod())return;if(!confirm('Delete this comment?'))return;
    comments.splice(idx,1);
    try{await window.db.collection(COLLECTION).doc(trade.id).update({comments:comments});}catch(e){alert('Could not delete.');}
  }
  async function submitComment(){
    const user=window.auth&&window.auth.currentUser;if(!user||!trade){triggerLogin();return;}
    const input=document.getElementById('commentInput');const text=input?input.value.trim():'';if(!text)return;
    const comments=(trade.comments||[]).slice();
    comments.push({author:'u/'+(user.displayName||(user.email?user.email.split('@')[0]:'fan')),authorId:user.uid,text:text.slice(0,2000),createdAt:new Date().toISOString(),votes:0,voters:{}});
    try{await window.db.collection(COLLECTION).doc(trade.id).update({comments:comments});if(input)input.value='';}catch(e){alert('Could not post comment.');}
  }
  async function deleteTrade(){
    const user=window.auth&&window.auth.currentUser;if(!user||!trade)return;
    if(trade.authorId!==user.uid&&!isMod())return;if(!confirm('Delete this post permanently?'))return;
    try{await window.db.collection(COLLECTION).doc(trade.id).delete();location.href='/trades.html';}catch(e){alert(e.message||'Delete failed');}
  }
  async function votePoll(pi){
    const user=window.auth&&window.auth.currentUser;if(!user){triggerLogin();return;}
    if(!trade||!trade.poll)return;
    const poll=JSON.parse(JSON.stringify(trade.poll));
    const ends=poll.endsAt?new Date(poll.endsAt):null;
    if(poll.closed||(ends&&ends.getTime()<=Date.now())){alert('This poll has ended.');return;}
    poll.options.forEach(function(o){if(o.voters&&o.voters[user.uid]){o.votes=Math.max(0,(o.votes||0)-1);delete o.voters[user.uid];}});
    const o=poll.options[pi];if(!o)return;if(!o.voters)o.voters={};o.votes=(o.votes||0)+1;o.voters[user.uid]=true;
    try{await window.db.collection(COLLECTION).doc(trade.id).update({poll:poll});}catch(e){alert('Could not record vote.');}
  }
  function openEdit(){
    if(!trade)return;
    document.getElementById('editTitle').value=trade.title||'';
    document.getElementById('editDesc').value=trade.notes||'';
    document.getElementById('editError').style.display='none';
    document.getElementById('editModal').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeEdit(){document.getElementById('editModal').classList.remove('open');document.body.style.overflow='';}
  document.getElementById('closeEditX').onclick=closeEdit;
  document.getElementById('cancelEdit').onclick=closeEdit;
  document.getElementById('editModal').onclick=function(e){if(e.target.id==='editModal')closeEdit();};
  document.getElementById('saveEditBtn').onclick=async function(){
    const user=window.auth&&window.auth.currentUser;if(!user||!trade)return;
    if(trade.authorId!==user.uid&&!isMod())return;
    const title=document.getElementById('editTitle').value.trim();
    const notes=document.getElementById('editDesc').value.trim();
    const err=document.getElementById('editError');
    if(!title){err.style.display='block';err.textContent='Title required.';return;}
    const btn=document.getElementById('saveEditBtn');btn.disabled=true;btn.textContent='Saving…';
    try{
      await window.db.collection(COLLECTION).doc(trade.id).update({title:title.slice(0,120),notes:notes.slice(0,2000),summary:notes.slice(0,400),editedAt:window.firebase.firestore.FieldValue.serverTimestamp()});
      closeEdit();
    }catch(e){err.style.display='block';err.textContent=e.message||'Save failed';}
    btn.disabled=false;btn.textContent='Save Changes';
  };

  function bind(){
    const si=document.getElementById('commentSignIn');if(si)si.onclick=triggerLogin;
    const sc=document.getElementById('submitCommentBtn');if(sc)sc.onclick=submitComment;
    document.querySelectorAll('.menu-toggle').forEach(function(b){b.onclick=function(e){e.stopPropagation();const id='cmenu-'+b.getAttribute('data-idx');const m=document.getElementById(id);const open=m.classList.contains('open');closeMenus();if(!open)m.classList.add('open');};});
    document.querySelectorAll('.c-del').forEach(function(b){b.onclick=function(e){e.stopPropagation();deleteComment(+b.getAttribute('data-idx'));closeMenus();};});
    document.querySelectorAll('.c-report').forEach(function(b){b.onclick=function(e){e.stopPropagation();openReport({kind:'comment',idx:+b.getAttribute('data-idx')});closeMenus();};});
    document.querySelectorAll('.vote-c-up').forEach(function(b){b.onclick=function(e){e.stopPropagation();voteComment(+b.getAttribute('data-idx'),'up');};});
    document.querySelectorAll('.vote-c-down').forEach(function(b){b.onclick=function(e){e.stopPropagation();voteComment(+b.getAttribute('data-idx'),'down');};});
    document.querySelectorAll('.poll-opt:not(.disabled)').forEach(function(b){b.onclick=function(){votePoll(+b.getAttribute('data-pi'));};});
  }

  function render(t){
    trade=t;document.title=(t.title||'Post')+' — Sixers Hoops';
    const user=window.auth&&window.auth.currentUser;
    const userVote=user&&t.voters?t.voters[user.uid]:null;
    const canManage=user&&(t.authorId===user.uid||isMod());
    const ty=postType(t);
    const tagClass=ty==='poll'?'poll':(ty==='discussion'?'discussion':'');
    const tagLabel=ty==='poll'?'POLL':(ty==='discussion'?'DISCUSSION':'TRADE');
    const commentCount=(t.comments||[]).length;
    const booked=isBookmarked(t.id);
    const author=t.author||'u/fan';
    const initial=(author.replace(/^u\//,'')||'F').charAt(0).toUpperCase();

    let html='<a href="/trades.html" class="back">← BACK TO COMMUNITY TRADES</a>';
    html+='<div class="post-top"><div class="author-row"><div class="avatar">'+esc(initial)+'</div><div><div class="author-name">'+esc(author)+'</div><div class="meta-line">'+esc(timeAgo(t.createdAt))+(t.editedAt?' <span class="edited">· edited '+esc(timeAgo(t.editedAt))+'</span>':'')+'</div></div></div>';
    html+='<div class="menu-wrap"><button type="button" class="dots-btn" id="postMenuBtn" aria-label="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>';
    html+='<div class="dots-menu" id="postMenu">';
    if(canManage)html+='<button type="button" id="editPostBtn">Edit post</button>';
    html+='<button type="button" id="reportPostBtn">Report</button>';
    if(canManage)html+='<button type="button" class="danger" id="deleteTradeBtn">Delete</button>';
    html+='</div></div></div>';

    html+='<span class="tag '+tagClass+'">'+tagLabel+'</span>';
    if(t.isValid===true)html+='<span class="status-pill ok">Appears legal</span>';
    else if(t.isValid===false)html+='<span class="status-pill bad">Invalid / restricted</span>';
    html+='<h1 class="title">'+esc(t.title||'Untitled')+'</h1>';

    // Trade graphic directly under title
    if(ty==='trade')html+=renderTradeGraphic(t);

    if(t.notes||t.summary)html+='<p class="excerpt">'+esc(t.notes||t.summary)+'</p>';

    // Engagement bar
    html+='<div class="engage">';
    html+='<div class="e-split">'+
      '<button type="button" id="btnUp" class="'+(userVote==='up'?'active-up':'')+'" aria-label="Upvote"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>'+
      '<span class="e-count">'+(t.votes||0)+'</span>'+
      '<button type="button" id="btnDown" class="'+(userVote==='down'?'active-down':'')+'" aria-label="Downvote"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>'+
    '</div>';
    html+='<button type="button" class="e-pill" id="btnComment"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> '+commentCount+'</button>';
    html+='<button type="button" class="e-pill'+(booked?' booked':'')+'" id="btnBookmark"><svg width="16" height="16" viewBox="0 0 24 24" fill="'+(booked?'currentColor':'none')+'" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>';
    if(ty==='trade'&&t.machineHash){
      html+='<a class="e-pill" id="btnRemix" href="'+esc(machineUrl(t))+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg> Remix</a>';
    } else {
      html+='<button type="button" class="e-pill" id="btnRepost"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg> Repost</button>';
    }
    html+='<button type="button" class="e-pill" id="btnShare"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share</button>';
    html+='</div>';

    if(ty==='poll')html+=renderPoll(t);
    html+=renderComments(t.comments||[]);
    document.getElementById('root').innerHTML=html;

    document.getElementById('btnUp').onclick=function(){handleVote('up');};
    document.getElementById('btnDown').onclick=function(){handleVote('down');};
    document.getElementById('btnComment').onclick=function(){const el=document.getElementById('comments');if(el)el.scrollIntoView({behavior:'smooth'});const input=document.getElementById('commentInput');if(input)input.focus();};
    document.getElementById('btnBookmark').onclick=function(){const on=toggleBookmark(t.id);this.classList.toggle('booked',on);this.querySelector('svg').setAttribute('fill',on?'currentColor':'none');};
    const repost=document.getElementById('btnRepost');
    if(repost)repost.onclick=function(){const url=location.origin+'/trade.html?id='+encodeURIComponent(t.id);if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){alert('Link copied — share to repost.');});else prompt('Copy to repost:',url);};
    document.getElementById('btnShare').onclick=function(){
      const url=location.origin+'/trade.html?id='+encodeURIComponent(t.id);
      if(navigator.share){navigator.share({title:t.title||'Trade',url:url}).catch(function(){});}
      else if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){alert('Link copied.');});
      else prompt('Copy link:',url);
    };
    document.getElementById('postMenuBtn').onclick=function(e){e.stopPropagation();const m=document.getElementById('postMenu');const open=m.classList.contains('open');closeMenus();if(!open)m.classList.add('open');};
    const rp=document.getElementById('reportPostBtn');if(rp)rp.onclick=function(){openReport({kind:'post'});closeMenus();};
    const ed=document.getElementById('editPostBtn');if(ed)ed.onclick=function(){openEdit();closeMenus();};
    const del=document.getElementById('deleteTradeBtn');if(del)del.onclick=function(){deleteTrade();closeMenus();};
    bind();
  }

  function load(){
    const id=getId();if(!id){renderError('Not found');return;}
    waitForDb(function(){
      if(unsub)unsub();
      unsub=window.db.collection(COLLECTION).doc(id).onSnapshot(function(doc){
        if(!doc.exists){renderError('Not found');return;}
        const data=doc.data();data.id=doc.id;render(data);
      },function(err){console.error(err);renderError('Could not load');});
    });
  }
  load();
})();
  </script>
</body>
</html>
