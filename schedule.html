<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Philadelphia 76ers Schedule | SixersHoops</title>
  <meta name="description" content="2025–26 Philadelphia 76ers schedule, results, and upcoming matchups — modernized game tracker."/>
  <link rel="icon" href="/favicon.ico"/>
  <link rel="apple-touch-icon" href="/favicon.ico"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="navbar-styles.css"/>

  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T1V9Q0MNEM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T1V9Q0MNEM');
  </script>

  <style>
    :root {
      --navy: #001a57;
      --navy-deep: #0b0f1a;
      --sixers-blue: #006BB6;
      --sixers-red: #ED174C;
      --cream: #f7f8fc;
      --ink: #0d0f1a;
      --mid: #64748b;
      --border-light: #e4e8f0;
      --green: #16a34a;
      --red: #dc2626;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body, html {
      font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0; background: var(--cream); color: var(--ink);
    }
    body { padding-top: 64px; line-height: 1.55; overflow-x: hidden; }

    /* HERO — matches standings / draft picks pages */
    .page-hero { background: var(--cream); position: relative; overflow: hidden; }
    .page-hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(0,107,182,0.12) 1px, transparent 1px);
      background-size: 28px 28px; opacity: .6; pointer-events: none; z-index: 0;
    }
    .hero-glow-blue {
      position: absolute; right: -120px; top: -80px; width: 600px; height: 500px;
      background: radial-gradient(ellipse at center, rgba(0,107,182,0.08) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .hero-glow-red {
      position: absolute; left: -60px; bottom: -40px; width: 400px; height: 300px;
      background: radial-gradient(ellipse at center, rgba(237,23,76,0.05) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .hero-inner {
      position: relative; z-index: 1; max-width: 860px; margin: 0 auto;
      padding: 4.5rem 2rem 3.5rem; display: flex; flex-direction: column;
      align-items: center; text-align: center;
    }
    .hero-title-top, .hero-title-bottom {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(3.2rem, 8vw, 6rem); font-weight: 900;
      line-height: .9; letter-spacing: -0.01em; text-transform: uppercase; margin: 0;
    }
    .hero-title-top { color: var(--ink); }
    .hero-title-bottom { color: var(--sixers-blue); margin: 0 0 .2em; }
    .hero-divider { width: 32px; height: 3px; background: var(--sixers-red); border-radius: 2px; margin: 1.4rem auto 1.2rem; }
    .hero-sub { font-size: 1rem; color: var(--mid); max-width: 520px; line-height: 1.65; margin: 0 auto; }

    /* WRAPPER */
    .content-wrapper { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; font-size: .65rem; letter-spacing: .18em;
      text-transform: uppercase; color: var(--mid);
      display: flex; align-items: center; gap: .6rem; margin-bottom: 1rem;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

    /* SNAPSHOT CARDS */
    .snapshot-grid {
      display: grid; gap: 1.25rem;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      margin-bottom: 2rem;
    }
    .snapshot-card {
      position: relative; background: #fff;
      border: 1px solid #e6eaf2; border-radius: 14px;
      padding: 1.4rem 1.25rem; text-align: center; overflow: hidden;
      box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 28px -18px rgba(15,23,42,.18);
    }
    .snapshot-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--sixers-blue), #1e90d8 60%, var(--sixers-blue));
    }
    .snapshot-card.accent-red::before {
      background: linear-gradient(90deg, var(--sixers-red), #f97391 60%, var(--sixers-red));
    }
    .snapshot-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; font-size: .68rem; letter-spacing: .18em;
      text-transform: uppercase; color: var(--mid); display: block; margin-bottom: .4rem;
    }
    .snapshot-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900; font-size: 2.4rem; color: var(--sixers-blue);
      line-height: 1; display: block;
    }
    .snapshot-card.accent-red .snapshot-value { color: var(--sixers-red); }
    .snapshot-sub {
      display: block; margin-top: .35rem; font-size: .75rem;
      color: var(--mid); font-weight: 600;
    }

    /* SCHEDULE TABLE CARD */
    .schedule-container {
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .month-section {
      position: relative; background: #fff;
      border: 1px solid #e6eaf2; border-radius: 14px;
      padding: 1.5rem 1.5rem 1.25rem; overflow: hidden;
      box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 28px -18px rgba(15,23,42,.18);
      margin-bottom: 1.75rem;
    }
    .month-section::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--sixers-blue), #1e90d8 60%, var(--sixers-blue));
    }
    .month-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.4rem; font-weight: 900;
      color: var(--ink); letter-spacing: .04em; text-transform: uppercase;
      margin: .25rem 0 1.1rem; display: inline-block;
      border-bottom: none;
    }

    .table-responsive { overflow-x: auto; }

    table {
      width: 100%; border-collapse: collapse; font-size: .92rem;
    }
    th {
      font-family: 'Barlow Condensed', sans-serif;
      background: transparent; color: var(--mid);
      font-weight: 800; text-transform: uppercase;
      font-size: .68rem; letter-spacing: .14em;
      padding: .7rem .6rem; text-align: left;
      border-bottom: 1px solid var(--border-light);
    }
    td {
      padding: .85rem .6rem;
      border-bottom: 1px solid #f1f3f8;
      color: var(--ink); font-weight: 500; vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .15s ease; }
    tbody tr:hover td { background: #f5faff; }

    .game-info {
      display: flex; align-items: center; gap: .65rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; letter-spacing: .03em; font-size: 1rem;
      text-transform: uppercase; color: var(--ink);
    }
    .opponent-logo {
      width: 30px; height: 30px; object-fit: contain;
    }

    .win-result { color: var(--green); font-weight: 800; }
    .loss-result { color: var(--red); font-weight: 800; }

    .status-badge {
      display: inline-block;
      padding: .25rem .65rem; border-radius: 999px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .68rem; font-weight: 800;
      letter-spacing: .12em; text-transform: uppercase;
      border: 1px solid transparent;
    }
    .status-upcoming { background: rgba(0,107,182,.08); color: var(--sixers-blue); border-color: rgba(0,107,182,.2); }
    .status-final    { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    .status-live     { background: rgba(237,23,76,.1); color: var(--sixers-red); border-color: rgba(237,23,76,.25); animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .55; }
    }

    /* LOADER */
    .loader { text-align: center; padding: 4rem 1rem; color: var(--mid); }
    .loader p { font-family: 'Barlow Condensed', sans-serif; letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; font-weight: 700; }
    .loader-spinner {
      border: 3px solid #e6eaf2;
      border-top: 3px solid var(--sixers-blue);
      border-radius: 50%; width: 38px; height: 38px;
      animation: spin 1s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .hero-inner { padding: 3rem 1.25rem 2rem; }
      .month-section { padding: 1.1rem 1rem; }
      th, td { padding: .65rem .45rem; font-size: .82rem; }
      .game-info { font-size: .9rem; gap: .5rem; }
      .opponent-logo { width: 26px; height: 26px; }
      .snapshot-value { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <script src="nav.js"></script>

  <!-- HERO -->
  <header class="page-hero">
    <div class="hero-glow-blue"></div>
    <div class="hero-glow-red"></div>
    <div class="hero-inner">
      <p class="hero-title-top">Sixers</p>
      <p class="hero-title-bottom">Schedule</p>
      <div class="hero-divider"></div>
      <p class="hero-sub">2025–26 Season Game Tracker &amp; Results</p>
    </div>
  </header>

  <div class="content-wrapper">
    <!-- SEASON SNAPSHOT -->
    <p class="section-label">Season Snapshot</p>
    <div class="snapshot-grid" id="season-snapshot">
      <div class="snapshot-card">
        <span class="snapshot-label">Record</span>
        <span class="snapshot-value" id="stat-record">—</span>
        <span class="snapshot-sub">W–L</span>
      </div>
      <div class="snapshot-card">
        <span class="snapshot-label">Games Played</span>
        <span class="snapshot-value" id="stat-played">—</span>
        <span class="snapshot-sub">of 82</span>
      </div>
      <div class="snapshot-card accent-red">
        <span class="snapshot-label">Next Game</span>
        <span class="snapshot-value" id="stat-next" style="font-size:1.25rem;line-height:1.2;">—</span>
        <span class="snapshot-sub" id="stat-next-date">TBD</span>
      </div>
      <div class="snapshot-card">
        <span class="snapshot-label">Win %</span>
        <span class="snapshot-value" id="stat-pct">—</span>
        <span class="snapshot-sub">Season</span>
      </div>
    </div>

    <!-- SCHEDULE -->
    <p class="section-label">Game Log</p>
    <main class="schedule-container" id="schedule">
      <div class="loader">
        <div class="loader-spinner"></div>
        <p>Fetching latest schedule…</p>
      </div>
    </main>
  </div>

  <script src="schedule.js"></script>
</body>
</html>
