    // ── Post trade graphic to the Community Wall ──────────────────────────
    async function postToCommunity() {
        const user = window.auth ? window.auth.currentUser : null;
        if (!user) {
            alert('Sign in to post to the community wall.');
            return;
        }
        if (!window.db || !window.firebase) {
            alert('Community database not available on this page.');
            return;
        }

        const activeTeams = teams.filter(t =>
            t.abbr && TEAM_DATA[t.abbr] &&
            (t.selectedPlayers.length > 0 || t.selectedPicks.length > 0)
        );
        if (activeTeams.length < 2) {
            alert('Select players or picks for at least 2 teams first.');
            return;
        }

        // Prompt for a custom title
        const isValid    = document.getElementById('modalBadge').classList.contains('valid');
        const teamAbbrs  = activeTeams.map(t => t.abbr).join(' ↔ ');
        const defaultTitle = `Trade: ${teamAbbrs} — ${isValid ? 'CBA Valid ✅' : 'CBA Invalid ❌'}`;
        const customTitle = prompt('Give this post a title (or press OK to use the default):', defaultTitle);
        if (customTitle === null) return; // user cancelled
        const finalTitle = customTitle.trim() || defaultTitle;

        const btn = document.getElementById('postToCommunityBtn');
        btn.disabled = true;
        btn.textContent = 'Posting…';

        const imageUrl   = drawTradeCard(finalTitle).toDataURL('image/png');

        const post = {
            title:      finalTitle,
            content:    '',
            tag:        'Discussion',
            tagClass:   'bg-blue-100 text-blue-700 border border-blue-200',
            authorId:   user.uid,
            author:     user.displayName || (user.email ? user.email.split('@')[0] : 'Fan'),
            authorPhoto: user.photoURL || '',
            votes:      0,
            voters:     {},
            comments:   [],
            imageUrl:   imageUrl,
            isPinned:   false,
            createdAt:  window.firebase.firestore.FieldValue.serverTimestamp(),
        };

        try {
            const ref = await window.db.collection('community_posts').add(post);
            btn.textContent = 'Posted ✓';
            btn.style.background = '#16a34a';

            setTimeout(() => {
                closeModal();
                // ← update 'index.html' to your community page path if different
                if (confirm('Trade posted! Go to the community wall?')) {
                    window.location.href = 'index.html?post=' + ref.id;
                } else {
                    btn.textContent = 'Post to Community';
                    btn.style.background = '';
                    btn.disabled = false;
                }
            }, 700);
        } catch (err) {
            console.error('Post failed:', err);
            alert('Could not post: ' + err.message);
            btn.textContent = 'Post to Community';
            btn.style.background = '';
            btn.disabled = false;
        }
    }

    // ── Draw the trade card onto a 1200×630 canvas ────────────────────────
    function drawTradeCard(customTitle) {
        const W = 1200, H = 630;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');

        const isValid = document.getElementById('modalBadge').classList.contains('valid');
        const tradeTitle = customTitle || document.getElementById('modalTitle').textContent;
        const activeTeams = teams.filter(t => t.abbr && TEAM_DATA[t.abbr] && (t.selectedPlayers.length > 0 || t.selectedPicks.length > 0));

        const F = (w, sz, fam) => `${w} ${sz}px ${fam || '"Helvetica Neue", Helvetica, Arial, sans-serif'}`;

        // ── Palette — clean dark newspaper look ───────────────────────────
        const BG       = '#0c0f14';
        const CARD_BG  = '#13181f';
        const CARD_BG2 = '#0f1318';
        const RULE     = 'rgba(255,255,255,0.07)';
        const TEXT_PRI = '#eef2f7';
        const TEXT_SEC = '#6b7f94';
        const TEXT_DIM = '#3d4e5e';
        const ACCENT   = '#006BB6';
        const RED      = '#ED174C';
        const GREEN    = '#10b981';
        const ERR      = '#f43f5e';

        // ── Solid background ─────────────────────────────────────────────
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, W, H);

        // Very subtle noise texture
        ctx.save();
        ctx.globalAlpha = 0.012;
        for (let x = 0; x < W; x += 4) {
            for (let y = 0; y < H; y += 4) {
                if (Math.random() > 0.5) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        }
        ctx.restore();

        const PAD = 44;

        // ── Left accent bar (full height) ────────────────────────────────
        ctx.fillStyle = ACCENT;
        ctx.fillRect(0, 0, 5, H);

        // ── Top header area ──────────────────────────────────────────────
        const HDR_H = 110;
        ctx.fillStyle = CARD_BG;
        ctx.fillRect(0, 0, W, HDR_H);

        // Header bottom rule
        ctx.fillStyle = RULE;
        ctx.fillRect(0, HDR_H, W, 1);

        // Sixers Hoops branding — top left
        ctx.font = F(900, 11);
        ctx.fillStyle = ACCENT;
        ctx.textAlign = 'left';
        ctx.letterSpacing = '0.15em';
        ctx.fillText('Sixers Hoops', PAD, 34);
        ctx.letterSpacing = '0';

        // Red separator dot
        ctx.fillStyle = RED;
        ctx.beginPath(); ctx.arc(PAD + ctx.measureText('Sixers Hoops').width + 16, 30, 3, 0, Math.PI * 2); ctx.fill();

        // Season
        ctx.font = F(600, 10);
        ctx.fillStyle = TEXT_SEC;
        ctx.textAlign = 'left';
        ctx.fillText('2026–27 NBA Season', PAD + ctx.measureText('Sixers Hoops').width + 30, 34);

        // CBA status badge — top right
        const statusColor = isValid ? GREEN : ERR;
        const statusLabel = isValid ? 'CBA Valid' : 'CBA Violation';
        ctx.font = F(700, 10);
        const badgeW = ctx.measureText(statusLabel).width + 24;
        const badgeX = W - PAD - badgeW;
        const badgeY = 16;
        const badgeH = 24;

        roundRect(ctx, badgeX, badgeY, badgeW, badgeH, 4);
        ctx.fillStyle = statusColor + '18';
        ctx.fill();
        roundRect(ctx, badgeX, badgeY, badgeW, badgeH, 4);
        ctx.strokeStyle = statusColor + '60';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = statusColor;
        ctx.textAlign = 'left';
        ctx.fillText(statusLabel, badgeX + 12, badgeY + badgeH/2 + 3.5);

        // ── Trade title ──────────────────────────────────────────────────
        let displayTitle = tradeTitle;
        ctx.font = F(900, 40);
        const maxTitleW = W - PAD*2 - 40;
        while (ctx.measureText(displayTitle).width > maxTitleW && displayTitle.length > 4) {
            displayTitle = displayTitle.slice(0, -1);
        }
        if (displayTitle.length < tradeTitle.length) displayTitle += '…';

        ctx.fillStyle = TEXT_PRI;
        ctx.textAlign = 'left';
        ctx.fillText(displayTitle, PAD, 88);

        // Thin accent underline
        const titleW = Math.min(ctx.measureText(displayTitle).width, maxTitleW);
        ctx.fillStyle = ACCENT;
        ctx.fillRect(PAD, 96, Math.min(titleW * 0.28, 120), 2);

        // ── TEAM CARDS AREA ──────────────────────────────────────────────
        const CARD_TOP = HDR_H + 18;
        const CARD_BOT = H - 56;
        const CARD_H   = CARD_BOT - CARD_TOP;
        const maxCards = Math.min(activeTeams.length, 5);
        const GAP      = maxCards >= 4 ? 8 : 12;
        const CARD_W   = Math.floor((W - PAD*2 - GAP*(maxCards-1)) / maxCards);

        activeTeams.slice(0, 5).forEach((t, i) => {
            const d = TEAM_DATA[t.abbr];
            const teamInfo = NBA_TEAMS[t.abbr];
            const teamColor = (teamInfo && teamInfo.color && teamInfo.color !== '#000000') ? teamInfo.color : '#334155';
            const teamName  = teamInfo ? teamInfo.name : t.abbr;
            const cx = PAD + i * (CARD_W + GAP);

            const selectedPlayers = t.selectedPlayers.map(pid => d.players.find(p => p.id === pid)).filter(Boolean);
            const selectedPicks   = t.selectedPicks.map(pkid => (d.picks||[]).find(pk => pk.id === pkid)).filter(Boolean);
            const sendSal = selectedPlayers.reduce((s, p) => s + (p.salary||0), 0);
            const totalItems = selectedPlayers.length + selectedPicks.length;

            // Card background
            roundRect(ctx, cx, CARD_TOP, CARD_W, CARD_H, 8);
            ctx.fillStyle = CARD_BG;
            ctx.fill();

            // Team color top bar
            roundRect(ctx, cx, CARD_TOP, CARD_W, 4, [8,8,0,0]);
            ctx.fillStyle = teamColor;
            ctx.fill();

            // Card border
            roundRect(ctx, cx, CARD_TOP, CARD_W, CARD_H, 8);
            ctx.strokeStyle = 'rgba(255,255,255,0.07)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Card header bg
            roundRect(ctx, cx, CARD_TOP + 4, CARD_W, 52, [0,0,0,0]);
            ctx.fillStyle = CARD_BG2;
            ctx.fill();
            ctx.fillStyle = RULE;
            ctx.fillRect(cx, CARD_TOP + 56, CARD_W, 1);

            // Team abbr
            const isSmall = maxCards >= 4;
            ctx.font = F(900, isSmall ? 22 : 28);
            ctx.fillStyle = TEXT_PRI;
            ctx.textAlign = 'left';
            ctx.fillText(t.abbr, cx + 14, CARD_TOP + (isSmall ? 34 : 40));

            // Salary chip — top right of header
            if (sendSal > 0) {
                const chipTxt = '$' + (sendSal/1e6).toFixed(1) + 'M';
                ctx.font = F(700, isSmall ? 9 : 10);
                const cw = ctx.measureText(chipTxt).width + 14;
                const chY = CARD_TOP + 14, chH = 20;
                const chX = cx + CARD_W - cw - 10;
                roundRect(ctx, chX, chY, cw, chH, 3);
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.fill();
                ctx.fillStyle = TEXT_SEC;
                ctx.textAlign = 'left';
                ctx.fillText(chipTxt, chX + 7, chY + chH/2 + 3.5);
            }

            // "SENDS" label
            ctx.font = F(600, isSmall ? 7 : 8);
            ctx.fillStyle = TEXT_DIM;
            ctx.textAlign = 'left';
            ctx.letterSpacing = '0.1em';
            ctx.fillText('Sends', cx + 14, CARD_TOP + 53);
            ctx.letterSpacing = '0';

            // Player / pick rows
            let cursor = CARD_TOP + 70;
            const LINE_H = isSmall ? 26 : 32;
            const innerW = CARD_W - 28;
            const MAX_ITEMS = Math.floor((CARD_H - 74) / LINE_H);
            const showCount = Math.min(totalItems, MAX_ITEMS);
            let shown = 0;

            selectedPlayers.forEach((p) => {
                if (shown >= showCount) return;
                if (shown === showCount - 1 && totalItems > showCount) {
                    ctx.font = F(500, isSmall ? 9 : 10);
                    ctx.fillStyle = TEXT_DIM;
                    ctx.textAlign = 'left';
                    ctx.fillText(`+${totalItems - shown} more`, cx + 14, cursor + LINE_H/2 + 3.5);
                    shown++; return;
                }
                // Row separator
                if (shown > 0) {
                    ctx.fillStyle = RULE;
                    ctx.fillRect(cx + 14, cursor, CARD_W - 28, 1);
                }
                // Name
                ctx.font = F(700, isSmall ? 11 : 13);
                ctx.fillStyle = TEXT_PRI;
                ctx.textAlign = 'left';
                let pName = p.name;
                while (ctx.measureText(pName).width > innerW - 60 && pName.length > 4) pName = pName.slice(0,-1);
                if (pName.length < p.name.length) pName += '…';
                ctx.fillText(pName, cx + 14, cursor + LINE_H/2 + (isSmall ? 2 : 3));
                // Position
                if (p.position && p.position !== '—' && !isSmall) {
                    ctx.font = F(600, 8.5);
                    ctx.fillStyle = TEXT_DIM;
                    ctx.fillText(p.position, cx + 14, cursor + LINE_H/2 + 14);
                }
                // Salary
                if (p.salary) {
                    ctx.font = F(600, isSmall ? 9 : 10.5);
                    ctx.fillStyle = TEXT_SEC;
                    ctx.textAlign = 'right';
                    ctx.fillText('$'+(p.salary/1e6).toFixed(1)+'M', cx + CARD_W - 12, cursor + LINE_H/2 + 3.5);
                }
                cursor += LINE_H; shown++;
            });

            selectedPicks.forEach((pk) => {
                if (shown >= showCount) return;
                if (shown === showCount - 1 && totalItems > showCount) {
                    ctx.font = F(500, isSmall ? 9 : 10); ctx.fillStyle = TEXT_DIM; ctx.textAlign = 'left';
                    ctx.fillText(`+${totalItems - shown} more`, cx + 14, cursor + LINE_H/2 + 3.5);
                    shown++; return;
                }
                if (shown > 0) { ctx.fillStyle = RULE; ctx.fillRect(cx + 14, cursor, CARD_W - 28, 1); }

                // Pick label — yellow-ish tint
                ctx.font = F(600, isSmall ? 10 : 11.5);
                ctx.fillStyle = '#a3b8cc';
                ctx.textAlign = 'left';
                let pkName = pk.name;
                while (ctx.measureText(pkName).width > innerW && pkName.length > 4) pkName = pkName.slice(0,-1);
                if (pkName.length < pk.name.length) pkName += '…';
                ctx.fillText(pkName, cx + 14, cursor + LINE_H/2 + 3.5);
                cursor += LINE_H; shown++;
            });

            // Empty state
            if (totalItems === 0) {
                ctx.font = F(400, 11);
                ctx.fillStyle = TEXT_DIM;
                ctx.textAlign = 'center';
                ctx.fillText('No assets selected', cx + CARD_W/2, CARD_TOP + CARD_H/2);
            }

            // ── Arrow connector (between cards) ──────────────────────────
            if (i < maxCards - 1) {
                const axX = cx + CARD_W + GAP/2;
                const axY = CARD_TOP + CARD_H/2;
                ctx.fillStyle = TEXT_DIM;
                ctx.font = F(400, 14);
                ctx.textAlign = 'center';
                ctx.fillText('⇄', axX, axY + 5);
            }
        });

        // ── Footer ───────────────────────────────────────────────────────
        const footY = H - 48;
        ctx.fillStyle = CARD_BG;
        ctx.fillRect(0, footY, W, 48);
        ctx.fillStyle = RULE;
        ctx.fillRect(0, footY, W, 1);

        // Total salary moving
        const totalSalaryMoving = activeTeams.reduce((sum, t) => {
            const d = TEAM_DATA[t.abbr];
            return sum + t.selectedPlayers.reduce((s, pid) => {
                const p = d.players.find(p => p.id === pid);
                return s + (p ? p.salary : 0);
            }, 0);
        }, 0);

        ctx.font = F(600, 10);
        ctx.fillStyle = TEXT_DIM;
        ctx.textAlign = 'left';
        ctx.fillText('Sixers Hoops  ·  sixershoops.com', PAD, footY + 28);

        if (totalSalaryMoving > 0) {
            const salStr = '$' + (totalSalaryMoving/1e6).toFixed(1) + 'M salary moving  ·  ' + activeTeams.length + ' teams';
            ctx.textAlign = 'center';
            ctx.fillText(salStr, W/2, footY + 28);
        }

        const statusStr = isValid ? '✓ CBA Compliant' : '✗ CBA Violation';
        ctx.fillStyle = isValid ? GREEN : ERR;
        ctx.font = F(700, 10);
        ctx.textAlign = 'right';
        ctx.fillText(statusStr, W - PAD, footY + 28);

        return canvas;
    }

    // Helper: rounded rectangle path
    function roundRect(ctx, x, y, w, h, r) {
        if (typeof r === 'number') r = [r,r,r,r];
        const [tl,tr,br,bl] = r;
        ctx.beginPath();
        ctx.moveTo(x + tl, y);
        ctx.lineTo(x + w - tr, y); ctx.arcTo(x+w, y, x+w, y+tr, tr);
        ctx.lineTo(x + w, y + h - br); ctx.arcTo(x+w, y+h, x+w-br, y+h, br);
        ctx.lineTo(x + bl, y + h); ctx.arcTo(x, y+h, x, y+h-bl, bl);
        ctx.lineTo(x, y + tl); ctx.arcTo(x, y, x+tl, y, tl);
        ctx.closePath();
    }

    // ── Show share preview modal ──────────────────────────────────────────
    function showSharePreview(canvas, titleLabel) {

                <a id="shareDownloadLink" href="${url}" download="sixers-hoops-trade-${Date.now()}.png"

    function selectImage(img) {
        if (window.getSelection) {
            const sel = window.getSelection();
            const range = document.createRange();
            range.selectNode(img);
            sel.removeAllRanges();
            sel.addRange(range);
        }
    }

    async function copyImageToClipboard(dataUrl) {
        const btn = document.getElementById('copyImgBtn');
        try {
            const res  = await fetch(dataUrl);
            const blob = await res.blob();
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy Image'; }, 2000); }
        } catch(e) {
            // Fallback: open in new tab so user can right-click copy
            const win = window.open();
            if (win) { win.document.write(`<img src="${dataUrl}" style="max-width:100%">`); win.document.title = 'Right-click to Copy Image'; }
            else if (btn) { btn.textContent = 'Open Tab (Right-click Copy)'; setTimeout(() => { btn.textContent = 'Copy Image'; }, 3000); }
        }
    }

    function copyDataURL(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert('Data URL copied to clipboard. Paste it as the src of an <img> tag on your site.');
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = url;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            alert('Data URL copied. Paste it as the src of an <img> tag on your site.');
        });
    }

    function copyEmbedCode() {
        const overlay = document.getElementById('sharePreviewModal');
        const url = overlay ? overlay.dataset.imgUrl : '';
        const code = `<img src="${url}" alt="NBA Trade Analysis — Sixers Hoops" style="max-width:100%;border-radius:8px;">`;
        navigator.clipboard.writeText(code).then(() => {
            alert('Embed code copied! Paste directly into your site HTML.');
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = code;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            alert('Embed code copied!');
        });
    }


    // ─── HELPERS ─────────────────────────────────────────────────────────────
    function fmtM(val) {
        if (!val && val !== 0) return '—';
        const abs = Math.abs(val);
        if (abs >= 1_000_000) return (val < 0 ? '-' : '') + '$' + (abs / 1_000_000).toFixed(1) + 'M';
        return (val < 0 ? '-' : '') + '$' + abs.toLocaleString();
    }
    function fmtFull(val) {
        return val.toLocaleString('en-US', { maximumFractionDigits: 0 });
    }
    function fmtPct(val) { return (val * 100).toFixed(0); }

    function getApronStatus(salary) {
        if (salary > CBA.secondApron) return { label: 'Above 2nd Apron', cls: 'second' };
        if (salary > CBA.firstApron)  return { label: 'Above 1st Apron', cls: 'first' };
        if (salary > CBA.luxuryTax)   return { label: 'Luxury Tax', cls: 'tax' };
        if (salary > CBA.salaryCap)   return { label: 'Over Cap', cls: 'tax' };
        return { label: 'Under Cap', cls: 'under' };
    }

    // ─── CUSTOM DROPDOWN ─────────────────────────────────────────────────────
    let openDropdownId = null;
    // Remembers the original team-card-header parent for each portaled dropdown,
    // so we can re-attach instead of removing (removing it makes getElementById
    // return null on the next toggle and the dropdown stops opening).
    const dropdownOrigin = new Map();

    function toggleDropdown(teamId, e) {
        if (e) e.stopPropagation();
        const dd = document.getElementById('dd-' + teamId);
        const hdr = document.getElementById('hdr-' + teamId);
        if (!dd) return;
        const isOpen = dd.classList.contains('open');
        closeAllDropdowns();
        if (!isOpen) {
            // Portal to body so position:fixed escapes any transformed/overflow ancestor
            if (dd.parentElement !== document.body) {
                dropdownOrigin.set(String(teamId), dd.parentElement);
                dd.dataset.portalForTeam = teamId;
                document.body.appendChild(dd);
            }
            dd.classList.add('open');
            hdr.classList.add('open');
            openDropdownId = teamId;
            setTimeout(() => {
                const inp = document.getElementById('ddsearch-' + teamId);
                if (inp) inp.focus();
            }, 50);
        }
    }

    function closeDropdown(teamId) {
        const dd = document.getElementById('dd-' + teamId);
        const hdr = document.getElementById('hdr-' + teamId);
        if (dd) {
            dd.classList.remove('open');
            if (dd.parentElement === document.body) {
                const origin = dropdownOrigin.get(String(teamId));
                if (origin && document.body.contains(origin)) {
                    origin.appendChild(dd);
                } else {
                    // Origin gone (re-render) — safe to drop the detached node
                    dd.remove();
                }
                dropdownOrigin.delete(String(teamId));
            }
        }
        if (hdr) hdr.classList.remove('open');
        if (openDropdownId === teamId) openDropdownId = null;
    }

    function closeAllDropdowns() {
        document.querySelectorAll('.team-dropdown.open').forEach(el => {
            el.classList.remove('open');
            if (el.parentElement === document.body) {
                const tid = el.dataset.portalForTeam;
                const origin = tid != null ? dropdownOrigin.get(String(tid)) : null;
                if (origin && document.body.contains(origin)) {
                    origin.appendChild(el);
                } else {
                    el.remove();
                }
                if (tid != null) dropdownOrigin.delete(String(tid));
            }
        });
        document.querySelectorAll('.team-card-header.open').forEach(el => el.classList.remove('open'));
        openDropdownId = null;
    }

    function filterDropdown(teamId, query) {
        const list = document.getElementById('ddlist-' + teamId);
        if (!list) return;
        const q = query.toLowerCase().trim();
        list.querySelectorAll('.team-tile').forEach(opt => {
            const name = opt.dataset.name || '';
            const abbr = opt.dataset.abbr || '';
            opt.style.display = (!q || name.includes(q) || abbr.includes(q)) ? '' : 'none';
        });
        list.querySelectorAll('.team-grid-picker').forEach(sec => {
            const hasVisible = [...sec.querySelectorAll('.team-tile')].some(o => o.style.display !== 'none');
            const label = sec.querySelector('.team-grid-section-label');
            if (label) label.style.display = hasVisible ? '' : 'none';
        });
    }

    // Close dropdowns when clicking outside
    document.addEventListener('click', function(e) {
        if (openDropdownId !== null) {
            const hdr = document.getElementById('hdr-' + openDropdownId);
            const dd  = document.getElementById('dd-' + openDropdownId);
            const insideHdr = hdr && hdr.contains(e.target);
            const insideDd  = dd  && dd.contains(e.target);
            if (!insideHdr && !insideDd) {
                closeAllDropdowns();
            }
        }
    });

    // ─── BOOTSTRAP ───────────────────────────────────────────────────────────
    init();

    /* ───────────────────────────────────────────────────────────────────────

           ],
           tpes: [
             { id: 'phia-tpe1', amount: 9_700_000, expires: 'July 2025', source: 'Harden Trade' }
           ]
         },
         // ...more teams
       }
    ─────────────────────────────────────────────────────────────────────── */
    window.importTeamData = function(data) {
        Object.assign(TEAM_DATA, data);
        renderAll();
        console.log('Team data imported for:', Object.keys(data).join(', '));
    };
