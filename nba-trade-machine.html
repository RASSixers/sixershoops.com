    // ─── STATS BAR ───────────────────────────────────────────────────────────
    function updateStats() {
        let totalPlayers = 0, totalPicks = 0, totalSalary = 0;
        teams.forEach(t => {
            totalPlayers += t.selectedPlayers.length + (t.faSignings || []).length;
            totalPicks += t.selectedPicks.length;
            const data = t.abbr && TEAM_DATA[t.abbr];
            if (data && data.players) {
                t.selectedPlayers.forEach(pid => {
                    const p = data.players.find(p => p.id === pid);
                    if (p) totalSalary += p.salary;
                });
            }
            (t.faSignings || []).forEach(s => { totalSalary += s.salary; });
        });
        const setEl = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
        setEl('totalPlayers', totalPlayers);
        setEl('totalPicks', totalPicks);
        setEl('totalSalary', fmtM(totalSalary));

    }

    // ─── CBA TRADE ANALYSIS ──────────────────────────────────────────────────
    // ─── TRADE FLOW ROUTING (2-team pooled vs 3+ team per-destination) ──────
    // Also splits incoming salary into "matchable" vs "Minimum Salary Exception" (players at/under
    // CBA.minExceptionCap can be acquired outright and don't count against the matching requirement),
    // and tracks incoming player counts for roster-size checks.
    function computeTradeFlows() {
        const flows = {};
        teams.forEach(t => { flows[t.id] = { sendingSalary: 0, receivingSalary: 0, matchableReceivingSalary: 0, minExceptionSalary: 0, unassignedSalary: 0, incomingCount: 0 }; });

        const teamsWithPlayers = teams.filter(t => t.abbr && TEAM_DATA[t.abbr] && t.selectedPlayers.length > 0);
        const multiTeam = teamsWithPlayers.length > 2;

        teams.forEach(t => {
            const data = t.abbr && TEAM_DATA[t.abbr] ? TEAM_DATA[t.abbr] : null;
            if (!data) return;
            t.selectedPlayers.forEach(pid => {
                const p = data.players.find(pp => pp.id === pid);
                if (!p) return;
                flows[t.id].sendingSalary += p.salary;
                const viaMinException = p.salary <= CBA.minExceptionCap;
                if (multiTeam) {
                    const dest = (t.playerDestinations || {})[pid];
                    if (dest != null && flows[dest]) {
                        flows[dest].receivingSalary += p.salary;
                        flows[dest].incomingCount += 1;
                        if (viaMinException) flows[dest].minExceptionSalary += p.salary;
                        else flows[dest].matchableReceivingSalary += p.salary;
                    } else {
                        flows[t.id].unassignedSalary += p.salary;
                    }
                }
            });
        });

        if (!multiTeam) {
            // Exact for 2-team trades: everything one side sends, the other side receives.
            teams.forEach(t => {
                const data = t.abbr && TEAM_DATA[t.abbr] ? TEAM_DATA[t.abbr] : null;
                if (!data) return;
                teams.forEach(other => {
                    if (other.id === t.id) return;
                    const odata = other.abbr && TEAM_DATA[other.abbr] ? TEAM_DATA[other.abbr] : null;
                    if (!odata) return;
                    other.selectedPlayers.forEach(pid => {
                        const p = odata.players.find(pp => pp.id === pid);
                        if (!p) return;
                        flows[t.id].receivingSalary += p.salary;
                        flows[t.id].incomingCount += 1;
                        if (p.salary <= CBA.minExceptionCap) flows[t.id].minExceptionSalary += p.salary;
                        else flows[t.id].matchableReceivingSalary += p.salary;
                    });
                });
            });
        }

        return { flows, multiTeam };
    }

    function setPlayerDestination(teamId, playerId, destTeamId) {
        const t = teams.find(x => x.id === teamId);
        if (!t) return;
        if (!t.playerDestinations) t.playerDestinations = {};
        t.playerDestinations[playerId] = destTeamId ? Number(destTeamId) : null;
        updateStats();
    }

    function setCashOut(teamId, val) {
        const t = teams.find(x => x.id === teamId);
        if (!t) return;
        t.cashOut = Math.max(0, Number(val) || 0);
    }

    function analyzeTrade() {
        const panel = document.getElementById('resultPanel');
        panel.classList.add('visible');

        const violations = [];
        const warnings = [];
        const infos = [];

        // Basic checks
        const teamsWithSelections = teams.filter(t => t.selectedPlayers.length > 0 || t.selectedPicks.length > 0 || t.selectedTPEs.length > 0 || (t.faSignings||[]).length > 0);
        if (teamsWithSelections.length < 1) {
            showResult(false, 'Incomplete Trade', 'Select players, picks, or add FA signings for at least one team.', [{ type:'error', msg:'Select players, picks, or add FA signings for at least one team.' }], []);
            return;
        }
        // Trades require 2+ teams — FA-only analysis (no counterparty) is allowed as standalone check
        const teamsInTrade = teams.filter(t => t.selectedPlayers.length > 0 || t.selectedPicks.length > 0 || t.selectedTPEs.length > 0);
        const teamsWithFAOnly = teams.filter(t => (t.faSignings||[]).length > 0 && t.selectedPlayers.length === 0 && t.selectedPicks.length === 0);
        const teamsWithoutAbbr = teams.filter(t => !t.abbr && (t.selectedPlayers.length > 0));
        if (teamsWithoutAbbr.length > 0) {
            violations.push({ type: 'error', msg: 'All teams with selected players must have a team selected.' });
        }

        // Build trade summary per team
        const tradeSummary = teams.map(t => {
            const data = t.abbr && TEAM_DATA[t.abbr] ? TEAM_DATA[t.abbr] : null;
            const sendingSalary = t.selectedPlayers.reduce((sum, pid) => {
                if (!data) return sum;
                const p = data.players.find(p => p.id === pid);
                return sum + (p ? p.salary : 0);
            }, 0);
            const currentSalary = data ? (data.teamSalary || 0) : 0;
            // Receiving salary = sum of all OTHER teams' sending salary (simplified for now - data import handles this properly)
            return { ...t, sendingSalary, currentSalary, data, teamInfo: NBA_TEAMS[t.abbr] || null };
        });

        // Receiving salary: for 2-team trades, everything one side sends is received by the other,
        // so a pooled sum is exact. For 3+ team trades that is NOT generally true (Team A's outgoing
        // salary may go to Team C, not Team B), so we route by explicit per-player destination instead.
        const { flows: tradeFlows, multiTeam: isMultiTeamTrade } = computeTradeFlows();
        tradeSummary.forEach(t => {
            const f = tradeFlows[t.id] || { receivingSalary: 0, matchableReceivingSalary: 0, minExceptionSalary: 0, unassignedSalary: 0, incomingCount: 0 };
            t.receivingSalary = f.receivingSalary;
            t.matchableReceivingSalary = f.matchableReceivingSalary;
            t.minExceptionSalary = f.minExceptionSalary;
            t.unassignedSalary = f.unassignedSalary || 0;
            t.incomingCount = f.incomingCount || 0;
        });
        if (isMultiTeamTrade) {
            tradeSummary.forEach(t => {
                if (t.unassignedSalary > 0) {
                    violations.push({ type: 'error', msg: `${t.teamInfo ? t.teamInfo.name : (t.abbr || 'A team')}: This is a 3+ team trade — use the "Send to" dropdown next to each selected player to assign a destination before this trade can be analyzed. $${fmtFull(t.unassignedSalary)} in outgoing salary is currently unassigned.` });
                }
            });
        }

        // Modeling limitations disclosure — shown once so numbers aren't taken as more precise
        // than the underlying data actually supports.
        infos.push({ type: 'info', msg: `Modeling notes: uses full listed salary for Non-Guaranteed contracts (not a partial-guarantee amount, which isn't in this dataset), does not model trade kickers/likely-to-be-earned bonuses or Sign-and-Trade Base Year Compensation, and uses standard Team Salary rather than the CBA's Apron-specific Team Salary definition (which adjusts for incentives and cap holds). Figures near an apron line should be independently verified.` });

        // ── CBA RULE CHECKS ────────────────────────────────────────────────
        tradeSummary.forEach(t => {
            if (!t.abbr || !t.data) return;
            const name = t.teamInfo ? t.teamInfo.name : t.abbr;
            const currentSalary = t.currentSalary;
            const postSalary = currentSalary - t.sendingSalary + t.receivingSalary;
            const isAboveCap = currentSalary > CBA.salaryCap;
            const isAboveFirstApron = postSalary > CBA.firstApron || currentSalary > CBA.firstApron;
            const isAboveSecondApron = postSalary > CBA.secondApron || currentSalary > CBA.secondApron;
            t.postSalary = postSalary;
            t.isAboveFirstApron = isAboveFirstApron;
            t.isAboveSecondApron = isAboveSecondApron;
            t.usedExpandedMatching = !isAboveFirstApron && t.matchableReceivingSalary > t.sendingSalary + CBA.matchBuffer;

            // ── Salary matching rules (Art. VII Sec. 6(j)) ────────────────
            // isAboveFirstApron here reflects "will this team be an Apron team" (current OR post-trade),
            // which is the correct test for which matching regime applies. Incoming players acquired
            // under the Minimum Player Salary Exception (t.minExceptionSalary) are excluded from the
            // amount that must be matched.
            if (t.minExceptionSalary > 0) {
                infos.push({ type: 'info', msg: `${name}: $${fmtFull(t.minExceptionSalary)} of incoming salary qualifies for the Minimum Player Salary Exception and is excluded from the salary-matching requirement below.` });
            }
            if (isAboveCap && t.sendingSalary > 0 && t.matchableReceivingSalary > 0) {
                const outgoing = t.sendingSalary;
                const apronMax = isAboveFirstApron ? apronMatchMax(outgoing) : standardMatchMax(outgoing);

                if (t.matchableReceivingSalary > apronMax) {
                    violations.push({ type: 'error', msg: `${name}: Incoming salary requiring a match ($${fmtFull(t.matchableReceivingSalary)}) exceeds the max allowed ($${fmtFull(apronMax)}) under CBA salary matching rules${isAboveFirstApron ? ' (Apron teams are limited to a 100% match, with no $250k buffer)' : ''}.` });
                } else if (!isAboveFirstApron && t.matchableReceivingSalary > outgoing + CBA.matchBuffer) {
                    infos.push({ type: 'info', msg: `${name}: Using expanded salary-matching rules (up to ${fmtPct(apronMax/outgoing)}% of outgoing salary at this level).` });
                }
            }

            // ── Second Apron restrictions (Art. VII Sec. 2(e)) ────────────
            if (isAboveSecondApron) {
                // Cannot aggregate outgoing salaries to match a larger incoming salary. A second-apron
                // team CAN still send multiple players in one trade as long as no combination is needed —
                // i.e., the incoming salary must fit under the single largest outgoing salary.
                if (t.selectedPlayers.length > 1 && t.data) {
                    const outgoingSalaries = t.selectedPlayers
                        .map(pid => t.data.players.find(p => p.id === pid))
                        .filter(Boolean)
                        .map(p => p.salary);
                    const maxSingleOutgoing = outgoingSalaries.length ? Math.max(...outgoingSalaries) : 0;
                    if (t.matchableReceivingSalary > maxSingleOutgoing) {
                        violations.push({ type: 'error', msg: `${name}: Second Apron teams cannot aggregate multiple outgoing salaries to match a larger incoming salary. Largest single outgoing salary is $${fmtFull(maxSingleOutgoing)}, but the team would take back $${fmtFull(t.matchableReceivingSalary)} requiring a match.` });
                    } else {
                        infos.push({ type: 'info', msg: `${name}: Sending multiple players is fine here since the incoming salary requiring a match ($${fmtFull(t.matchableReceivingSalary)}) fits under the largest single outgoing salary ($${fmtFull(maxSingleOutgoing)}) — no aggregation is required.` });
                    }
                }
                // Cannot use TPE from prior trade
                if (t.selectedTPEs.length > 0) {
                    violations.push({ type: 'error', msg: `${name}: Second Apron teams cannot use prior Traded Player Exceptions.` });
                }
                // Cash: Second Apron teams cannot send or receive cash at all in a trade.
                if ((t.cashOut || 0) > 0) {
                    violations.push({ type: 'error', msg: `${name}: Second Apron teams cannot send or receive cash in a trade — remove the $${fmtFull(t.cashOut)} cash included here.` });
                } else {
                    warnings.push({ type: 'warning', msg: `${name} is above the Second Apron — cannot send or receive cash in this trade.` });
                }
            }

            // ── Cash trade limit (Art. VII Sec. 3(c)) — $6.0M per season ─────
            if ((t.cashOut || 0) > CBA.cashLimit) {
                violations.push({ type: 'error', msg: `${name}: Cash included ($${fmtFull(t.cashOut)}) exceeds the ${fmtM(CBA.cashLimit)} cash-in-trades limit for the season (this checks only the cash entered here, not cash sent in other trades this season).` });
            }

            // ── First Apron restrictions ───────────────────────────────────
            if (isAboveFirstApron && !isAboveSecondApron) {
                warnings.push({ type: 'warning', msg: `${name} is above the First Apron — sign-and-trade acquisitions are prohibited, and salary matching is limited to a flat 100% of outgoing salary (no $250k buffer).` });
            }

            // ── Post-trade Second Apron check ─────────────────────────────
            if (!isAboveSecondApron && postSalary > CBA.secondApron) {
                warnings.push({ type: 'warning', msg: `${name}: This trade would push the team above the Second Apron ($${fmtFull(postSalary)} projected salary). Severe restrictions apply.` });
            }
        });



        // ── Draft Pick Trading Rules ──────────────────────────────────────
        const CURRENT_DRAFT_YEAR = 2027; // 2026-27 season, next draft is 2027

        tradeSummary.forEach(t => {
            if (!t.abbr || !t.data) return;
            const name = t.teamInfo ? t.teamInfo.name : t.abbr;
            const isAboveSecondApron = t.currentSalary > CBA.secondApron;

            const picksBeingSent = t.selectedPicks
                .map(pid => t.data.picks.find(p => p.id === pid))
                .filter(Boolean);

            if (picksBeingSent.length === 0) return;

            // ── Frozen picks cannot be traded ─────────────────────────────
            picksBeingSent.forEach(p => {
                if (p.protections === 'Frozen') {
                    violations.push({ type: 'error', msg: `${name}: Cannot trade ${p.name} — this pick is frozen and cannot be traded per CBA Art. VII Sec. 6.` });
                }
            });

            // ── Second Apron: cannot trade 1st-round picks more than 2 draft classes out ──
            if (isAboveSecondApron) {
                picksBeingSent.forEach(p => {
                    if (p.round !== 1) return;
                    const yearMatch = p.name.match(/(\d{4})/);
                    if (!yearMatch) return;
                    const pickYear = parseInt(yearMatch[1]);
                    if (pickYear > CURRENT_DRAFT_YEAR + 1) {
                        violations.push({ type: 'error', msg: `${name}: Second Apron teams cannot trade first-round picks more than 2 draft classes away (${p.name} is ${pickYear - CURRENT_DRAFT_YEAR + 1} years out).` });
                    }
                });
            }

            // ── Stepien Rule: cannot have no 1st-round pick in consecutive years ──
            // Get all own first-round picks currently owned by this team
            const allOwnFirsts = t.data.picks.filter(p => p.round === 1 && (p.name.includes('Own') || p.owner === t.abbr));
            const sentOwnFirsts = picksBeingSent.filter(p => p.round === 1 && (p.name.includes('Own') || p.owner === t.abbr));

            if (sentOwnFirsts.length > 0) {
                // Get years that would remain after sending these picks
                const sentIds = new Set(sentOwnFirsts.map(p => p.id));
                const remainingOwnFirsts = allOwnFirsts.filter(p => !sentIds.has(p.id));

                // Build set of years the team will own a first after the trade
                const ownedYears = new Set();
                remainingOwnFirsts.forEach(p => {
                    const m = p.name.match(/(\d{4})/);
                    if (m) ownedYears.add(parseInt(m[1]));
                });

                // Also credit any incoming 1st-round picks from the trade
                tradeSummary.forEach(other => {
                    if (other.id === t.id || !other.data) return;
                    other.selectedPicks.forEach(pid => {
                        const pk = other.data.picks.find(p => p.id === pid);
                        if (pk && pk.round === 1 && pk.owner === t.abbr) {
                            const m = pk.name.match(/(\d{4})/);
                            if (m) ownedYears.add(parseInt(m[1]));
                        }
                    });
                });

                // Check for consecutive missing own picks in upcoming 6 years
                const checkStart = CURRENT_DRAFT_YEAR;
                const checkEnd = CURRENT_DRAFT_YEAR + 5;
                for (let yr = checkStart; yr < checkEnd; yr++) {
                    if (!ownedYears.has(yr) && !ownedYears.has(yr + 1)) {
                        violations.push({ type: 'error', msg: `${name}: Stepien Rule violation — after this trade, team would have no first-round pick in consecutive years ${yr} and ${yr + 1}.` });
                        break;
                    }
                }
            }

            // ── Cannot trade unowned picks ─────────────────────────────────
            // Warn if a team is trying to send a pick that belongs to another team
            picksBeingSent.forEach(p => {
                if (p.owner && p.owner !== t.abbr) {
                    warnings.push({ type: 'warning', msg: `${name}: ${p.name} is owned by ${p.owner} — verify this pick is legitimately tradeable by ${name}.` });
                }
            });
        });

        // ── Non-aggregation: teams can't combine exceptions ───────────────
        const teamsUsingTPEAndPlayer = tradeSummary.filter(t => t.selectedTPEs.length > 0 && t.selectedPlayers.length > 0);
        if (teamsUsingTPEAndPlayer.length > 0) {
            teamsUsingTPEAndPlayer.forEach(t => {
                warnings.push({ type: 'warning', msg: `${t.teamInfo?.name || t.abbr}: Cannot combine a TPE with other exceptions in the same transaction (CBA Art. VII Sec. 6(m)).` });
            });
        }

        // ── FA SIGNING & SIGN-AND-TRADE RULES ────────────────────────────
        // Reference: CBA Art. VII Sec. 4 (Free Agent Signings) & Sec. 5 (S&T)
        tradeSummary.forEach(t => {
            if (!t.abbr) return;
            const signings = t.faSignings || [];
            if (signings.length === 0) return;
            const name = t.teamInfo ? t.teamInfo.name : t.abbr;
            const data = t.data;
            const currentSalary = t.currentSalary;
            const isAboveCap = currentSalary > CBA.salaryCap;
            const isAboveFirstApron = currentSalary > CBA.firstApron;
            const isAboveSecondApron = currentSalary > CBA.secondApron;

            // S&T signings specifically
            const satSignings = signings.filter(s => s.type === 'sat');
            const directSignings = signings.filter(s => s.type === 'direct');

            // ── Direct FA signings ─────────────────────────────────────────
            directSignings.forEach(s => {
                const annualSalary = s.salary;
                const projPost = currentSalary + annualSalary;

                // Over cap: can only sign using exceptions (MLE, BAE, min, etc.)
                if (isAboveCap) {
                    // Non-Taxpayer MLE check
                    if (!isAboveFirstApron && annualSalary > CBA.nonTaxpayerMLE) {
                        violations.push({ type: 'error', msg: `${name}: Direct FA signing of ${s.name} at ${fmtM(annualSalary)}/yr exceeds the Non-Taxpayer MLE (${fmtM(CBA.nonTaxpayerMLE)}). Below First Apron teams may use Non-Taxpayer MLE.` });
                    } else if (isAboveFirstApron && !isAboveSecondApron && annualSalary > CBA.taxpayerMLE) {
                        violations.push({ type: 'error', msg: `${name}: Direct FA signing of ${s.name} at ${fmtM(annualSalary)}/yr exceeds the Taxpayer MLE (${fmtM(CBA.taxpayerMLE)}). First-Apron teams are limited to the Taxpayer MLE.` });
                    } else if (isAboveSecondApron && annualSalary > CBA.taxpayerMLE) {
                        violations.push({ type: 'error', msg: `${name}: Second Apron teams cannot use the Non-Taxpayer MLE. Direct signing of ${s.name} at ${fmtM(annualSalary)}/yr may only use TMLE (${fmtM(CBA.taxpayerMLE)}) or veteran/minimum contracts.` });
                    } else if (isAboveFirstApron && annualSalary <= CBA.taxpayerMLE) {
                        infos.push({ type: 'info', msg: `${name}: Signing ${s.name} using Taxpayer MLE (${fmtM(annualSalary)}/yr). Team will be hard-capped at the First Apron once TMLE is used.` });
                    } else if (!isAboveFirstApron && annualSalary <= CBA.nonTaxpayerMLE && annualSalary > CBA.taxpayerMLE) {
                        infos.push({ type: 'info', msg: `${name}: Signing ${s.name} using Non-Taxpayer MLE (${fmtM(annualSalary)}/yr). Team will be hard-capped at the First Apron.` });
                        t.usedNonTaxpayerMLE = true;
                    }
                    // Bi-Annual exception check (≤ $5M, only usable below tax line)
                    if (annualSalary <= CBA.biAnnual && currentSalary < CBA.luxuryTax) {
                        infos.push({ type: 'info', msg: `${name}: ${s.name} could be signed using the Bi-Annual Exception (${fmtM(CBA.biAnnual)} max) — only available below luxury tax line.` });
                    }
                } else {
                    // Under cap: can sign directly up to cap space
                    const capSpace = CBA.salaryCap - currentSalary;
                    if (annualSalary > capSpace) {
                        warnings.push({ type: 'warning', msg: `${name}: Signing ${s.name} at ${fmtM(annualSalary)}/yr exceeds available cap space (${fmtM(capSpace)}). Team would need to use an exception or clear additional space.` });
                    } else {
                        infos.push({ type: 'info', msg: `${name}: ${s.name} signed using cap space (${fmtM(annualSalary)}/yr). ${fmtM(capSpace - annualSalary)} cap space remaining after signing.` });
                    }
                }

                // Max years check (direct FA: max 4 yrs for Bird rights, 3 for non-Bird MLE/BAE)
                if (isAboveCap && s.years > 3) {
                    warnings.push({ type: 'warning', msg: `${name}: MLE/exception contracts are limited to 3 years max (${s.name} set to ${s.years}yr). Only Bird-rights signings allow 4+ years.` });
                }
                if (projPost > CBA.secondApron) {
                    warnings.push({ type: 'warning', msg: `${name}: After signing ${s.name}, projected payroll (${fmtM(projPost)}) would exceed the Second Apron. Severe roster restrictions apply.` });
                }
            });

            // ── Sign-and-Trade signings ────────────────────────────────────
            satSignings.forEach(s => {
                const annualSalary = s.salary;

                // First Apron teams CANNOT acquire players via S&T
                if (isAboveFirstApron) {
                    violations.push({ type: 'error', msg: `${name}: Cannot acquire ${s.name} via Sign-and-Trade — First Apron (and above) teams are prohibited from making S&T acquisitions (CBA Art. VII Sec. 5(c)).` });
                    return;
                }
                t.usedSignAndTrade = true;

                // S&T cap: max 3 yrs for the receiving team if it would put them in tax
                const projPost = currentSalary + annualSalary + t.receivingSalary - t.sendingSalary;
                if (projPost > CBA.luxuryTax && s.years > 3) {
                    warnings.push({ type: 'warning', msg: `${name}: Acquiring ${s.name} via S&T into luxury tax territory — max contract is 3 years in this scenario.` });
                }

                // The SENDING team (the team trading the player out) must be identified
                // The player being S&T'd must have Bird rights with the sending team
                const sendingTeam = tradeSummary.find(other =>
                    other.id !== t.id &&
                    other.selectedPlayers.length > 0
                );
                if (!sendingTeam) {
                    warnings.push({ type: 'warning', msg: `${name}: S&T of ${s.name} requires an identified sending team — ensure the team trading this player has him selected in the trade.` });
                }

                // S&T: the outgoing team (player's old team) must be above cap (otherwise just direct signing)
                if (sendingTeam && sendingTeam.currentSalary <= CBA.salaryCap) {
                    infos.push({ type: 'info', msg: `Note: ${sendingTeam.abbr} appears to be under the cap — ${s.name} may not require an S&T mechanism. Consider a direct FA signing instead.` });
                }

                // Max contract length in S&T: 4 years
                if (s.years > 4) {
                    violations.push({ type: 'error', msg: `${name}: Sign-and-Trade contracts are capped at 4 years (${s.name} set to ${s.years}yr).` });
                }

            });  // end FA/S&T checks

        });  // end tradeSummary.forEach FA/S&T

        // ── Hard-cap consistency (combines trade + FA/S&T moves in this analysis) ──
        // Once a team uses the Expanded Trade Exception (>100% match), Non-Taxpayer MLE, Bi-Annual
        // Exception, or acquires via Sign-and-Trade, it is hard-capped at the First Apron for the
        // rest of the season. This only checks the moves entered in THIS analysis together — it
        // can't see other transactions made earlier in the season.
        tradeSummary.forEach(t => {
            if (!t.abbr || !t.data) return;
            const name = t.teamInfo ? t.teamInfo.name : t.abbr;
            const triggers = [];
            if (t.usedExpandedMatching) triggers.push('using the Expanded Trade Exception (matching more than 100% of outgoing salary)');
            if (t.usedNonTaxpayerMLE) triggers.push('using the Non-Taxpayer MLE');
            if (t.usedSignAndTrade) triggers.push('acquiring a player via Sign-and-Trade');
            if (triggers.length === 0) return;

            const faTotal = (t.faSignings || []).reduce((s, f) => s + f.salary, 0);
            const finalProjected = (t.postSalary || 0) + faTotal;
            const triggerStr = triggers.join(' and ');
            if (finalProjected > CBA.firstApron) {
                violations.push({ type: 'error', msg: `${name}: ${triggerStr} hard-caps this team at the First Apron (${fmtM(CBA.firstApron)}) for the rest of the season, but the combined post-trade/post-signing payroll ($${fmtFull(finalProjected)}) already exceeds it.` });
            } else {
                infos.push({ type: 'info', msg: `${name}: ${triggerStr} hard-caps this team at the First Apron (${fmtM(CBA.firstApron)}) for the rest of the season — total salary cannot exceed that line in any later move.` });
            }
        });

        // ── Minimum player count check (Art. II — 8 active-roster minimum) ────
        tradeSummary.forEach(t => {
            if (!t.abbr || !t.data) return;
            const name = t.teamInfo ? t.teamInfo.name : t.abbr;
            const postCount = t.data.players.length - t.selectedPlayers.length + (t.incomingCount || 0);
            if (postCount < 8) {
                violations.push({ type: 'error', msg: `${name}: This trade would leave the team with only ${postCount} players on its roster — teams must carry at least 8 active players.` });
            }
        });

        // Compile all messages
        const allMessages = [...violations, ...warnings, ...infos];
        const hasErrors = violations.length > 0;
        const hasWarnings = warnings.length > 0;

        const isValid = !hasErrors;
        const teamAbbrList = tradeSummary.filter(t => t.abbr).map(t => t.abbr).join(' ↔ ');
        const title = teamAbbrList ? teamAbbrList : (isValid ? 'Trade Appears Valid' : 'Trade Has Violations');
        const sub = isValid
            ? `${hasWarnings ? '⚠ Review warnings before finalizing.' : '✓ No CBA violations detected — trade can proceed.'}`
            : `${violations.length} violation${violations.length > 1 ? 's' : ''} found — trade cannot proceed as structured.`;

        showResult(isValid, title, sub, allMessages, tradeSummary);
    }



    // ════════════════════════════════════════════════════════════════════════
    // ─── FEATURE: SALARY-MATCHING HELPERS (shared) ──────────────────────────
    // ════════════════════════════════════════════════════════════════════════
    function legalIncomingMax(outgoing, postSalaryEstimate) {
        // Mirrors analyzeTrade matching rules: apron teams get a flat 100% match (no buffer,
        // no 110% — that was a 2023-24 transition-year rule only), everyone else uses the
        // three-band standard formula (200%+250k / flat +7.5M / 125%+250k).
        if (outgoing <= 0) return 0;
        const aboveFirstApron = postSalaryEstimate > CBA.firstApron;
        return aboveFirstApron ? apronMatchMax(outgoing) : standardMatchMax(outgoing);
    }
    function legalIncomingMin(incoming, currentSalary) {
        if (currentSalary <= CBA.salaryCap) return 0; // under cap, no minimum
        if (currentSalary > CBA.firstApron) return apronMatchMin(incoming); // 100% match, no buffer
        return standardMatchMin(incoming);
    }

    // ════════════════════════════════════════════════════════════════════════
    // ─── FEATURE 5: FIND FILLER ─────────────────────────────────────────────
    // ════════════════════════════════════════════════════════════════════════
    function findFiller(teamId) {
        const tA = teams.find(x => x.id === teamId);
        if (!tA || !tA.abbr) return;
        const dataA = TEAM_DATA[tA.abbr];
        if (!dataA) return;
        const outgoingA = tA.selectedPlayers.reduce((s, pid) => {
            const p = dataA.players.find(p => p.id === pid);
            return s + (p ? p.salary : 0);
        }, 0);
        if (outgoingA <= 0) return;

        // Counter-team: pick OTHER teams with an abbr
        const others = teams.filter(x => x.id !== teamId && x.abbr && TEAM_DATA[x.abbr]);
        if (others.length === 0) {
            openFiller('Add a Counter-Team', tA.teamInfo?.name || tA.abbr,
                outgoingA, 0,
                `<div class="filler-empty">Add another team (with a roster selected) to the trade so we can suggest matching salary from their players.</div>`);
            return;
        }

        // Default to first other team; if multiple, allow user to pick via a tab UI later — keep simple
        let body = '';
        others.forEach((tB, idx) => {
            const dataB = TEAM_DATA[tB.abbr];
            const currentB = dataB.teamSalary || 0;
            const currentA = dataA.teamSalary || 0;
            const aboveCapA = currentA > CBA.salaryCap;
            const aboveCapB = currentB > CBA.salaryCap;
            // For team A receiving X: max X
            const maxIncomingA = aboveCapA ? legalIncomingMax(outgoingA, currentA) : Infinity;
            // For team B sending X (=outgoingA), B must satisfy its own incoming match for outgoingA
            // i.e., A is sending outgoingA -> B receives outgoingA. B's outgoing must allow incoming outgoingA.
            const minOutgoingB = aboveCapB ? legalIncomingMin(outgoingA, currentB) : 0;
            const maxOutgoingB = aboveCapB ? legalIncomingMax(outgoingA, currentB) : Infinity; // not strictly needed but symmetric

            // Available players in B's roster (not already selected)
            const availB = dataB.players.filter(p => !tB.selectedPlayers.includes(p.id) && p.salary > 0);

            // Generate single-player + 2-player combos within window
            const candidates = [];
            availB.forEach(p1 => {
                if (p1.salary >= minOutgoingB && p1.salary <= maxIncomingA) {
                    candidates.push({ players: [p1], total: p1.salary });
                }
            });
            availB.forEach((p1, i) => {
                for (let j = i+1; j < availB.length; j++) {
                    const p2 = availB[j];
                    const tot = p1.salary + p2.salary;
                    if (tot >= minOutgoingB && tot <= maxIncomingA) {
                        candidates.push({ players: [p1, p2], total: tot });
                    }
                }
            });

            // Sort by closeness to outgoingA, dedupe similar totals
            candidates.sort((a,b) => Math.abs(a.total - outgoingA) - Math.abs(b.total - outgoingA));
            const top = candidates.slice(0, 8);

            const teamColor = tB.teamInfo?.color || '#4a4a5a';
            body += `<div style="margin-bottom:1.25rem;">
                <div class="filler-meta">
                    <div class="filler-meta-card"><div class="filler-meta-label">${tA.abbr} Sending</div><div class="filler-meta-val">${fmtM(outgoingA)}</div></div>
                    <div class="filler-meta-card"><div class="filler-meta-label">${tA.abbr} Max Incoming</div><div class="filler-meta-val">${aboveCapA ? fmtM(maxIncomingA) : 'No Limit'}</div></div>
                    <div class="filler-meta-card"><div class="filler-meta-label">${tB.abbr} Min Outgoing</div><div class="filler-meta-val">${aboveCapB ? fmtM(minOutgoingB) : '—'}</div></div>
                </div>
                <div class="filler-section-label">Suggestions from ${tB.teamInfo?.name || tB.abbr}</div>`;

            if (top.length === 0) {
                body += `<div class="filler-empty">No legal single or pair combinations found in ${tB.abbr}'s available roster. Try removing players from ${tA.abbr}'s outgoing list, or look at a different counter-team.</div>`;
            } else {
                top.forEach(c => {
                    const names = c.players.map(p => `${p.name} (${fmtM(p.salary)})`).join(' + ');
                    const diff = c.total - outgoingA;
                    const diffStr = diff === 0 ? 'Exact match' : (diff > 0 ? `+${fmtM(diff)} vs outgoing` : `${fmtM(diff)} vs outgoing`);
                    const pillCls = Math.abs(diff) < 1_000_000 ? '' : 'warn';
                    const ids = c.players.map(p => p.id);
                    body += `<div class="filler-suggestion">
                        <div class="filler-suggestion-info">
                            <div class="filler-suggestion-names">${names}</div>
                            <div class="filler-suggestion-meta">
                                <span><strong>${fmtM(c.total)}</strong> total</span>
                                <span class="pill ${pillCls}">${diffStr}</span>
                            </div>
                        </div>
                        <button class="filler-suggestion-apply" onclick='applyFiller(${tB.id}, ${JSON.stringify(ids)});closeFillerModal();'>Add to ${tB.abbr}</button>
                    </div>`;
                });
            }
            body += `</div>`;
        });

        openFiller('Find Salary Filler',
            `${tA.teamInfo?.name || tA.abbr} is sending ${fmtM(outgoingA)} — suggestions to make the math legal`,
            outgoingA, others.length, body);
    }

    function openFiller(title, sub, outgoingA, otherCount, html) {
        document.getElementById('fillerTitle').textContent = title;
        document.getElementById('fillerSub').textContent = sub;
        document.getElementById('fillerBody').innerHTML = html;
        document.getElementById('fillerModal').classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closeFillerModal() {
        document.getElementById('fillerModal').classList.remove('open');
        document.body.style.overflow = '';
    }
    function applyFiller(teamId, playerIds) {
        const t = teams.find(x => x.id === teamId);
        if (!t) return;
        playerIds.forEach(pid => {
            if (!t.selectedPlayers.includes(pid)) t.selectedPlayers.push(pid);
        });
        renderTeamCard(teamId);
        updateStats();
    }

    // ════════════════════════════════════════════════════════════════════════
    // ─── FEATURE 6: APRON CONSEQUENCES (Why Blocked?) ───────────────────────
    // ════════════════════════════════════════════════════════════════════════
    function showApronWhy(teamId) {
        const t = teams.find(x => x.id === teamId);
        if (!t || !t.abbr) return;
        const data = TEAM_DATA[t.abbr];
        const teamInfo = NBA_TEAMS[t.abbr];
        const sal = data ? (data.teamSalary || 0) : 0;
        const sendingSalary = (t.selectedPlayers || []).reduce((sum, pid) => {
            const p = data?.players.find(p => p.id === pid);
            return sum + (p ? p.salary : 0);
        }, 0);
        // Routed the same way as analyzeTrade: pooled sum for 2-team trades, per-destination for 3+.
        const { flows } = computeTradeFlows();
        const receivingSalary = flows[teamId] ? flows[teamId].receivingSalary : 0;
        const matchableReceivingSalary = flows[teamId] ? flows[teamId].matchableReceivingSalary : 0;
        const post = sal - sendingSalary + receivingSalary;
        const html = buildConsequenceHtml(t, teamInfo, sal, post, sendingSalary, matchableReceivingSalary, /*standalone*/true);
        openFiller(`Why this trade is restricted`,
            `${teamInfo?.name || t.abbr} — plain-English CBA breakdown`, 0, 0,
            html);
    }

    function buildConsequenceHtml(t, teamInfo, currentSalary, postSalary, sendingSalary, receivingSalary, standalone) {
        const aboveCap = currentSalary > CBA.salaryCap;
        const aboveTax = currentSalary > CBA.luxuryTax;
        const aboveFirst = currentSalary > CBA.firstApron;
        const aboveSecond = currentSalary > CBA.secondApron;
        const postAboveFirst = postSalary > CBA.firstApron;
        const postAboveSecond = postSalary > CBA.secondApron;

        const tier =
            aboveSecond ? { label: 'Above 2nd Apron', cls: 'danger', tierCls: '' } :
            aboveFirst  ? { label: 'Above 1st Apron', cls: 'warn',   tierCls: 'warn' } :
            aboveTax    ? { label: 'In Luxury Tax',   cls: 'warn',   tierCls: 'warn' } :
                          { label: 'Under Tax',       cls: '',       tierCls: '' };

        const items = [];
        const cba = (label, sec) => `<a class="consequence-cba-link" href="https://nbpa.com/cba/" target="_blank" rel="noopener" title="See CBA ${sec}">${sec}</a>`;

        if (aboveSecond) {
            items.push({ kind: 'block', txt: `Cannot aggregate two or more players' salaries in a single trade. Must match each outgoing salary one-for-one. ${cba('CBA','Art. VII §2(e)')}` });
            items.push({ kind: 'block', txt: `Cannot use the Non-Taxpayer Mid-Level Exception ($13.2M) — only the Taxpayer MLE ($5.7M), minimums, or veteran exceptions. ${cba('CBA','Art. VII §6(e)')}` });
            items.push({ kind: 'block', txt: `Cannot send or receive cash in any trade — strictly player-for-player + picks. ${cba('CBA','Art. VII §3(c)')}` });
            items.push({ kind: 'block', txt: `Cannot use any Traded Player Exception (TPE) generated in a prior trade. ${cba('CBA','Art. VII §6(g)')}` });
            items.push({ kind: 'block', txt: `Cannot trade a 1st-round pick more than 6 years out (frozen pick rule). ${cba('CBA','Art. VII §8')}` });
            items.push({ kind: 'block', txt: `Hard-capped at the Second Apron — payroll cannot exceed $${(CBA.secondApron/1e6).toFixed(1)}M for the rest of the season once any restricted move is made. ${cba('CBA','Art. VII §12')}` });
        } else if (aboveFirst) {
            items.push({ kind: 'block', txt: `Cannot acquire any player via Sign-and-Trade — only direct trade or free-agent signing. ${cba('CBA','Art. VII §5(c)')}` });
            items.push({ kind: 'block', txt: `Salary-matching limited to a flat 100% of outgoing, with no $250k buffer (vs. up to 200%+ for teams below the First Apron). ${cba('CBA','Art. VII §6(j)')}` });
            items.push({ kind: 'block', txt: `Cannot sign a buyout player whose previous salary exceeded the Taxpayer MLE ($5.7M). ${cba('CBA','Art. XXVII §5')}` });
            items.push({ kind: 'block', txt: `Cannot use the Bi-Annual Exception or the Non-Taxpayer MLE — only the Taxpayer MLE for free agents. ${cba('CBA','Art. VII §6(d)')}` });
        } else if (aboveTax) {
            items.push({ kind: 'warn', txt: `Will pay luxury tax on every dollar above $${(CBA.luxuryTax/1e6).toFixed(1)}M, with escalating brackets and a repeater multiplier if applicable. ${cba('CBA','Art. VII §11')}` });
            items.push({ kind: 'warn', txt: `Cannot use the Non-Taxpayer MLE — must use Taxpayer MLE ($5.7M) or risk hard-cap at the 1st Apron. ${cba('CBA','Art. VII §6(e)')}` });
        } else if (aboveCap) {
            items.push({ kind: 'ok', txt: `Over the cap but below the tax — full toolkit available: Non-Taxpayer MLE ($13.2M), Bi-Annual Exception, full salary-matching up to ~200%+. ${cba('CBA','Art. VII §6')}` });
        } else {
            items.push({ kind: 'ok', txt: `Under the cap with $${((CBA.salaryCap - currentSalary)/1e6).toFixed(1)}M of cap space — can sign free agents directly without using exceptions, but loses use of Bird/MLE rights. ${cba('CBA','Art. VII §3')}` });
        }

        // Trade-specific commentary
        if (sendingSalary > 0 && receivingSalary > 0 && aboveCap) {
            const maxIn = legalIncomingMax(sendingSalary, currentSalary);
            const overshoot = receivingSalary - maxIn;
            if (overshoot > 0) {
                items.unshift({ kind: 'block', txt: `<strong>This trade fails matching:</strong> taking in ${fmtM(receivingSalary)} but the legal max for ${fmtM(sendingSalary)} outgoing is ${fmtM(maxIn)} (over by ${fmtM(overshoot)}). Send out more salary or receive less.` });
            } else {
                items.unshift({ kind: 'ok', txt: `<strong>Salary matching: legal.</strong> Outgoing ${fmtM(sendingSalary)} → max incoming ${fmtM(maxIn)}; this deal takes in ${fmtM(receivingSalary)}.` });
            }
        }
        if (postAboveSecond && !aboveSecond) {
            items.push({ kind: 'warn', txt: `<strong>This deal would push the team above the 2nd Apron</strong> — once over, all 2nd-Apron restrictions kick in for the rest of the season.` });
        } else if (postAboveFirst && !aboveFirst) {
            items.push({ kind: 'warn', txt: `<strong>This deal would push the team above the 1st Apron</strong> — losing access to S&T, Non-Taxpayer MLE, and full salary-match rights.` });
        }

        const cardCls = aboveSecond ? 'danger' : (aboveFirst || aboveTax) ? 'warn' : '';
        const teamLabel = teamInfo ? teamInfo.name : t.abbr;
        const dotColor = teamInfo?.color || '#4a4a5a';

        return `<div class="consequence-card ${cardCls}">
            <div class="consequence-card-head">
                <div class="consequence-card-team"><span class="dot" style="background:${dotColor}"></span>${teamLabel}</div>
                <span class="consequence-card-tier ${tier.tierCls}">${tier.label}</span>
            </div>
            <div style="font-family:'Lexend',sans-serif;font-size:.72rem;color:var(--mid);margin-bottom:.55rem;">
                Current payroll: <strong style="color:var(--ink)">${fmtM(currentSalary)}</strong> · Projected post-trade: <strong style="color:var(--ink)">${postSalary > 0 ? fmtM(postSalary) : '—'}</strong>
            </div>
            <div class="consequence-list">
                ${items.map(it => {
                    const cls = it.kind === 'block' ? '' : it.kind === 'warn' ? 'warn' : 'ok';
                    const icon = it.kind === 'block' ? '✕' : it.kind === 'warn' ? '!' : '✓';
                    return `<div class="consequence-item ${cls}"><span class="consequence-item-icon">${icon}</span><span>${it.txt}</span></div>`;
                }).join('')}
            </div>
        </div>`;
    }

    // ════════════════════════════════════════════════════════════════════════
    // ─── FEATURE 7: 3-YEAR CAP OUTLOOK ─────────────────────────────────────
    // ════════════════════════════════════════════════════════════════════════
    // Projected league cap thresholds (CBA-projected ~10% growth)
    const CAP_PROJ = [
        { yr: '2026-27', cap: 165.0e6, tax: 201.0e6, ap1: 209.0e6, ap2: 222.0e6 },
        { yr: '2027-28', cap: 181.5e6, tax: 221.1e6, ap1: 229.9e6, ap2: 244.2e6 },
        { yr: '2028-29', cap: 199.7e6, tax: 243.2e6, ap1: 252.9e6, ap2: 268.6e6 },
    ];

    function projectPayroll(team, postTradePayrollY1) {
        // Take post-trade roster: original players minus selectedPlayers, plus incoming (we don't track which incoming exactly,
        // so we approximate Y2 / Y3 based on a salary-decay model on the team's CURRENT roster minus departing players + new FA signings).
        const data = TEAM_DATA[team.abbr];
        if (!data) return [postTradePayrollY1, postTradePayrollY1, postTradePayrollY1];
        const departing = new Set(team.selectedPlayers);
        const stayingPlayers = data.players.filter(p => !departing.has(p.id));
        // Simple decay: Guaranteed -> +5% raise (rolls); else drops next year
        const y2Roll = stayingPlayers.reduce((s, p) => {
            return s + ((p.contractType === 'Guaranteed' || p.contractType === 'Supermax') ? p.salary * 1.05 : 0);
        }, 0);
        const y3Roll = stayingPlayers.reduce((s, p) => {
            return s + ((p.contractType === 'Guaranteed' || p.contractType === 'Supermax') ? p.salary * 1.10 : 0);
        }, 0);
        // Incoming approx: assume same incomingSalary rolls forward at 5% for Y2 and 10% for Y3
        const incomingY1 = postTradePayrollY1 - (data.teamSalary || 0) + (data.players.filter(p=>departing.has(p.id)).reduce((s,p)=>s+p.salary,0));
        // FA signings for this team
        const faY1 = (team.faSignings || []).reduce((s,f)=>s+f.salary,0);
        const faY2 = (team.faSignings || []).reduce((s,f)=>s + (f.years >= 2 ? f.salary * 1.05 : 0), 0);
        const faY3 = (team.faSignings || []).reduce((s,f)=>s + (f.years >= 3 ? f.salary * 1.10 : 0), 0);

        const y1 = postTradePayrollY1;
        const y2 = y2Roll + incomingY1 * 1.05 + faY2;
        const y3 = y3Roll + incomingY1 * 1.10 + faY3;
        return [y1, y2, y3];
    }

    function showCapOutlook(teamId) {
        const t = teams.find(x => x.id === teamId);
        if (!t || !t.abbr) return;
        const data = TEAM_DATA[t.abbr];
        const sal = data ? (data.teamSalary || 0) : 0;
        const sendingSalary = t.selectedPlayers.reduce((s, pid) => {
            const p = data?.players.find(p => p.id === pid);
            return s + (p ? p.salary : 0);
        }, 0);
        const { flows } = computeTradeFlows();
        const receivingSalary = flows[teamId] ? flows[teamId].receivingSalary : 0;
        const postY1 = sal - sendingSalary + receivingSalary + (t.faSignings || []).reduce((s,f)=>s+f.salary,0);
        const projection = projectPayroll(t, postY1);

        const teamInfo = NBA_TEAMS[t.abbr];
        const html = `<div class="outlook-card" style="margin-bottom:0;">
            <div class="outlook-head">
                <span style="width:10px;height:10px;border-radius:50%;background:${teamInfo?.color||'#4a4a5a'};"></span>
                <span class="outlook-head-name">${teamInfo?.name || t.abbr} — 3-Year Outlook</span>
            </div>
            ${buildOutlookSvg(projection)}
            <div class="outlook-legend">
                <span><span class="swatch" style="background:#0a1538;height:8px;width:14px;border-radius:2px;"></span>Projected payroll</span>
                <span><span class="swatch" style="background:var(--green)"></span>Salary cap</span>
                <span><span class="swatch" style="background:var(--yellow)"></span>Luxury tax</span>
                <span><span class="swatch" style="background:var(--orange)"></span>1st apron</span>
                <span><span class="swatch" style="background:var(--red)"></span>2nd apron</span>
            </div>
            <div class="outlook-disclaimer">Y2-Y3 are estimates: guaranteed contracts roll forward with a 5%/10% raise; non-guaranteed and team-option deals are assumed to expire. Cap thresholds use the league's projected 10%/yr growth.</div>
        </div>`;

        openFiller('3-Year Cap Outlook',
            `${teamInfo?.name || t.abbr} — projected payroll vs. CBA thresholds`, 0, 0, html);
    }

    function buildOutlookSvg(projection) {
        // Determine y-scale: max of (highest threshold, highest payroll) * 1.08
        const maxVal = Math.max(
            ...CAP_PROJ.map(p => p.ap2),
            ...projection
        ) * 1.08;
        const W = 600, H = 200, padL = 56, padR = 16, padT = 12, padB = 30;
        const innerW = W - padL - padR, innerH = H - padT - padB;
        const yPx = (v) => padT + innerH - (v / maxVal) * innerH;
        const xCenter = (i) => padL + innerW * (i + 0.5) / CAP_PROJ.length;
        const barW = (innerW / CAP_PROJ.length) * 0.5;

        // Threshold lines (drawn across all years using each year's value -> line per threshold across the chart)
        function thresholdLine(key, color, label) {
            // segmented across years
            let pts = '';
            CAP_PROJ.forEach((cy, i) => {
                const x = xCenter(i);
                const y = yPx(cy[key]);
                pts += `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)} `;
            });
            return `<path d="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="4 3" opacity=".75"/>`;
        }

        // Bars
        let bars = '';
        projection.forEach((v, i) => {
            const x = xCenter(i) - barW/2;
            const y = yPx(v);
            const h = (padT + innerH) - y;
            const fill = v > CAP_PROJ[i].ap2 ? '#dc2626' :
                         v > CAP_PROJ[i].ap1 ? '#ea580c' :
                         v > CAP_PROJ[i].tax ? '#ca8a04' :
                         v > CAP_PROJ[i].cap ? '#16a34a' : '#0a1538';
            bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(2,h).toFixed(1)}" rx="3" fill="${fill}"/>
                     <text x="${xCenter(i).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-family="Lexend,sans-serif" font-weight="900" font-size="11" fill="#0d0f1a">${fmtM(v)}</text>`;
        });

        // X labels
        let xLabels = '';
        CAP_PROJ.forEach((cy, i) => {
            xLabels += `<text x="${xCenter(i).toFixed(1)}" y="${(H-10).toFixed(1)}" text-anchor="middle" font-family="Lexend,sans-serif" font-weight="700" font-size="10" fill="#64748b" letter-spacing=".08em">${cy.yr}</text>`;
        });

        // Y axis ticks
        const ticks = 4;
        let yTicks = '';
        for (let k = 0; k <= ticks; k++) {
            const v = (maxVal / ticks) * k;
            const y = yPx(v);
            yTicks += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>
                       <text x="${(padL-6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-family="Lexend,sans-serif" font-size="9" fill="#9ca3af">$${(v/1e6).toFixed(0)}M</text>`;
        }

        return `<div class="outlook-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
            ${yTicks}
            ${thresholdLine('cap', '#16a34a')}
            ${thresholdLine('tax', '#ca8a04')}
            ${thresholdLine('ap1', '#ea580c')}
            ${thresholdLine('ap2', '#dc2626')}
            ${bars}
            ${xLabels}
        </svg></div>`;
    }

    // ESC closes filler modal
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            const m = document.getElementById('fillerModal');
            if (m && m.classList.contains('open')) closeFillerModal();
        }
    });

    function showResult(isValid, title, sub, messages, tradeSummary) {
        // ── Populate modal ───────────────────────────────────────────────
        const modal      = document.getElementById('tradeModal');
        const header     = document.getElementById('modalHeader');
        const badge      = document.getElementById('modalBadge');
        const titleEl    = document.getElementById('modalTitle');
        const subEl      = document.getElementById('modalSub');
        const violList   = document.getElementById('modalViolations');
        const breakdown  = document.getElementById('modalBreakdown');
        const restrictions = document.getElementById('modalRestrictions');

        header.className = 'modal-header ' + (isValid ? 'valid' : 'invalid');
        badge.className  = 'modal-badge '  + (isValid ? 'valid' : 'invalid');
        badge.textContent = isValid ? 'Valid' : 'Invalid';
        titleEl.textContent = title;
        subEl.textContent   = sub;

        // Messages
        violList.innerHTML = messages.map(m => `
            <div class="violation-item ${m.type}">
                <span style="font-family:'Lexend',sans-serif;font-weight:800;font-size:.75rem;flex-shrink:0">${
                    m.type === 'error'   ? 'Err'  :
                    m.type === 'warning' ? 'Warn' :
                    m.type === 'ok'      ? 'OK'   : 'Info'
                }</span>
                <span>${m.msg}</span>
            </div>
        `).join('');

        // Swap hero (player-swap graphic at top of modal)
        const swapHero = document.getElementById('modalSwapHero');
        if (swapHero) swapHero.innerHTML = buildSwapHero(isValid, tradeSummary);

        // Team breakdown
        buildBreakdown(breakdown, restrictions, tradeSummary);

        // Open modal
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';

        // Also update the inline result panel (hidden but kept for share canvas)
        const panel    = document.getElementById('resultPanel');
        const rHeader  = document.getElementById('resultHeader');
        const rBadge   = document.getElementById('resultBadge');
        const rTitle   = document.getElementById('resultTitle');
        const rSub     = document.getElementById('resultSub');
        const rViol    = document.getElementById('violationsList');
        const rBreak   = document.getElementById('breakdownGrid');
        const rRestr   = document.getElementById('restrictionSection');

        panel.classList.add('visible');
        rHeader.className = 'result-header ' + (isValid ? 'valid' : 'invalid');
        rBadge.className  = 'result-badge '  + (isValid ? 'valid' : 'invalid');
        rBadge.textContent = isValid ? 'Valid' : 'Invalid';
        rTitle.textContent = title;
        rSub.textContent   = sub;
        rViol.innerHTML    = violList.innerHTML;
        buildBreakdown(rBreak, rRestr, tradeSummary);
    }

    // ─── SWAP HERO ─ Player-swap graphic shown atop the trade-result modal ──
    function buildSwapHero(isValid, tradeSummary) {
        if (!Array.isArray(tradeSummary)) return '';
        const active = tradeSummary.filter(t =>
            t.abbr && (t.selectedPlayers.length > 0 || t.selectedPicks.length > 0 || (t.faSignings||[]).length > 0)
        );
        const stamp = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        if (active.length === 0) {
            return `<div class="swap-hero">
                <div class="swap-hero-status ${isValid?'valid':'invalid'}">
                    <span class="swap-hero-status-icon">${isValid?'✓':'✕'}</span>
                    <span class="swap-hero-status-text">${isValid ? 'Trade Cleared' : 'Trade Rejected'}</span>
                    <span class="swap-hero-status-meta">Transaction Wire · ${stamp}</span>
                </div>
                <div style="padding:1.6rem 1.25rem;"><div class="swap-empty" style="text-align:center;">No assets selected — pick players or picks to generate a transaction.</div></div>
            </div>`;
        }

        function assetRow(tag, name, meta, value, kind) {
            return `<div class="swap-asset ${kind}">
                <div class="swap-asset-tag">${tag}</div>
                <div class="swap-asset-body">
                    <div class="swap-asset-name">${name}</div>
                    <div class="swap-asset-meta">${meta}</div>
                </div>
                <div class="swap-asset-value${value === '—' ? ' muted' : ''}">${value}</div>
            </div>`;
        }

        let totalAssets = 0;
        let totalSalaryMoving = 0;

        const teamCols = active.map((t, idx) => {
            const color = (t.teamInfo && t.teamInfo.color) || '#4a4a5a';
            const rows = [];

            active.forEach(other => {
                if (other.id === t.id) return;
                (other.selectedPlayers || []).forEach(pid => {
                    const p = (other.data && other.data.players || []).find(pp => pp.id === pid);
                    if (p) {
                        rows.push(assetRow('PLR', p.name,
                            `${p.position} · <span class="swap-from">FROM ${other.abbr}</span>`,
                            fmtM(p.salary), 'player'));
                        totalAssets++; totalSalaryMoving += p.salary;
                    }
                });
                (other.selectedPicks || []).forEach(pkid => {
                    const pk = (other.data && other.data.picks || []).find(pp => pp.id === pkid);
                    if (pk) {
                        rows.push(assetRow('PCK', pk.name,
                            `${pk.protections || 'Draft Pick'} · <span class="swap-from">FROM ${other.abbr}</span>`,
                            '—', 'pick'));
                        totalAssets++;
                    }
                });
            });

            (t.faSignings || []).forEach(s => {
                const tag = s.type === 'sat' ? 'S&T' : 'FA';
                rows.push(assetRow(tag, s.name,
                    `${s.position || 'Free Agent'} · <span class="swap-from">${s.years || ''}YR · ${s.type === 'sat' ? 'Sign & Trade' : 'Direct'}</span>`,
                    `${fmtM(s.salary)}/Y`, 'fa'));
                totalAssets++; totalSalaryMoving += s.salary;
            });

            const logoFallback = `this.outerHTML='<span class=\\'swap-team-logo\\' style=\\'background:${color};border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-family:Lexend,sans-serif;font-weight:900;color:#fff;font-size:.62rem;\\'>${t.abbr}</span>'`;

            const num = String(idx + 1).padStart(2, '0');
            return `<div class="swap-team" style="--team-color:${color};">
                <div class="swap-team-rail"></div>
                <div class="swap-team-header">
                    <div class="swap-team-index">${num}</div>
                    <div class="swap-team-headline">
                        <div class="swap-team-receives-label">Receives</div>
                        <div class="swap-team-namebar">
                            <img class="swap-team-logo" src="${teamLogoUrl(t.abbr)}" alt="${t.abbr}" onerror="${logoFallback}">
                            <div class="swap-team-name">${(t.teamInfo && t.teamInfo.name) || t.abbr}</div>
                        </div>
                    </div>
                </div>
                ${rows.length ? `<div class="swap-asset-list">${rows.join('')}</div>` : '<div class="swap-empty">Nothing incoming.</div>'}
            </div>`;
        });

        const colTemplate = `repeat(${active.length}, 1fr)`;
        const grid = `<div class="swap-grid" style="grid-template-columns:${colTemplate};">${teamCols.join('')}</div>`;

        const totals = `<div class="swap-totals">
            <div class="swap-total">
                <div class="swap-total-label">Teams</div>
                <div class="swap-total-value">${String(active.length).padStart(2,'0')}</div>
            </div>
            <div class="swap-total">
                <div class="swap-total-label">Assets Moving</div>
                <div class="swap-total-value">${String(totalAssets).padStart(2,'0')}</div>
            </div>
            <div class="swap-total">
                <div class="swap-total-label">Salary In Motion</div>
                <div class="swap-total-value">${fmtM(totalSalaryMoving)}</div>
            </div>
        </div>`;

        return `<div class="swap-hero">
            <div class="swap-hero-status ${isValid?'valid':'invalid'}">
                <span class="swap-hero-status-icon">${isValid?'✓':'✕'}</span>
                <span class="swap-hero-status-text">${isValid ? 'Trade Cleared' : 'Trade Rejected'}</span>
                <span class="swap-hero-status-meta">Transaction Wire · ${stamp}</span>
            </div>
            ${grid}
            ${totals}
        </div>`;
    }

    function buildBreakdown(breakdownEl, restrictionsEl, tradeSummary) {
        if (!Array.isArray(tradeSummary)) return;
        breakdownEl.innerHTML = tradeSummary.filter(t => t.abbr).map(t => {
            const postSalary = t.currentSalary - t.sendingSalary + t.receivingSalary;
            const apronStatus = getApronStatus(postSalary);
            const salDiff = t.receivingSalary - t.sendingSalary;
            const color = t.teamInfo ? t.teamInfo.color : '#4a4a5a';
            const name  = t.teamInfo ? t.teamInfo.name  : t.abbr;

            // ── Distance rows ──
            function distRow(label, threshold, salary) {
                const dist = threshold - salary;
                const over = dist < 0;
                const cls  = over ? 'negative' : 'positive';
                const sign = over ? '+' : '-';
                return `<div class="breakdown-row">
                    <span class="breakdown-row-label">${label}</span>
                    <span class="breakdown-row-val ${cls}" style="font-size:.75rem;">${over ? 'OVER by ' : 'Under by '}${fmtM(Math.abs(dist))}</span>
                </div>`;
            }

            return `<div class="breakdown-card">
                <div class="breakdown-card-header">
                    <div class="breakdown-dot" style="background:${color}"></div>
                    ${name}
                </div>
                <div class="breakdown-body">
                    <div class="breakdown-row"><span class="breakdown-row-label">Sending out</span><span class="breakdown-row-val">${t.sendingSalary > 0 ? fmtM(t.sendingSalary) : '—'}</span></div>
                    <div class="breakdown-row"><span class="breakdown-row-label">Taking in</span><span class="breakdown-row-val">${t.receivingSalary > 0 ? fmtM(t.receivingSalary) : '—'}</span></div>
                    <div class="breakdown-row"><span class="breakdown-row-label">Net change</span><span class="breakdown-row-val ${salDiff > 0 ? 'negative' : salDiff < 0 ? 'positive' : ''}">${salDiff >= 0 ? '+' : ''}${fmtM(salDiff)}</span></div>
                    <div class="breakdown-divider"></div>
                    <div class="breakdown-row"><span class="breakdown-row-label">Pre-trade payroll</span><span class="breakdown-row-val">${t.currentSalary > 0 ? fmtM(t.currentSalary) : '—'}</span></div>
                    <div class="breakdown-row"><span class="breakdown-row-label">Post-trade payroll</span><span class="breakdown-row-val ${postSalary > CBA.secondApron ? 'negative' : postSalary > CBA.firstApron ? 'warning' : ''}">${postSalary > 0 ? fmtM(postSalary) : '—'}</span></div>
                    <div class="breakdown-divider"></div>
                    <div style="font-family:'Lexend',sans-serif;font-size:.58rem;font-weight:800;letter-spacing:.14em;color:var(--mid);margin-bottom:.4rem;">Distance from Thresholds</div>
                    ${distRow('Salary Cap ($165M)', CBA.salaryCap, postSalary)}
                    ${distRow('Luxury Tax ($201.0M)', CBA.luxuryTax, postSalary)}
                    ${distRow('1st Apron ($209.0M)', CBA.firstApron, postSalary)}
                    ${distRow('2nd Apron ($222.0M)', CBA.secondApron, postSalary)}
                    <div class="breakdown-divider"></div>
                    <div class="breakdown-row"><span class="breakdown-row-label">Players sent</span><span class="breakdown-row-val">${t.selectedPlayers.length}</span></div>
                    <div class="breakdown-row"><span class="breakdown-row-label">Picks sent</span><span class="breakdown-row-val">${t.selectedPicks.length}</span></div>
                    ${t.selectedTPEs.length > 0 ? `<div class="breakdown-row"><span class="breakdown-row-label">TPEs used</span><span class="breakdown-row-val">${t.selectedTPEs.length}</span></div>` : ''}
                    ${(t.faSignings||[]).length > 0 ? `<div class="breakdown-row"><span class="breakdown-row-label">FA signings</span><span class="breakdown-row-val">${(t.faSignings||[]).filter(s=>s.type==='direct').length} direct${(t.faSignings||[]).filter(s=>s.type==='sat').length > 0 ? ', '+(t.faSignings||[]).filter(s=>s.type==='sat').length+' S&T' : ''}</span></div>` : ''}
                    <div style="margin-top:.5rem;"><span class="apron-pill ${apronStatus.cls}">${apronStatus.label}</span></div>
                </div>
            </div>`;
        }).join('');

        const anyFirstApron  = tradeSummary.some(t => t.abbr && t.data && t.currentSalary > CBA.firstApron);
        const anySecondApron = tradeSummary.some(t => t.abbr && t.data && t.currentSalary > CBA.secondApron);
        if (anyFirstApron || anySecondApron) {
            const items = [
                { cond: anyFirstApron,  label: 'No sign-and-trade acquisitions',          type: 'blocked' },
                { cond: anyFirstApron,  label: 'Salary matching limited to 100% (no buffer)', type: 'blocked' },
                { cond: anyFirstApron,  label: 'Cannot sign waived players above TMLE',   type: 'blocked' },
                { cond: anySecondApron, label: 'No non-taxpayer mid-level exception',      type: 'blocked' },
                { cond: anySecondApron, label: 'Cannot aggregate salaries in trades',     type: 'blocked' },
                { cond: anySecondApron, label: 'No cash in trades',                       type: 'blocked' },
                { cond: anySecondApron, label: 'Cannot use prior Traded Player Exceptions', type: 'blocked' },
                { cond: anySecondApron, label: 'Draft pick trade restrictions apply',     type: 'blocked' },
                { cond: anySecondApron, label: 'Hard cap at Second Apron level',          type: 'blocked' },
            ];
            restrictionsEl.innerHTML = `
                <div class="section-label" style="margin-top:1.5rem;">Active Apron Restrictions</div>
                <div class="restrictions-grid">
                    ${items.filter(i => i.cond).map(i => `<div class="restriction-item ${i.type}"><span class="restriction-icon">—</span><span>${i.label}</span></div>`).join('')}
                </div>`;
        } else {
            restrictionsEl.innerHTML = '';
        }

        // ── Apron Consequences (plain English, per team) ──
        const activeTeams = tradeSummary.filter(t => t.abbr && t.data);
        if (activeTeams.length > 0) {
            const conseqHtml = activeTeams.map(t => {
                const post = t.currentSalary - t.sendingSalary + (t.receivingSalary || 0);
                return buildConsequenceHtml(t, t.teamInfo, t.currentSalary, post, t.sendingSalary, t.matchableReceivingSalary || 0, false);
            }).join('');
            restrictionsEl.innerHTML += `
                <div class="consequences-section">
                    <div class="section-label">Why this works (or doesn't) — plain English</div>
                    ${conseqHtml}
                </div>`;

            // ── 3-Year Cap Outlook ──
            const outlookHtml = activeTeams.map(t => {
                const post = t.currentSalary - t.sendingSalary + (t.receivingSalary || 0) + (t.faSignings || []).reduce((s,f)=>s+f.salary,0);
                const proj = projectPayroll(t, post);
                return `<div class="outlook-card">
                    <div class="outlook-head">
                        <span style="width:10px;height:10px;border-radius:50%;background:${t.teamInfo?.color || '#4a4a5a'};"></span>
                        <span class="outlook-head-name">${t.teamInfo?.name || t.abbr}</span>
                    </div>
                    ${buildOutlookSvg(proj)}
                </div>`;
            }).join('');
            restrictionsEl.innerHTML += `
                <div class="outlook-section">
                    <div class="section-label">3-Year Cap Outlook</div>
                    <div class="outlook-grid">${outlookHtml}</div>
                    <div class="outlook-disclaimer">Y2-Y3 are estimates: guaranteed contracts roll forward (5%/10% raises); non-guaranteed and team-option deals are assumed to expire. Cap thresholds use the league's projected 10%/yr growth.</div>
                </div>`;
        }
    }

    let _lastTradeCanvas = null; // store last generated canvas for copy/download

    function shareGraphic() {
        const isValid = document.getElementById('modalBadge').classList.contains('valid');
        const activeTeams = teams.filter(t => t.abbr && TEAM_DATA[t.abbr] && (t.selectedPlayers.length > 0 || t.selectedPicks.length > 0));
