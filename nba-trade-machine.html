    // State: which FA is selected in each team's search
    const faSearchState = {}; // teamId -> { query, selectedFa }

    function faSearch(teamId, showAll) {
        const query = document.getElementById(`fa-search-${teamId}`)?.value?.toLowerCase() || '';
        const results = document.getElementById(`fa-results-${teamId}`);
        if (!results) return;
        const matches = query
            ? FA_PLAYERS.filter(p => p.name.toLowerCase().includes(query))
            : FA_PLAYERS;
        if (!matches.length) { results.style.display = 'none'; return; }
        results.innerHTML = matches.map(p => `
            <div class="fa-result-item" onclick="selectFA(${teamId}, '${p.name.replace(/'/g,"\\'")}', '${p.position}', ${p.salary})">
                <span class="fa-result-name">${p.name}</span>
                <span class="fa-result-pos">${p.position}</span>
            </div>`).join('');
        results.style.display = 'block';
    }

    function faSearchFocus(teamId) {
        faSearch(teamId, true);
    }

    function faSearchBlur(teamId) {
        // Delay so onclick on result fires first
        setTimeout(() => {
            const results = document.getElementById(`fa-results-${teamId}`);
            if (results) results.style.display = 'none';
        }, 180);
    }

    function selectFA(teamId, name, position, defaultSalary) {
        if (!faSearchState[teamId]) faSearchState[teamId] = {};
        faSearchState[teamId].selectedFa = { name, position, salary: defaultSalary };
        const searchEl = document.getElementById(`fa-search-${teamId}`);
        const results  = document.getElementById(`fa-results-${teamId}`);
        const chip     = document.getElementById(`fa-selected-chip-${teamId}`);
        const slider   = document.getElementById(`fa-salary-${teamId}`);
        const salLabel = document.getElementById(`fa-sal-label-${teamId}`);
        if (searchEl) searchEl.value = '';
        if (results)  results.style.display = 'none';
        if (chip) {
            chip.textContent = `${name} · ${position}`;
            chip.style.display = 'inline-flex';
        }
        if (slider) {
            slider.value = defaultSalary;
            if (salLabel) salLabel.textContent = fmtM(defaultSalary) + '/yr';
        }
    }

    function clearFASelection(teamId) {
        if (faSearchState[teamId]) faSearchState[teamId].selectedFa = null;
        const chip = document.getElementById(`fa-selected-chip-${teamId}`);
        if (chip) chip.style.display = 'none';
    }

    function updateSalLabel(teamId) {
        const slider = document.getElementById(`fa-salary-${teamId}`);
        const label  = document.getElementById(`fa-sal-label-${teamId}`);
        if (!slider) return;
        if (label) label.textContent = fmtM(parseInt(slider.value)) + '/yr';
        const pct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
        slider.style.background = 'var(--border-light)';
    }

    function addFASigning(teamId) {
        const t = teams.find(t => t.id === teamId);
        if (!t) return;
        const state    = faSearchState[teamId] || {};
        const selected = state.selectedFa;
        if (!selected) { alert('Search and select a player first.'); return; }
        const salary = parseInt(document.getElementById(`fa-salary-${teamId}`)?.value || '0');
        const type   = document.getElementById(`fa-type-${teamId}`)?.value || 'direct';
        const years  = parseInt(document.getElementById(`fa-years-${teamId}`)?.value || '3');
        if (!salary || salary < 1) { alert('Set a valid salary.'); return; }
        if (!t.faSignings) t.faSignings = [];
        t.faSignings.push({ id: 'fa-' + (nextFAId++), name: selected.name, position: selected.position, salary, type, years });
        faSearchState[teamId] = {};
        updateStats();
        renderTeamCard(teamId);
    }

    function removeFASigning(teamId, faId) {
        const t = teams.find(t => t.id === teamId);
        if (!t || !t.faSignings) return;
        t.faSignings = t.faSignings.filter(s => s.id !== faId);
        updateStats();
        renderTeamCard(teamId);
    }

    // ─── RENDER ALL ─────────────────────────────────────────────────────────
    function renderAll() {
        if (typeof closeAllDropdowns === 'function') closeAllDropdowns();
        const grid = document.getElementById('tradeGrid');
        // Remove cards for teams that no longer exist
        const existingIds = new Set(teams.map(t => t.id));
        grid.querySelectorAll('.team-card').forEach(el => {
            const id = parseInt(el.dataset.teamId);
            if (!existingIds.has(id)) el.remove();
        });
        // Render each team
        teams.forEach(t => {
            let card = grid.querySelector(`[data-team-id="${t.id}"]`);
            if (!card) {
                card = document.createElement('div');
                card.className = 'team-card';
                card.dataset.teamId = t.id;
                grid.appendChild(card);
            }
            card.innerHTML = buildTeamCard(t);
        });
        updateStats();
        document.getElementById('addTeamBtn').disabled = teams.length >= 5;
        ['teamCountLabel','totalTeams'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent = teams.length; });
    }

    function renderTeamCard(teamId) {
        const t = teams.find(t => t.id === teamId);
        if (!t) return;
        const card = document.querySelector(`[data-team-id="${teamId}"]`);
        if (card) card.innerHTML = buildTeamCard(t);
    }

    // ─── BUILD TEAM CARD HTML ────────────────────────────────────────────────
    function buildTeamCard(t) {
        const teamInfo = t.abbr ? NBA_TEAMS[t.abbr] : null;
        const color = teamInfo ? teamInfo.color : '#4a4a5a';
        const data = t.abbr && TEAM_DATA[t.abbr] ? TEAM_DATA[t.abbr] : null;

        const sendingSalary = t.selectedPlayers.reduce((sum, pid) => {
            if (!data) return sum;
            const p = data.players.find(p => p.id === pid);
            return sum + (p ? p.salary : 0);
        }, 0);

        // In a 3+ team trade, salary routing is ambiguous without an explicit destination per
        // player, so show a "Send to" picker on each selected player when this applies.
        const teamsWithPlayersNow = teams.filter(x => x.abbr && TEAM_DATA[x.abbr] && x.selectedPlayers.length > 0);
        const isMultiTeamTrade = teamsWithPlayersNow.length > 2;
        const otherTeamsForDest = teams.filter(x => x.id !== t.id && x.abbr);

        // Tab bar
        const rosterCount = t.selectedPlayers.length;
        const picksCount = t.selectedPicks.length;
        const tpeCount = t.selectedTPEs.length;

        let tabBar = `<div class="team-tabs">`;
        const faCount = (t.faSignings || []).length;

        const tabs = ['roster','picks','tpe','fa'];
        const tabLabels = { roster: 'Roster', picks: 'Picks', tpe: 'TPEs', fa: 'FA / S&T' };
        const tabCounts = { roster: rosterCount, picks: picksCount, tpe: tpeCount, fa: faCount };
        tabs.forEach(tab => {
            const active = t.activeTab === tab ? 'active' : '';
            const cnt = tabCounts[tab];
            tabBar += `<button class="team-tab ${active}" onclick="setTab(${t.id},'${tab}')">${tabLabels[tab]}${cnt > 0 ? `<span class="selected-badge">${cnt}</span>` : ''}</button>`;
        });
        tabBar += `</div>`;

        // Panel content
        let panels = '';

        // ROSTER panel
        const rosterActive = t.activeTab === 'roster' ? 'active' : '';
        let rosterContent = '';
        if (!t.abbr) {
            rosterContent = `<div class="empty-state"><div class="empty-state-icon"></div><div class="empty-state-text">Select a team to view roster</div></div>`;
        } else if (!data || !data.players || data.players.length === 0) {
            rosterContent = `<div class="empty-state"><div class="empty-state-icon"></div><div class="empty-state-text">No roster data loaded yet.<br>Import team data to populate.</div></div>`;
        } else {
            rosterContent = `<div class="player-list">`;
            data.players.forEach(p => {
                const sel = t.selectedPlayers.includes(p.id) ? 'selected' : '';
                const contractBadgeColor = p.contractType === 'Guaranteed' ? '#16a34a' :
                    p.contractType === 'Non-Guaranteed' ? '#dc2626' :
                    p.contractType === 'Team Option' ? '#2563eb' :
                    p.contractType === 'Player Option' ? '#7c3aed' :
                    p.contractType === 'Estimated' ? '#ea580c' : '#6b7280';

                const destPicker = (sel && isMultiTeamTrade) ? `
                    <select onclick="event.stopPropagation()" onchange="setPlayerDestination(${t.id}, '${p.id}', this.value)"
                        style="font-family:'Lexend',sans-serif;font-size:.58rem;font-weight:700;border-radius:4px;padding:2px 3px;border:1px solid #cbd5e1;background:${destVal ? '#ecfdf5' : '#fef3c7'};color:#334155;max-width:70px;">
                        <option value="" ${!destVal ? 'selected' : ''}>Send to…</option>
                        ${otherTeamsForDest.map(ot => `<option value="${ot.id}" ${destVal == ot.id ? 'selected' : ''}>${ot.abbr}</option>`).join('')}
                    </select>` : '';
                rosterContent += `<div class="player-item ${sel}" onclick="togglePlayer(${t.id},'${p.id}')">
                    ${playerHeadshotHtml(p.name, t.abbr)}
                    <div class="player-checkbox"><svg class="player-checkbox-check" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>

                        <div style="display:flex;align-items:center;gap:.4rem;">

                            <span style="font-family:'Lexend',sans-serif;font-size:.6rem;font-weight:600;color:${contractBadgeColor};background:${contractBadgeColor}18;border-radius:3px;padding:1px 5px;">${p.contractType || ''}</span>

        panels += `<div class="team-tab-panel ${rosterActive}">${rosterContent}</div>`;

        // PICKS panel
        const picksActive = t.activeTab === 'picks' ? 'active' : '';

            picksContent = `<div class="empty-state"><div class="empty-state-icon"></div><div class="empty-state-text">Select a team to view picks</div></div>`;

        // TPE panel
        const tpeActive = t.activeTab === 'tpe' ? 'active' : '';

            tpeContent = `<div class="empty-state"><div class="empty-state-icon"></div><div class="empty-state-text">Select a team to view TPEs</div></div>`;
