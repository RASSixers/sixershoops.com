<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Trade Machine — Sixers Hoops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navbar-styles.css">
    <style>
        :root {
            --navy: #001a57;
            --navy-deep: #0b0f1a;
            --sixers-blue: #006BB6;
            --sixers-red: #ED174C;
            --cream: #ffffff;
            --ink: #0d0f1a;
            --mid: #64748b;
            --border-light: #e4e8f0;
            --card-bg: #ffffff;
            --green: #16a34a;
            --red: #dc2626;
            --orange: #ea580c;
            --yellow: #ca8a04;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body, html {
            font-family: 'Lexend', sans-serif;
            margin: 0;
            background: var(--cream);
            color: var(--ink);
        }

        body { padding-top: 64px; }

        /* ─── PAGE HERO — matches salary.html ─── */
        .page-hero {
            background: var(--cream);
            position: relative;
            overflow: hidden;
            padding: 0;
        }

        .hero-inner {
            position: relative;
            z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            padding: 5rem 2rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero-title-top,
        .hero-title-bottom {
            font-family: 'Lexend', sans-serif;
            font-size: clamp(2.4rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: .95;
            letter-spacing: -.03em;
            margin: 0;
        }

        .hero-title-top { color: var(--ink); }
        .hero-title-bottom { color: var(--sixers-blue); }

        .hero-sub {
            font-family: 'Lexend', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            color: var(--mid);
            max-width: 420px;
            line-height: 1.65;
            margin: 1.4rem auto 0;
        }

        /* ─── MAIN LAYOUT ─────────────────────── */
        .tm-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ─── SECTION LABEL ──────────────────── */
        .section-label {
            font-family: 'Lexend', sans-serif;
            font-weight: 800; font-size: .65rem; letter-spacing: .18em; color: var(--mid);
            display: flex; align-items: center; gap: .6rem;
            margin-bottom: 1rem;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

        /* ─── BOARD (unified surface containing cap bar + teams) ─── */
        .tm-board {
            position: relative;
            background: #ffffff;
            border: 1px solid #e6eaf2;
            border-radius: 14px;
            padding: 1.25rem 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 28px -18px rgba(15,23,42,.18);
            overflow: hidden;
        }
        .tm-board::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--sixers-blue);
        }

        /* ─── CBA INFO BAR (flat inside board) ─── */
        .cba-bar {
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            padding: .5rem .25rem 1rem;
            margin: 0 0 1.25rem;
            display: flex; flex-wrap: wrap; gap: .5rem 2.25rem;
            align-items: center;
            border-bottom: 1px solid #eef1f6;
        }
        .cba-bar-title {
            font-family: 'Lexend', sans-serif;
            font-size: .8rem; font-weight: 800;
            letter-spacing: .18em;
            color: #1f2a44; flex-shrink: 0; margin-right: 1rem;
        }
        .cba-stat { display: flex; flex-direction: column; gap: 3px; }
        .cba-stat-val {
            font-family: 'Lexend', sans-serif;
            font-size: 1.1rem; font-weight: 900;
            letter-spacing: .01em; color: #0d1530;
            line-height: 1;
        }
        .cba-stat-key {
            font-family: 'Lexend', sans-serif;
            font-size: .62rem; font-weight: 600;
            color: #8693a8; letter-spacing: .14em;
        }
        .cba-divider { width: 1px; height: 28px; background: #e6eaf2; flex-shrink: 0; }

        /* ─── CONTROLS ────────────────────────── */
        .tm-controls {
            display: flex; align-items: center; gap: .75rem;
            margin-bottom: 1.5rem; flex-wrap: wrap;
        }
        .btn-primary {
            display: inline-flex; align-items: center; gap: .45rem;
            background: var(--sixers-blue); color: white;
            font-family: 'Lexend', sans-serif; font-weight: 700;
            font-size: .82rem; letter-spacing: .1em;
            padding: .6rem 1.3rem; border-radius: 8px; border: none; cursor: pointer;
            transition: all .2s;
        }
        .btn-primary:hover { background: #0080d4; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,107,182,.3); }
        .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-ghost {
            display: inline-flex; align-items: center; gap: .45rem;
            background: white; color: var(--mid);
            font-family: 'Lexend', sans-serif; font-weight: 700;
            font-size: .82rem; letter-spacing: .1em;
            padding: .6rem 1.3rem; border-radius: 8px;
            border: 1px solid var(--border-light); cursor: pointer; transition: all .2s;
        }
        .btn-ghost:hover { border-color: var(--sixers-blue); color: var(--sixers-blue); }
        .btn-danger {
            display: inline-flex; align-items: center; gap: .45rem;
            background: white; color: var(--sixers-red);
            font-family: 'Lexend', sans-serif; font-weight: 700;
            font-size: .82rem; letter-spacing: .1em;
            padding: .6rem 1.3rem; border-radius: 8px;
            border: 1px solid rgba(237,23,76,.2); cursor: pointer; transition: all .2s;
        }
        .btn-danger:hover { background: rgba(237,23,76,.06); border-color: var(--sixers-red); }
        .btn-analyze {
            display: inline-flex; align-items: center; gap: .6rem;
            background: linear-gradient(135deg, var(--sixers-blue), #0080d4);
            color: white; font-family: 'Lexend', sans-serif; font-weight: 800;
            font-size: 1rem; letter-spacing: .12em;
            padding: .9rem 2.4rem; border-radius: 10px; border: none; cursor: pointer;
            transition: all .25s; box-shadow: 0 6px 24px rgba(0,107,182,.3);
        }
        .btn-analyze:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(0,107,182,.45); }

        /* ─── TRADE GRID ──────────────────────── */
        .trade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        /* ─── TEAM CARD ───────────────────────── */
        .team-card {
            background: white;
            border: 1px solid #e6eaf2;
            border-radius: 12px;
            overflow: visible;
            transition: box-shadow .2s, border-color .22s, transform .22s;
            position: relative;
            box-shadow: 0 1px 2px rgba(15,23,42,.03);
        }
        .team-card::after { content: none; }
        .team-card:hover {
            box-shadow: 0 8px 26px -14px rgba(0,107,182,.25);
            border-color: #d6dde9;
        }

        /* ─── TEAM CARD HEADER — CUSTOM DROPDOWN ─────────────────── */
        .team-card-header {
            background: var(--navy-deep);
            display: flex; align-items: stretch;
            position: relative;
            min-height: 58px;
            cursor: pointer;
            user-select: none;
            border-radius: 11px 11px 0 0;
        }
        .team-card-header:hover .team-header-inner { background: rgba(255,255,255,.03); }

        .team-color-bar { display: none; }

        .team-header-inner {
            flex: 1;
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .65rem .85rem .65rem .75rem;
            min-width: 0;
            transition: background .15s;
        }

        .team-header-text { flex: 1; min-width: 0; }

        .team-header-label {
            font-family: 'Lexend', sans-serif;
            font-size: .52rem;
            font-weight: 800;
            letter-spacing: .2em;
            color: rgba(255,255,255,.28);
            line-height: 1;
            margin-bottom: 3px;
        }

        .team-header-name {
            font-family: 'Lexend', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: .03em;
            color: white;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .team-header-name.placeholder {
            color: rgba(255,255,255,.3);
            font-weight: 600;
            font-size: .88rem;
            font-style: italic;
        }

        .team-header-chevron {
            color: rgba(255,255,255,.25);
            flex-shrink: 0;
            transition: transform .2s, color .15s;
        }
        .team-card-header.open .team-header-chevron { transform: rotate(180deg); color: rgba(255,255,255,.5); }

        /* ── Custom dropdown panel ── */
        .team-dropdown {
            position: absolute;
            top: 100%;
            left: 0; right: 0;
            z-index: 999;
            background: #0b1f4a;
            border: 1px solid rgba(0,107,182,.35);
            border-top: none;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 16px 48px rgba(0,0,0,.55);
            overflow: hidden;
            display: none;
            flex-direction: column;
            max-height: min(620px, calc(100vh - 200px));
        }
        .team-dropdown.open { display: flex; }

        .team-dropdown-search {
            padding: .55rem .75rem;
            border-bottom: 1px solid rgba(255,255,255,.07);
            flex-shrink: 0;
            position: relative;
        }
        .team-dropdown-search input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 6px;
            color: white;
            font-family: 'Lexend', sans-serif;
            font-size: .82rem;
            padding: .38rem .75rem .38rem 2rem;
            outline: none;
            transition: border-color .15s;
        }
        .team-dropdown-search input::placeholder { color: rgba(255,255,255,.3); }
        .team-dropdown-search input:focus { border-color: rgba(0,107,182,.6); background: rgba(255,255,255,.1); }
        .team-dropdown-search-icon {
            position: absolute;
            left: 1.2rem; top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,.28);
            pointer-events: none;
        }

        .team-dropdown-list {
            overflow-y: auto;
            flex: 1;
        }
        .team-dropdown-list::-webkit-scrollbar { width: 4px; }
        .team-dropdown-list::-webkit-scrollbar-track { background: transparent; }
        .team-dropdown-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }

        .team-dropdown-section {
            padding: .3rem 0 .1rem;
        }
        .team-dropdown-section-label {
            font-family: 'Lexend', sans-serif;
            font-size: .55rem;
            font-weight: 800;
            letter-spacing: .18em;
            color: rgba(255,255,255,.2);
            padding: .25rem .85rem .2rem;
        }

        .team-dropdown-option {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .45rem .85rem;
            cursor: pointer;
            transition: background .1s;
        }
        .team-dropdown-option:hover { background: rgba(0,107,182,.2); }
        .team-dropdown-option.selected { background: rgba(0,107,182,.15); }
        .team-dropdown-option.disabled { opacity: .3; pointer-events: none; }

        .team-dropdown-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .team-dropdown-option-name {
            font-family: 'Lexend', sans-serif;
            font-size: .88rem;
            font-weight: 700;
            letter-spacing: .04em;
            color: rgba(255,255,255,.88);
            flex: 1;
        }
        .team-dropdown-option-abbr {
            font-family: 'Lexend', sans-serif;
            font-size: .65rem;
            font-weight: 800;
            letter-spacing: .1em;
            color: rgba(255,255,255,.25);
        }

        .team-remove-btn {
            background: transparent;
            border: none;
            border-left: 1px solid rgba(255,255,255,.06);
            color: rgba(255,255,255,.22);
            cursor: pointer;
            padding: 0 .8rem;
            display: flex; align-items: center;
            transition: all .2s;
            flex-shrink: 0;
            align-self: stretch;
            z-index: 1000;
        }
        .team-remove-btn:hover { background: rgba(237,23,76,.14); color: rgba(237,23,76,.85); }

        /* Roster Tabs */
        .team-tabs {
            display: flex; border-bottom: 1px solid var(--border-light);
            background: #f8f9fc; overflow-x: auto;
        }
        .team-tab {
            font-family: 'Lexend', sans-serif; font-size: .7rem; font-weight: 800;
            letter-spacing: .12em; color: var(--mid);
            padding: .65rem 1rem; border: none; background: none; cursor: pointer;
            border-bottom: 2px solid transparent; transition: all .2s; white-space: nowrap;
            position: relative; top: 1px;
        }
        .team-tab.active { color: var(--sixers-blue); border-bottom-color: var(--sixers-blue); }
        .team-tab:hover:not(.active) { color: var(--ink); }

        /* Tab Panels */
        .team-tab-panel { display: none; }
        .team-tab-panel.active { display: block; }


        /* ─── PLAYER HEADSHOTS ─── */
        .player-headshot {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: #eef2f7 center/cover no-repeat;
            border: 1.5px solid var(--border-light);
            flex-shrink: 0;
            object-fit: cover;
            object-position: center 12%;
            display: block;
        }
        .player-headshot.fallback {
            display: flex; align-items: center; justify-content: center;
            font-family: 'Lexend', sans-serif;
            font-weight: 800; font-size: .68rem;
            color: #fff; letter-spacing: .04em;
        }

        /* Player List */
        .player-list { padding: .75rem; max-height: 340px; overflow-y: auto; }
        .player-list::-webkit-scrollbar { width: 4px; }
        .player-list::-webkit-scrollbar-track { background: transparent; }
        .player-list::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

        .player-item {
            display: flex; align-items: center; gap: .65rem;
            padding: .55rem .7rem; border-radius: 8px; cursor: pointer;
            transition: background .15s; border: 1px solid transparent;
            margin-bottom: .3rem;
        }
        .player-item:hover { background: rgba(0,107,182,.04); border-color: rgba(0,107,182,.1); }
        .player-item.selected { background: rgba(0,107,182,.07); border-color: rgba(0,107,182,.2); }

        .player-checkbox {
            width: 16px; height: 16px; border-radius: 4px;
            border: 2px solid var(--border-light); background: white;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: all .15s;
        }
        .player-item.selected .player-checkbox {
            background: var(--sixers-blue); border-color: var(--sixers-blue);
        }
        .player-checkbox-check {
            display: none; color: white;
        }
        .player-item.selected .player-checkbox-check { display: block; }

        .player-info { flex: 1; min-width: 0; }
        .player-name { font-family: 'Lexend', sans-serif; font-size: .9rem; font-weight: 800; letter-spacing: .04em; color: var(--ink); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-details { font-family: 'Lexend', sans-serif; font-size: .68rem; color: var(--mid); margin-top: 1px; }
        .player-salary { font-family: 'Lexend', sans-serif; font-size: .88rem; font-weight: 700; color: var(--sixers-blue); flex-shrink: 0; }

        /* Picks List */
        .picks-list { padding: .75rem; }
        .pick-item {
            display: flex; align-items: center; gap: .65rem;
            padding: .55rem .7rem; border-radius: 8px; cursor: pointer;
            transition: background .15s; border: 1px solid transparent;
            margin-bottom: .3rem;
        }
        .pick-item:hover { background: rgba(0,107,182,.04); border-color: rgba(0,107,182,.1); }
        .pick-item.selected { background: rgba(0,107,182,.07); border-color: rgba(0,107,182,.2); }
        .pick-checkbox {
            width: 16px; height: 16px; border-radius: 4px;
            border: 2px solid var(--border-light); background: white;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: all .15s;
        }
        .pick-item.selected .pick-checkbox { background: var(--sixers-blue); border-color: var(--sixers-blue); }
        .pick-info { flex: 1; }
        .pick-name { font-family: 'Lexend', sans-serif; font-size: .88rem; font-weight: 800; letter-spacing: .04em; color: var(--ink); }
        .pick-detail { font-family: 'Lexend', sans-serif; font-size: .67rem; color: var(--mid); }

        /* TPE */
        .tpe-list { padding: .75rem; }
        .tpe-item {
            display: flex; align-items: center; gap: .65rem;
            padding: .55rem .7rem; border-radius: 8px; cursor: pointer;
            transition: background .15s; border: 1px solid transparent;
            margin-bottom: .3rem;
        }
        .tpe-item:hover { background: rgba(0,107,182,.04); border-color: rgba(0,107,182,.1); }
        .tpe-item.selected { background: rgba(0,107,182,.07); border-color: rgba(0,107,182,.2); }
        .tpe-checkbox {
            width: 16px; height: 16px; border-radius: 4px;
            border: 2px solid var(--border-light); background: white;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: all .15s;
        }
        .tpe-item.selected .tpe-checkbox { background: var(--sixers-blue); border-color: var(--sixers-blue); }
        .tpe-name { font-family: 'Lexend', sans-serif; font-size: .88rem; font-weight: 800; letter-spacing: .04em; color: var(--ink); }
        .tpe-detail { font-family: 'Lexend', sans-serif; font-size: .67rem; color: var(--mid); }

        /* Team salary footer */
        .team-card-footer {
            border-top: 1px solid var(--border-light);
            padding: .75rem 1.25rem;
            display: flex; justify-content: space-between; align-items: center;
            background: #fafaf8;
        }
        .footer-label { font-family: 'Lexend', sans-serif; font-size: .68rem; font-weight: 700; letter-spacing: .1em; color: var(--mid); }
        .footer-value { font-family: 'Lexend', sans-serif; font-size: .9rem; font-weight: 800; color: var(--ink); }
        .footer-sending { font-family: 'Lexend', sans-serif; font-size: .72rem; color: var(--sixers-blue); font-weight: 600; }

        /* Placeholder */
        .empty-state {
            padding: 2.5rem 1.5rem; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: .75rem;
        }
        .empty-state-icon { font-size: 2rem; opacity: .3; }
        .empty-state-text { font-family: 'Lexend', sans-serif; font-size: .82rem; color: var(--mid); }

        /* ─── ANALYZE BAR ────────────────────── */
        .analyze-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: white; border: 1px solid var(--border-light);
            border-radius: 12px; padding: 1rem 1.5rem; gap: 1rem; flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .analyze-bar-info { display: flex; gap: 2rem; flex-wrap: wrap; }
        .analyze-stat { display: flex; flex-direction: column; gap: 1px; }
        .analyze-stat-val { font-family: 'Lexend', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--ink); }
        .analyze-stat-key { font-family: 'Lexend', sans-serif; font-size: .65rem; font-weight: 600; color: var(--mid); letter-spacing: .08em; }

        /* ─── RESULT PANEL ───────────────────── */
        .result-panel {
            background: white; border: 1px solid var(--border-light);
            border-radius: 12px; overflow: hidden; margin-top: 1.5rem;
            display: none;
        }
        .result-panel.visible { display: block; }

        .result-header {
            padding: 1.25rem 1.5rem;
            display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
        }
        .result-header.valid { background: rgba(22,163,74,.07); border-bottom: 2px solid var(--green); }
        .result-header.invalid { background: rgba(220,38,38,.06); border-bottom: 2px solid var(--red); }
        .result-badge {
            display: inline-flex; align-items: center; gap: .4rem;
            font-family: 'Lexend', sans-serif; font-size: .75rem; font-weight: 800;
            letter-spacing: .12em;
            padding: .35rem .9rem; border-radius: 6px;
        }
        .result-badge.valid { background: rgba(22,163,74,.12); color: var(--green); }
        .result-badge.invalid { background: rgba(220,38,38,.1); color: var(--red); }
        .result-badge.warning { background: rgba(234,88,12,.1); color: var(--orange); }
        .result-title { font-family: 'Lexend', sans-serif; font-size: 1.1rem; font-weight: 900; letter-spacing: .03em; color: var(--ink); }
        .result-sub { font-family: 'Lexend', sans-serif; font-size: .82rem; color: var(--mid); }

        .result-body { padding: 1.5rem; }

        /* Violations list */
        .violations-list { display: flex; flex-direction: column; gap: .6rem; margin-bottom: 1.25rem; }
        .violation-item {
            display: flex; align-items: flex-start; gap: .6rem;
            padding: .7rem .9rem; border-radius: 8px;
            font-family: 'Lexend', sans-serif; font-size: .83rem; line-height: 1.5;
        }
        .violation-item.error { background: rgba(220,38,38,.06); border-left: 3px solid var(--red); color: #7f1d1d; }
        .violation-item.warning { background: rgba(234,88,12,.06); border-left: 3px solid var(--orange); color: #7c2d12; }
        .violation-item.info { background: rgba(0,107,182,.06); border-left: 3px solid var(--sixers-blue); color: var(--navy); }
        .violation-item.ok { background: rgba(22,163,74,.06); border-left: 3px solid var(--green); color: #14532d; }

        /* Team breakdown cards */
        .breakdown-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .85rem; margin-top: 1.25rem; }
        .breakdown-card {
            border: 1px solid var(--border-light); border-radius: 10px; overflow: hidden;
            background: white;
        }
        .breakdown-card-header {
            background: #f4f6fb; padding: .7rem 1rem;
            font-family: 'Lexend', sans-serif; font-size: .78rem; font-weight: 900; letter-spacing: .08em; color: var(--ink);
            display: flex; align-items: center; gap: .5rem;
            border-bottom: 1px solid var(--border-light);
        }
        .breakdown-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .breakdown-body { padding: .8rem 1rem; }
        .breakdown-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .35rem; font-size: .78rem; }
        .breakdown-row-label { color: var(--mid); font-family: 'Lexend', sans-serif; }
        .breakdown-row-val { font-family: 'Lexend', sans-serif; font-weight: 800; color: var(--ink); font-size: .82rem; }
        .breakdown-row-val.positive { color: #16a34a; }
        .breakdown-row-val.negative { color: #dc2626; }
        .breakdown-row-val.warning { color: #b45309; }
        .breakdown-divider { height: 1px; background: var(--border-light); margin: .55rem 0; }
        .apron-pill {
            display: inline-flex; align-items: center; gap: .3rem;
            font-family: 'Lexend', sans-serif; font-size: .6rem; font-weight: 800;
            letter-spacing: .1em;
            padding: .2rem .55rem; border-radius: 4px; margin-top: .4rem;
        }
        .apron-pill.under { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .apron-pill.tax { background: #fefce8; color: #a16207; border: 1px solid #fde68a; }
        .apron-pill.first { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
        .apron-pill.second { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

        /* Cash section */
        .cash-row {
            background: rgba(0,107,182,.04); border: 1px solid rgba(0,107,182,.12);
            border-radius: 8px; padding: .7rem 1rem; margin-top: .75rem;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
        }
        .cash-row-label { font-family: 'Lexend', sans-serif; font-size: .8rem; color: var(--mid); }
        .cash-input {
            font-family: 'Lexend', sans-serif; font-size: .9rem; font-weight: 700;
            color: var(--ink); border: 1px solid var(--border-light); border-radius: 6px;
            padding: .3rem .6rem; width: 110px; background: white;
        }
        .cash-input:focus { outline: none; border-color: var(--sixers-blue); }

        /* restrictions */
        .restrictions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .6rem; margin-top: .75rem; }
        .restriction-item {
            display: flex; align-items: flex-start; gap: .5rem;
            padding: .6rem .8rem; border-radius: 8px; font-size: .76rem;
            font-family: 'Lexend', sans-serif; line-height: 1.4;
        }
        .restriction-item.blocked { background: rgba(220,38,38,.06); color: #7f1d1d; }
        .restriction-item.allowed { background: rgba(22,163,74,.06); color: #14532d; }
        .restriction-icon { flex-shrink: 0; font-size: .85rem; margin-top: .05rem; }

        /* ─── RESPONSIVE ─────────────────────── */
        @media (max-width: 768px) {
            .trade-grid { grid-template-columns: 1fr; }
            .cba-bar { gap: .5rem 1rem; }
            .analyze-bar { flex-direction: column; align-items: flex-start; }
            .tm-wrapper { padding: 1rem 1rem 3rem; }
        }

        /* ─── SCROLLBAR ─────────────────────── */
        .player-list { scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }

        /* selected count badge */
        .selected-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--sixers-blue); color: white;
            font-family: 'Lexend', sans-serif; font-size: .65rem; font-weight: 700;
            margin-left: .3rem; vertical-align: middle;
        }
        /* ─── MODAL ──────────────────────────────── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
            align-items: center; justify-content: center; padding: 1rem;
        }
        .modal-overlay.open { display: flex; }

        .modal-box {
            background: white; border-radius: 16px; overflow: hidden;
            width: 100%; max-width: 780px; max-height: 88vh;
            display: flex; flex-direction: column;
            box-shadow: 0 32px 80px rgba(0,0,0,.35);
            animation: modalIn .22s cubic-bezier(.34,1.3,.64,1) both;
        }
        @keyframes modalIn { from { opacity:0; transform:scale(.94) translateY(16px); } to { opacity:1; transform:none; } }

        .modal-header {
            padding: 1.25rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            flex-shrink: 0;
        }
        .modal-header.valid { background: rgba(22,163,74,.07); border-bottom: 2px solid var(--green); }
        .modal-header.invalid { background: rgba(220,38,38,.06); border-bottom: 2px solid var(--red); }

        .modal-header-left { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .modal-badge {
            display: inline-flex; align-items: center; gap: .4rem;
            font-family: 'Lexend', sans-serif; font-size: .75rem; font-weight: 800;
            letter-spacing: .12em;
            padding: .35rem .9rem; border-radius: 6px; flex-shrink: 0;
        }
        .modal-badge.valid { background: rgba(22,163,74,.12); color: var(--green); }
        .modal-badge.invalid { background: rgba(220,38,38,.1); color: var(--red); }
        .modal-title { font-family: 'Lexend', sans-serif; font-size: 1.15rem; font-weight: 900; letter-spacing: .03em; color: var(--ink); }
        .modal-sub { font-family: 'Lexend', sans-serif; font-size: .82rem; color: var(--mid); margin-top: 2px; }

        .modal-close-btn {
            background: rgba(0,0,0,.06); border: none; border-radius: 8px;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--mid); flex-shrink: 0; transition: all .15s;
        }
        .modal-close-btn:hover { background: rgba(220,38,38,.1); color: var(--sixers-red); }

        .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }

        .modal-footer {
            padding: 1rem 1.5rem; border-top: 1px solid var(--border-light);
            display: flex; align-items: center; gap: .75rem; justify-content: flex-end;
            flex-shrink: 0; background: #f8f9fc;
        }

        .btn-share {
            display: inline-flex; align-items: center; gap: .45rem;
            background: var(--navy-deep); color: white;
            font-family: 'Lexend', sans-serif; font-weight: 700;
            font-size: .82rem; letter-spacing: .1em;
            padding: .6rem 1.3rem; border-radius: 8px; border: none; cursor: pointer;
            transition: all .2s;
        }
        .btn-share:hover { background: var(--navy); transform: translateY(-1px); }

        /* ─── FA / SIGN-AND-TRADE PANEL ──────────────────────────────── */
        .fa-panel { padding: .6rem; }
        .fa-info-bar {
            display: flex; align-items: flex-start; gap: .5rem;
            background: rgba(0,107,182,.07); border: 1px solid rgba(0,107,182,.15);
            border-radius: 8px; padding: .55rem .75rem;
            font-family: 'Lexend', sans-serif; font-size: .7rem; color: var(--mid);
            margin-bottom: .7rem; line-height: 1.4;
        }
        .fa-info-bar svg { flex-shrink: 0; margin-top: 1px; color: var(--sixers-blue); }
        .fa-add-form {
            display: flex; flex-direction: column; gap: .45rem;
            background: #f8f9fc; border: 1px solid var(--border-light);
            border-radius: 10px; padding: .7rem;
            margin-bottom: .6rem;
        }
        .fa-input {
            font-family: 'Lexend', sans-serif; font-size: .82rem;
            border: 1px solid var(--border-light); border-radius: 7px;
            padding: .4rem .7rem; width: 100%; box-sizing: border-box;
            color: var(--ink); background: white; outline: none;
            transition: border-color .15s;
        }
        .fa-input:focus { border-color: var(--sixers-blue); }
        .fa-input-sm { width: 72px; }
        .fa-type-row { display: flex; gap: .45rem; }
        .fa-select {
            font-family: 'Lexend', sans-serif; font-size: .78rem;
            border: 1px solid var(--border-light); border-radius: 7px;
            padding: .4rem .6rem; color: var(--ink); background: white;
            outline: none; cursor: pointer; flex: 1;
        }
        .fa-add-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
            background: var(--sixers-blue); color: white;
            font-family: 'Lexend', sans-serif; font-weight: 700;
            font-size: .78rem; letter-spacing: .1em;
            padding: .5rem 1rem; border-radius: 7px; border: none; cursor: pointer;
            transition: all .2s; margin-top: .1rem;
        }
        .fa-add-btn:hover { background: #0080d4; }
        .fa-signings-list { display: flex; flex-direction: column; gap: .35rem; }
        .fa-signing-item {
            display: flex; align-items: center; gap: .5rem;
            padding: .5rem .65rem; border-radius: 8px;
            border: 1px solid var(--border-light); background: white;
            transition: background .15s;
        }
        .fa-signing-item.sat {
            border-color: rgba(234,88,12,.2); background: rgba(234,88,12,.04);
        }
        .fa-signing-info { flex: 1; min-width: 0; }
        .fa-signing-name {
            font-family: 'Lexend', sans-serif; font-size: .88rem;
            font-weight: 800; letter-spacing: .04em;
            color: var(--ink); line-height: 1;
        }
        .fa-signing-pos {
            font-size: .72rem; font-weight: 600; color: var(--mid);
            letter-spacing: .08em;
        }
        .fa-signing-detail { font-size: .67rem; color: var(--mid); margin-top: 2px; }
        .fa-remove-btn {
            background: none; border: none; color: rgba(220,38,38,.5);
            cursor: pointer; font-size: .85rem; padding: .2rem .35rem;
            border-radius: 5px; transition: all .15s; flex-shrink: 0;
        }
        .fa-remove-btn:hover { background: rgba(220,38,38,.08); color: var(--red); }

        /* FA search results dropdown */
        .fa-result-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: .45rem .75rem; cursor: pointer; transition: background .1s;
            border-bottom: 1px solid var(--border-light);
        }
        .fa-result-item:last-child { border-bottom: none; }
        .fa-result-item:hover { background: rgba(0,107,182,.06); }
        .fa-result-name {
            font-family: 'Lexend', sans-serif; font-size: .88rem;
            font-weight: 700; letter-spacing: .03em; color: var(--ink);
        }
        .fa-result-pos {
            font-family: 'Lexend', sans-serif; font-size: .7rem;
            font-weight: 600; color: var(--mid); background: var(--border-light);
            border-radius: 4px; padding: 1px 6px;
        }

        /* Salary slider */
        .fa-slider {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 4px; border-radius: 2px;
            background: var(--border-light);
            outline: none; cursor: pointer;
        }
        .fa-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--sixers-blue); cursor: pointer;
            border: 2px solid white; box-shadow: 0 1px 4px rgba(0,107,182,.4);
            transition: transform .15s;
        }
        .fa-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .fa-slider::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--sixers-blue); cursor: pointer;
            border: 2px solid white; box-shadow: 0 1px 4px rgba(0,107,182,.4);
        }

        /* ─── Logo-grid team picker (modernized) ─── */
        .team-dropdown { max-height: min(640px, calc(100vh - 200px)); }
        .team-grid-picker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: .5rem;
            padding: .65rem .85rem 1rem;
        }
        .team-grid-section-label {
            grid-column: 1 / -1;
            display: flex; align-items: center; gap: .65rem;
            font-family: 'Lexend', sans-serif;
            font-size: .58rem; font-weight: 800;
            letter-spacing: .22em;
            color: rgba(255,255,255,.42);
            padding: .85rem .15rem .35rem;
        }
        .team-grid-section-label::after {
            content: '';
            flex: 1; height: 1px;
            background: rgba(255,255,255,.12);
        }
        .team-tile {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center;
            gap: .45rem;
            padding: .85rem .35rem .65rem;
            background: linear-gradient(160deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: transform .2s cubic-bezier(.2,.8,.2,1),
                        background .2s ease, border-color .2s ease, box-shadow .25s ease;
            overflow: hidden;
        }
        .team-tile::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(0,107,182,.28), transparent 70%);
            opacity: 0; transition: opacity .25s ease;
            pointer-events: none;
        }
        .team-tile:hover {
            border-color: rgba(0,140,230,.55);
            transform: translateY(-3px);
            box-shadow: 0 10px 28px -8px rgba(0,107,182,.55),
                        inset 0 1px 0 rgba(255,255,255,.08);
        }
        .team-tile:hover::before { opacity: 1; }
        .team-tile.selected {
            background: linear-gradient(160deg, rgba(0,107,182,.32), rgba(0,107,182,.10));
            border-color: var(--sixers-blue);
            box-shadow: 0 0 0 1px var(--sixers-blue),
                        0 8px 26px rgba(0,107,182,.5),
                        inset 0 1px 0 rgba(255,255,255,.12);
        }
        .team-tile.selected::before { opacity: 1; }
        .team-tile.disabled { opacity: .22; pointer-events: none; filter: grayscale(.85); }
        .team-tile-logo {
            width: 40px; height: 40px;
            object-fit: contain;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,.55));
            pointer-events: none;
            transition: transform .25s cubic-bezier(.2,.8,.2,1);
            position: relative; z-index: 1;
        }
        .team-tile:hover .team-tile-logo { transform: scale(1.08); }
        .team-tile-abbr {
            font-family: 'Lexend', sans-serif;
            font-size: .66rem; font-weight: 800;
            letter-spacing: .16em;
            color: rgba(255,255,255,.62);
            position: relative; z-index: 1;
            transition: color .2s ease;
        }
        .team-tile:hover .team-tile-abbr,
        .team-tile.selected .team-tile-abbr { color: #fff; }
        .team-grid-empty {
            grid-column: 1 / -1;
            text-align: center;
            font-family: 'Lexend', sans-serif;
            font-size: .8rem;
            color: rgba(255,255,255,.35);
            padding: 1.5rem .5rem;
        }

        /* ─── Trade-result swap hero (modernized) ─── */
        /* ============================================================
           TRADE LEDGER — modern monochrome "transaction wire" graphic
           Replaces the old gradient swap-hero with a sharp, editorial
           layout: stark off-black canvas, hairline rules, oversized
           team-color rails, big tabular numerals.
           ============================================================ */
        .swap-hero {
            position: relative;
            margin: 0 0 1.4rem;
            padding: 0;
            background: #0b0c10;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 4px;
            overflow: hidden;
            color: #f4f4f5;
            box-shadow: 0 24px 60px -28px rgba(0,0,0,.7);
        }
        /* Top verdict bar: square, full-bleed, monochrome with one accent edge */
        .swap-hero-status {
            position: relative;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1rem;
            padding: .9rem 1.25rem;
            background: #07080b;
            border-bottom: 1px solid rgba(255,255,255,.08);
            font-family: 'Lexend', sans-serif;
            letter-spacing: .22em;
            font-weight: 900;
            font-size: .9rem;
        }
        .swap-hero-status::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 4px;
        }
        .swap-hero-status.valid::before   { background: #22c55e; }
        .swap-hero-status.invalid::before { background: #ef4444; }
        .swap-hero-status-icon {
            width: 28px; height: 28px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: .95rem; font-weight: 900;
            color: #07080b;
            border-radius: 2px;
            font-family: 'Lexend', sans-serif;
        }
        .swap-hero-status.valid   .swap-hero-status-icon { background: #22c55e; }
        .swap-hero-status.invalid .swap-hero-status-icon { background: #ef4444; }
        .swap-hero-status-text { color: #fff; }
        .swap-hero-status-meta {
            font-size: .7rem;
            color: rgba(255,255,255,.5);
            letter-spacing: .28em;
            font-weight: 700;
        }

        /* Grid: each team is a column, hairline rules between */
        .swap-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0;
        }
        .swap-team {
            position: relative;
            padding: 1.4rem 1.25rem 1.3rem;
            display: flex; flex-direction: column;
            min-width: 0;
            background: #0b0c10;
        }
        .swap-team + .swap-team {
            border-left: 1px solid rgba(255,255,255,.08);
        }
        /* Team color rail at top of column */
        .swap-team-rail {
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--team-color, #4a4a5a);
        }
        .swap-team-header {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: .85rem;
            padding-bottom: .9rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }
        .swap-team-index {
            font-family: 'Lexend', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            line-height: 1;
            color: rgba(255,255,255,.18);
            font-variant-numeric: tabular-nums;
            letter-spacing: -.02em;
        }
        .swap-team-headline { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
        .swap-team-receives-label {
            font-family: 'Lexend', sans-serif;
            font-size: .6rem; font-weight: 800;
            letter-spacing: .32em;
            color: rgba(255,255,255,.4);
        }
        .swap-team-namebar {
            display: flex; align-items: center; gap: .6rem;
            min-width: 0;
        }
        .swap-team-logo {
            width: 26px; height: 26px; object-fit: contain;
            flex-shrink: 0;
        }
        .swap-team-name {
            font-family: 'Lexend', sans-serif;
            font-size: 1.25rem; font-weight: 900;
            letter-spacing: .03em;
            color: #fff;
            line-height: 1.05;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Asset rows — clean tabular records, no chip backgrounds */
        .swap-asset-list {
            display: flex; flex-direction: column;
        }
        .swap-asset {
            display: grid;
            grid-template-columns: 22px 1fr auto;
            align-items: center;
            gap: .85rem;
            padding: .65rem 0;
            border-bottom: 1px dashed rgba(255,255,255,.06);
        }
        .swap-asset:last-child { border-bottom: none; }
        .swap-asset-tag {
            font-family: 'Lexend', sans-serif;
            font-weight: 900;
            font-size: .58rem;
            letter-spacing: .14em;
            color: rgba(255,255,255,.55);
            text-align: left;
            border-left: 2px solid rgba(255,255,255,.18);
            padding-left: .45rem;
            line-height: 1;
        }
        .swap-asset.player .swap-asset-tag { border-left-color: #e2e8f0; color: #e2e8f0; }
        .swap-asset.pick   .swap-asset-tag { border-left-color: #f59e0b; color: #fbbf24; }
        .swap-asset.fa     .swap-asset-tag { border-left-color: #22c55e; color: #4ade80; }
        .swap-asset-body  { display: flex; flex-direction: column; min-width: 0; gap: .12rem; }
        .swap-asset-name {
            font-family: 'Lexend', sans-serif;
            font-weight: 800; font-size: 1rem;
            color: #fff; letter-spacing: .02em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .swap-asset-meta {
            font-family: 'Lexend', sans-serif;
            font-size: .7rem;
            color: rgba(255,255,255,.5);
            letter-spacing: .04em;
        }
        .swap-asset-meta .swap-from {
            color: rgba(255,255,255,.35);
            font-weight: 600;
            letter-spacing: .14em;
            font-size: .62rem;
        }
        .swap-asset-value {
            font-family: 'Lexend', sans-serif;
            font-weight: 900;
            font-size: .92rem;
            color: #fff;
            font-variant-numeric: tabular-nums;
            letter-spacing: .02em;
        }
        .swap-asset-value.muted { color: rgba(255,255,255,.4); font-weight: 700; }

        .swap-empty {
            font-family: 'Lexend', sans-serif;
            letter-spacing: .24em;
            font-size: .72rem;
            font-weight: 700;
            color: rgba(255,255,255,.3);
            padding: 1rem 0;
            text-align: left;
            border-top: 1px solid rgba(255,255,255,.06);
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        /* Footer summary strip */
        .swap-totals {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: rgba(255,255,255,.08);
            border-top: 1px solid rgba(255,255,255,.08);
        }
        .swap-total {
            background: #07080b;
            padding: .85rem 1.1rem;
            display: flex; flex-direction: column; gap: .25rem;
        }
        .swap-total-label {
            font-family: 'Lexend', sans-serif;
            font-size: .58rem; font-weight: 800;
            letter-spacing: .26em;
            color: rgba(255,255,255,.4);
        }
        .swap-total-value {
            font-family: 'Lexend', sans-serif;
            font-weight: 900; font-size: 1.25rem;
            color: #fff;
            font-variant-numeric: tabular-nums;
            letter-spacing: .01em;
        }

        @media (max-width: 720px) {
            .swap-grid { grid-template-columns: 1fr !important; }
            .swap-team + .swap-team { border-left: none; border-top: 1px solid rgba(255,255,255,.08); }
            .swap-totals { grid-template-columns: 1fr 1fr; }
            .team-grid-picker { grid-template-columns: repeat(4, 1fr); }
        }


        /* ═══════════════════════════════════════════════════════════════════
           MODERN REDESIGN OVERRIDES — Trade Machine
           ═══════════════════════════════════════════════════════════════════ */

        /* Board: lighter, more refined surface */
        .tm-board {
            background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
            border: 1px solid #e8ecf3;
            border-radius: 18px;
            padding: 1.5rem 1.5rem 1.75rem;
            box-shadow: 0 1px 0 rgba(255,255,255,.8) inset,
                        0 2px 4px rgba(15,23,42,.04),
                        0 24px 48px -28px rgba(0,26,87,.18);
        }
        .tm-board::before {
            height: 4px;
            background: var(--sixers-blue);
            border-radius: 18px 18px 0 0;
        }

        /* CBA bar: airy pills with vertical accents */
        .cba-bar {
            gap: .75rem;
            padding: .25rem .25rem 1.25rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px dashed #e6eaf2;
        }
        .cba-bar-title {
            background: linear-gradient(135deg, #001a57, #006BB6);
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            font-size: .9rem; letter-spacing: .22em;
            margin-right: 1.5rem;
        }
        .cba-stat {
            padding: .35rem 1rem .35rem 1rem;
            border-left: 2px solid #e6eaf2;
            transition: border-color .2s;
        }
        .cba-stat:hover { border-left-color: var(--sixers-blue); }
        .cba-stat-val { font-size: 1.25rem; }
        .cba-stat-key { font-size: .58rem; letter-spacing: .18em; color: #93a0b5; margin-top: 4px; }
        .cba-divider { display: none; }

        /* Team grid: a touch more breathing room */
        .trade-grid { gap: 1.5rem; margin-bottom: 0; }

        /* Team card: cleaner, lifted, branded */
        .team-card {
            border: 1px solid #e8ecf3;
            border-radius: 16px;
            box-shadow: 0 1px 2px rgba(15,23,42,.04),
                        0 12px 32px -20px rgba(0,26,87,.18);
            background: #ffffff;
            overflow: hidden;
        }
        .team-card:hover {
            border-color: #d2dbeb;
            box-shadow: 0 1px 2px rgba(15,23,42,.04),
                        0 18px 44px -22px rgba(0,107,182,.32);
            transform: translateY(-1px);
        }

        /* Team card HEADER — light surface, matches site-wide card language */
        .team-card-header {
            background: var(--surface-soft, #f6f8fc);
            min-height: 68px;
            border-radius: 16px 16px 0 0;
            border-bottom: 1px solid var(--border-light);
        }
        .team-card-header::after { content: none; }
        .team-card-header:hover .team-header-inner { background: rgba(0,107,182,.03); }
        .team-header-inner { padding: .9rem 1rem .9rem 1.1rem; gap: 1rem; position: relative; z-index: 1; }
        .team-header-label {
            font-size: .58rem;
            letter-spacing: .24em;
            color: var(--mid);
            font-weight: 800;
            margin-bottom: 5px;
        }
        .team-header-name { font-size: 1.15rem; letter-spacing: .04em; color: var(--ink); }
        .team-header-name.placeholder {
            color: var(--mid);
            font-style: normal;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: .08em;
        }
        .team-header-chevron {
            background: #fff;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 6px;
            color: var(--mid);
        }
        .team-card-header:hover .team-header-chevron { background: rgba(0,107,182,.08); color: var(--sixers-blue); border-color: rgba(0,107,182,.3); }
        .team-card-header.open .team-header-chevron { background: var(--sixers-blue); color: #fff; border-color: var(--sixers-blue); }
        .team-remove-btn { border-left: 1px solid var(--border-light); position: relative; z-index: 2; color: var(--mid); }
        .team-remove-btn:hover { background: rgba(237,23,76,.08); color: var(--sixers-red); }

        /* Tabs: modern segmented control */
        .team-tabs {
            background: #f6f8fc;
            padding: .35rem;
            margin: .85rem .85rem 0;
            border-radius: 10px;
            border: 1px solid #eaeef5;
            gap: .15rem;
        }
        .team-tab {
            border-radius: 7px;
            padding: .55rem .9rem;
            font-size: .68rem;
            top: 0;
            border-bottom: none !important;
            color: #6b7790;
        }
        .team-tab.active {
            background: #ffffff;
            color: var(--sixers-blue);
            box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 2px 8px -4px rgba(0,107,182,.25);
        }
        .team-tab:hover:not(.active) { background: rgba(255,255,255,.6); color: var(--ink); }

        /* Empty state: refined, branded */
        .empty-state {
            padding: 3rem 1.5rem 3.25rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1.1rem;
            text-align: center;
        }
        .empty-state-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            background:
                radial-gradient(120% 120% at 0% 0%, rgba(0,107,182,.10), transparent 60%),
                linear-gradient(160deg, #ffffff 0%, #eef2fb 100%);
            border: 1px solid #e2e8f3;
            box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 28px -16px rgba(0,107,182,.35);
            display: flex; align-items: center; justify-content: center;
            opacity: 1; position: relative;
            color: var(--sixers-blue);
        }
        .empty-state-icon::before {
            content: '';
            width: 26px; height: 26px;
            border-radius: 50%;
            border: 2px solid currentColor;
            background:
                linear-gradient(currentColor, currentColor) center/100% 2px no-repeat,
                linear-gradient(currentColor, currentColor) center/2px 100% no-repeat;
            opacity: .85;
        }
        .empty-state-text {
            font-family: 'Lexend', sans-serif;
            font-size: .9rem;
            color: #475066;
            font-weight: 600;
            line-height: 1.45;
            max-width: 240px;
        }

        /* Footer: cleaner, branded link */
        .team-card-footer {
            background: linear-gradient(180deg, #ffffff 0%, #f7f9fd 100%);
            border-top: 1px solid #eef1f6;
            padding: .9rem 1.25rem;
        }
        .footer-label { font-size: .62rem; letter-spacing: .16em; color: #93a0b5; }
        .footer-value { font-size: 1.05rem; color: var(--ink); margin-top: 2px; }
        .footer-sending { color: var(--sixers-blue); font-weight: 700; font-size: .78rem; letter-spacing: .04em; }

        /* ═══ TEAM DROPDOWN → FULLSCREEN COMMAND PALETTE MODAL ═══ */
        body:has(.team-dropdown.open) { overflow: hidden; }
        body:has(.team-dropdown.open)::before {
            content: '';
            position: fixed; inset: 0;
            background: rgba(13,15,26,.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 9000;
            animation: tmFadeIn .18s ease-out;
        }
        @keyframes tmFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes tmModalIn {
            from { opacity: 0; transform: translate(-50%, -48%) scale(.96); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .team-dropdown {
            /* Override absolute positioning */
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            right: auto !important;
            transform: translate(-50%, -50%);
            width: min(960px, calc(100vw - 32px));
            max-width: 960px;
            max-height: min(720px, calc(100vh - 64px)) !important;
            z-index: 9999;
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-top: 1px solid var(--border-light);
            border-radius: 18px;
            box-shadow: 0 32px 80px rgba(15,23,42,.3);
            padding-bottom: .5rem;
        }
        .team-dropdown.open { animation: tmModalIn .22s cubic-bezier(.2,.9,.3,1.1); }

        .team-dropdown-search {
            padding: 1.1rem 1.25rem .9rem;
            border-bottom: 1px solid var(--border-light);
        }
        .team-dropdown-search input {
            font-size: 1rem;
            padding: .85rem 1rem .85rem 2.6rem;
            border-radius: 10px;
            background: var(--surface-soft, #f4f6fa);
            border: 1px solid var(--border-light);
            color: var(--ink);
        }
        .team-dropdown-search input::placeholder { color: var(--mid-2, #94a3b8); }
        .team-dropdown-search input:focus {
            background: #fff;
            border-color: var(--sixers-blue);
            box-shadow: 0 0 0 4px rgba(0,107,182,.1);
        }
        .team-dropdown-search-icon { left: 1.85rem; color: var(--mid); }
        .team-dropdown-search-icon svg, .team-dropdown-search svg { width: 16px; height: 16px; }

        /* Switch dropdown list to a clean grid showing all teams without scroll */
        .team-dropdown-list {
            padding: .5rem 1.25rem 1.25rem;
            overflow-y: auto;
        }
        .team-grid-picker { padding: 1rem 0 .25rem; }
        .team-grid-section-label {
            font-family: 'Lexend', sans-serif;
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: .22em;
            color: var(--mid);
            padding: 0 .25rem .75rem;
            display: flex; align-items: center; gap: .75rem;
        }
        .team-grid-section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }

        /* The actual team grid — 5 cols desktop, responsive */
        .team-grid-picker {
            display: block;
        }
        .team-grid-picker .team-grid-section-label { grid-column: 1 / -1; }
        .team-grid-picker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: .6rem;
            row-gap: .6rem;
        }
        @media (max-width: 720px) {
            .team-grid-picker { grid-template-columns: repeat(3, 1fr); }
            .team-dropdown { width: calc(100vw - 16px); max-height: calc(100vh - 32px) !important; }
        }
        @media (max-width: 420px) {
            .team-grid-picker { grid-template-columns: repeat(2, 1fr); }
        }

        .team-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .45rem;
            padding: .9rem .5rem .75rem;
            background: #fff;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            cursor: pointer;
            transition: transform .15s ease, background .15s, border-color .15s, box-shadow .15s;
            position: relative;
        }
        .team-tile:hover {
            background: rgba(0,107,182,.05);
            border-color: rgba(0,107,182,.35);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -8px rgba(0,107,182,.25);
        }
        .team-tile.selected {
            background: rgba(0,107,182,.08);
            border-color: var(--sixers-blue);
            box-shadow: 0 0 0 1px var(--sixers-blue) inset;
        }
        .team-tile.disabled {
            opacity: .3;
            pointer-events: none;
            filter: grayscale(.6);
        }
        .team-tile-logo {
            width: 44px; height: 44px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(15,23,42,.12));
        }
        .team-tile-abbr {
            font-family: 'Lexend', sans-serif;
            font-weight: 800;
            font-size: .7rem;
            letter-spacing: .14em;
            color: var(--mid);
        }
        .team-tile:hover .team-tile-abbr,
        .team-tile.selected .team-tile-abbr { color: var(--sixers-blue); }

        

        /* ── Trade Tools (Find Filler / Why blocked / Cap Outlook) ── */
        .tools-row {
            display: flex; gap: .5rem; flex-wrap: wrap;
            padding: .6rem 1rem .75rem;
            background: linear-gradient(180deg, #f9fafc 0%, #f3f5fa 100%);
            border-top: 1px solid var(--border-light);
        }
        .tool-btn {
            flex: 1; min-width: 0;
            display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
            background: white; border: 1px solid var(--border-light);
            color: var(--ink);
            font-family: 'Lexend', sans-serif; font-weight: 800;
            font-size: .72rem; letter-spacing: .12em;
            padding: .55rem .6rem; border-radius: 8px; cursor: pointer;
            transition: all .15s ease;
        }
        .tool-btn:hover:not(:disabled) {
            border-color: var(--sixers-blue);
            color: var(--sixers-blue);
            background: rgba(0,107,182,.04);
            transform: translateY(-1px);
        }
        .tool-btn:disabled { opacity: .45; cursor: not-allowed; }
        .tool-btn svg { color: var(--sixers-blue); }
        .tool-btn.primary {
            background: linear-gradient(135deg, var(--sixers-blue) 0%, #0080d4 100%);
            color: white; border-color: transparent;
        }
        .tool-btn.primary svg { color: white; }
        .tool-btn.primary:hover:not(:disabled) { color: white; background: linear-gradient(135deg, #0080d4, #00a0ff); }

        /* Filler modal */
        .filler-overlay {
            position: fixed; inset: 0; background: rgba(8,12,28,.65);
            backdrop-filter: blur(4px);
            z-index: 9999; display: none;
            align-items: center; justify-content: center;
            padding: 1rem;
        }
        .filler-overlay.open { display: flex; }
        .filler-box {
            background: white; border-radius: 16px;
            max-width: 720px; width: 100%; max-height: 88vh; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 30px 80px rgba(0,0,0,.5);
        }
        .filler-head {
            background: var(--surface-soft, #f6f8fc);
            border-bottom: 1px solid var(--border-light);
            color: var(--ink); padding: 1rem 1.3rem;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        }
        .filler-head-title {
            font-family: 'Lexend', sans-serif;
            font-weight: 900; font-size: 1.1rem; letter-spacing: .1em;
            color: var(--ink);
            display: flex; align-items: center; gap: .55rem;
        }
        .filler-head-title::before {
            content: ''; width: 4px; height: 18px; background: var(--sixers-blue); border-radius: 2px; flex-shrink: 0;
        }
        .filler-head-sub {
            font-family: 'Lexend', sans-serif; font-size: .72rem; color: var(--mid); margin-top: 2px;
        }
        .filler-close {
            background: rgba(0,0,0,.06); border: none; color: var(--mid); cursor: pointer;
            border-radius: 8px; width: 32px; height: 32px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: background .15s;
        }
        .filler-close:hover { background: rgba(220,38,38,.1); color: var(--sixers-red); }
        .filler-body { padding: 1rem 1.3rem; overflow-y: auto; }
        .filler-meta {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem;
            margin-bottom: 1rem;
        }
        .filler-meta-card {
            background: #f7f8fc; border: 1px solid var(--border-light);
            border-radius: 10px; padding: .55rem .75rem;
        }
        .filler-meta-label {
            font-family: 'Lexend', sans-serif; font-size: .58rem;
            font-weight: 800; letter-spacing: .14em;
            color: var(--mid);
        }
        .filler-meta-val {
            font-family: 'Lexend', sans-serif; font-size: 1.05rem;
            font-weight: 900; color: var(--ink); margin-top: 2px;
        }
        .filler-section-label {
            font-family: 'Lexend', sans-serif; font-size: .68rem;
            font-weight: 800; letter-spacing: .14em;
            color: var(--mid); margin: .25rem 0 .5rem;
        }
        .filler-suggestion {
            display: flex; align-items: center; gap: .65rem;
            padding: .65rem .8rem;
            background: white; border: 1px solid var(--border-light);
            border-left: 3px solid var(--sixers-blue);
            border-radius: 10px; margin-bottom: .45rem;
            transition: all .15s;
        }
        .filler-suggestion:hover { box-shadow: 0 4px 12px rgba(0,0,0,.06); transform: translateX(2px); }
        .filler-suggestion-info { flex: 1; min-width: 0; }
        .filler-suggestion-names {
            font-family: 'Lexend', sans-serif; font-size: .92rem;
            font-weight: 900; color: var(--ink); letter-spacing: .03em;
            line-height: 1.15;
        }
        .filler-suggestion-meta {
            font-family: 'Lexend', sans-serif; font-size: .7rem;
            color: var(--mid); margin-top: 2px;
            display: flex; align-items: center; gap: .4rem; flex-wrap: wrap;
        }
        .filler-suggestion-meta .pill {
            background: rgba(22,163,74,.12); color: #15803d;
            font-weight: 700; padding: 1px 6px; border-radius: 4px;
            font-size: .62rem; letter-spacing: .06em;
        }
        .filler-suggestion-meta .pill.warn { background: rgba(202,138,4,.14); color: #a16207; }
        .filler-suggestion-apply {
            background: var(--sixers-blue); color: white; border: none;
            font-family: 'Lexend', sans-serif; font-weight: 800;
            font-size: .72rem; letter-spacing: .1em;
            padding: .5rem .85rem; border-radius: 7px; cursor: pointer;
            transition: all .15s; flex-shrink: 0;
        }
        .filler-suggestion-apply:hover { background: #0080d4; }
        .filler-empty {
            text-align: center; padding: 2rem 1rem;
            font-family: 'Lexend', sans-serif; font-size: .85rem; color: var(--mid);
        }

        /* Apron Consequences card */
        .consequences-section { margin-top: 1.5rem; }
        .consequence-card {
            background: linear-gradient(180deg, #fff 0%, #fbfcff 100%);
            border: 1px solid var(--border-light);
            border-left: 4px solid var(--sixers-blue);
            border-radius: 12px;
            padding: .9rem 1.1rem;
            margin-bottom: .7rem;
        }
        .consequence-card.warn { border-left-color: var(--orange); }
        .consequence-card.danger { border-left-color: var(--red); }
        .consequence-card-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: .55rem;
        }
        .consequence-card-team {
            font-family: 'Lexend', sans-serif; font-size: 1rem;
            font-weight: 900; letter-spacing: .04em;
            color: var(--ink);
            display: flex; align-items: center; gap: .5rem;
        }
        .consequence-card-team .dot { width: 9px; height: 9px; border-radius: 50%; }
        .consequence-card-tier {
            font-family: 'Lexend', sans-serif; font-size: .65rem;
            font-weight: 800; letter-spacing: .12em;
            padding: .25rem .6rem; border-radius: 999px;
            background: rgba(220,38,38,.1); color: var(--red);
        }
        .consequence-card-tier.warn { background: rgba(234,88,12,.12); color: var(--orange); }
        .consequence-list {
            display: flex; flex-direction: column; gap: .4rem;
        }
        .consequence-item {
            display: flex; gap: .55rem; align-items: flex-start;
            padding: .5rem .65rem;
            background: rgba(220,38,38,.04);
            border-radius: 7px;
            font-family: 'Lexend', sans-serif; font-size: .78rem; color: var(--ink);
            line-height: 1.4;
        }
        .consequence-item.warn { background: rgba(234,88,12,.05); }
        .consequence-item.ok { background: rgba(22,163,74,.05); }
        .consequence-item-icon {
            flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
            background: var(--red); color: white;
            display: inline-flex; align-items: center; justify-content: center;
            font-family: 'Lexend', sans-serif; font-weight: 900; font-size: .7rem;
            margin-top: 1px;
        }
        .consequence-item.warn .consequence-item-icon { background: var(--orange); }
        .consequence-item.ok .consequence-item-icon { background: var(--green); }
        .consequence-cba-link {
            font-family: 'Lexend', sans-serif; font-size: .65rem; font-weight: 700;
            color: var(--sixers-blue); margin-left: 4px; text-decoration: none;
            border-bottom: 1px dashed rgba(0,107,182,.4);
        }
        .consequence-cba-link:hover { color: var(--sixers-red); border-color: var(--sixers-red); }

        /* 3-Year Cap Outlook chart */
        .outlook-section { margin-top: 1.5rem; }
        .outlook-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: .8rem;
        }
        .outlook-card {
            background: white; border: 1px solid var(--border-light);
            border-radius: 12px; padding: .85rem 1rem;
        }
        .outlook-head {
            display: flex; align-items: center; gap: .5rem;
            margin-bottom: .65rem;
        }
        .outlook-head-name {
            font-family: 'Lexend', sans-serif; font-size: .92rem;
            font-weight: 900; letter-spacing: .04em;
            color: var(--ink);
        }
        .outlook-chart {
            position: relative; width: 100%; height: 150px;
        }
        .outlook-chart svg { width: 100%; height: 100%; display: block; }
        .outlook-legend {
            display: flex; gap: .8rem; flex-wrap: wrap;
            margin-top: .55rem;
            font-family: 'Lexend', sans-serif; font-size: .62rem; color: var(--mid);
        }
        .outlook-legend span { display: inline-flex; align-items: center; gap: .3rem; }
        .outlook-legend .swatch { width: 10px; height: 2px; display: inline-block; }
        .outlook-disclaimer {
            font-family: 'Lexend', sans-serif; font-size: .62rem;
            color: var(--mid); margin-top: .5rem; font-style: italic;
            line-height: 1.4;
        }

        /* ── Board toolbar (replaces hero Reset/Add Team) ── */
        .board-toolbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 1rem; flex-wrap: wrap;
            margin: .25rem 0 1rem;
            padding: .55rem .9rem;
            background: linear-gradient(180deg, #ffffff 0%, #f7f8fc 100%);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-shadow: 0 1px 0 rgba(15,23,42,.02);
        }
        .board-toolbar-label {
            font-family: 'Lexend', sans-serif;
            font-size: .72rem; font-weight: 800; letter-spacing: .18em; color: var(--mid);
        }
        .board-toolbar-actions { display: flex; align-items: center; gap: .5rem; }
        .board-btn {
            display: inline-flex; align-items: center; gap: .55rem;
            font-family: 'Lexend', sans-serif; font-weight: 800;
            font-size: .95rem; letter-spacing: .12em;
            padding: .8rem 1.5rem; border-radius: 10px; cursor: pointer;
            transition: all .18s ease; border: 1.5px solid transparent;
            min-height: 44px;
        }
        .board-btn-ghost {
            background: white; color: var(--mid);
            border-color: var(--border-light);
        }
        .board-btn-ghost:hover {

    // ─── CBA CONSTANTS 2026-27 ──────────────────────────────────────────────
    const CBA = {
        salaryCap:    165_000_000,
        luxuryTax:    201_000_000,
        firstApron:   209_000_000,
        secondApron:  222_000_000,
        cashLimit:      6_000_000,
        minSalary:      1_200_000,
        biAnnual:       5_000_000,
        taxpayerMLE:    5_700_000,
        nonTaxpayerMLE: 13_200_000,
        // Salary-matching bands (Art. VII §6(j)) for teams that will remain BELOW the First Apron.
        // Three-band structure, projected/scaled for 2026-27, chosen so the bands are continuous
        // (2x+buffer meets flat-add at matchBand1; flat-add meets 1.25x+buffer at matchBand2).
        matchBand1:   7_250_000,
        matchBand2:  29_000_000,
        matchFlatAdd: 7_500_000,
        matchBuffer:    250_000,
        // Minimum Player Salary Exception ceiling (the "2-years-of-service" veteran minimum figure,
        // not the acquiring team's own minimum) — incoming players at/under this do not count
        // against a team's salary-matching requirement, regardless of apron status.
        minExceptionCap: 3_700_000,
    };

    // ─── SALARY MATCHING HELPERS (Art. VII §6(j)) ───────────────────────────
    // Below the First Apron: three-band formula. At/above the First Apron
    // (post-2023-24 transition year): flat 100% match, no buffer, no 110% rule.
    function standardMatchMax(outgoing) {
        if (outgoing <= 0) return 0;
        if (outgoing <= CBA.matchBand1) return 2.0 * outgoing + CBA.matchBuffer;
        if (outgoing <= CBA.matchBand2) return outgoing + CBA.matchFlatAdd;
        return 1.25 * outgoing + CBA.matchBuffer;
    }
    function standardMatchMin(incoming) {
        if (incoming <= 0) return 0;
        const t1 = standardMatchMax(CBA.matchBand1);
        const t2 = standardMatchMax(CBA.matchBand2);
        if (incoming <= t1) return (incoming - CBA.matchBuffer) / 2.0;
        if (incoming <= t2) return incoming - CBA.matchFlatAdd;
        return (incoming - CBA.matchBuffer) / 1.25;
    }
    function apronMatchMax(outgoing) { return outgoing; } // 100%, no buffer
    function apronMatchMin(incoming) { return incoming; } // 100%, no buffer

    // ─── ESPN TEAM LOGO MAPPING ─────────────────────────────────────────────
    const ESPN_TEAM_CODE = {
        ATL:'atl', BOS:'bos', BKN:'bkn', CHA:'cha', CHI:'chi', CLE:'cle',

    function teamLogoUrl(abbr) {
        const code = ESPN_TEAM_CODE[abbr] || (abbr || '').toLowerCase();
        return `https://a.espncdn.com/i/teamlogos/nba/500/${code}.png`;
    }

    // ─── ALL 30 NBA TEAMS ───────────────────────────────────────────────────
    const NBA_TEAMS = {
        'ATL': { name: 'Atlanta Hawks',          color: '#E03A3E', conference: 'East' },
        'BOS': { name: 'Boston Celtics',          color: '#007A33', conference: 'East' },

        'CHI': { name: 'Chicago Bulls',           color: '#CE1141', conference: 'East' },

        'DEN': { name: 'Denver Nuggets',          color: '#0E2240', conference: 'West' },
        'DET': { name: 'Detroit Pistons',         color: '#C8102E', conference: 'East' },
        'GSW': { name: 'Golden State Warriors',   color: '#1D428A', conference: 'West' },
        'HOU': { name: 'Houston Rockets',         color: '#CE1141', conference: 'West' },
        'IND': { name: 'Indiana Pacers',          color: '#002D62', conference: 'East' },
        'LAC': { name: 'LA Clippers',             color: '#C8102E', conference: 'West' },
        'LAL': { name: 'Los Angeles Lakers',      color: '#552583', conference: 'West' },

    // ─── STATE ──────────────────────────────────────────────────────────────

    // ─── INIT ────────────────────────────────────────────────────────────────
    function init() {
        addTeam();
        addTeam();

    function addTeam() {
        if (teams.length >= 5) return;
        const id = nextId++;
        teams.push({ id, abbr: null, selectedPlayers: [], selectedPicks: [], selectedTPEs: [], faSignings: [], activeTab: 'roster', playerDestinations: {}, cashOut: 0 });
        renderAll();
    }

    function removeTeam(id) {
        if (teams.length <= 2) return;
        teams = teams.filter(t => t.id !== id);
        renderAll();
    }

    function clearAll() {
        teams = [];
        nextId = 0;
        document.getElementById('resultPanel').classList.remove('visible');
        addTeam();
        addTeam();
    }

    function setTeam(id, abbr) {
        const t = teams.find(t => t.id === id);
        if (!t) return;
        t.abbr = abbr || null;
        t.selectedPlayers = [];
        t.selectedPicks = [];
        t.selectedTPEs = [];
        t.faSignings = [];
        t.playerDestinations = {};
        t.cashOut = 0;
        renderAll();
    }

    function setTab(id, tab) {
        const t = teams.find(t => t.id === id);
        if (!t) return;
        t.activeTab = tab;
        renderAll();
    }

    function togglePlayer(teamId, playerId) {
        const t = teams.find(t => t.id === teamId);
        if (!t) return;
        const idx = t.selectedPlayers.indexOf(playerId);
        if (idx >= 0) {
            t.selectedPlayers.splice(idx, 1);
            if (t.playerDestinations) delete t.playerDestinations[playerId];
        } else {
            t.selectedPlayers.push(playerId);
        }
        updateStats();
        renderTeamCard(teamId);
    }

    function togglePick(teamId, pickId) {
        const t = teams.find(t => t.id === teamId);
        if (!t) return;
        const idx = t.selectedPicks.indexOf(pickId);
        if (idx >= 0) t.selectedPicks.splice(idx, 1);
        else t.selectedPicks.push(pickId);
        updateStats();
        renderTeamCard(teamId);
    }

    function toggleTPE(teamId, tpeId) {
        const t = teams.find(t => t.id === teamId);
        if (!t) return;
        const idx = t.selectedTPEs.indexOf(tpeId);
        if (idx >= 0) t.selectedTPEs.splice(idx, 1);
        else t.selectedTPEs.push(tpeId);
        updateStats();
        renderTeamCard(teamId);
    }
